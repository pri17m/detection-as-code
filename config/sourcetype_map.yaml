# Canonical Splunk sourcetype allowlist for Detection-as-Code (Windows telemetry)
# CI MUST reject detection rules that reference sourcetypes not listed under
# allowed_sourcetypes (exact string match after macro expansion).
#
# Repo path: config/sourcetype_map.yaml
# Companion docs:
#   - docs/telemetry/windows-splunk.md  (recommended future home)
#   - /workspace/dac-windows-splunk-telemetry.md (research deliverable)
#
# Prefer sourcetype=… in rules. Never hardcode index=. Optional index macros
# live in org config (see org.example.yaml placeholders below).
#
# Notes on TA influence:
# - Splunk Add-on for Microsoft Windows >= 5.0: channel often in `source`,
#   sourcetype collapses to WinEventLog (classic) or XmlWinEventLog (XML).
# - Pre-5.0 / many production installs still use compound sourcetypes
#   (e.g. WinEventLog:Security, XmlWinEventLog:Security). BOTH are allowed.
# - Splunk Add-on for Sysmon: prefers XML; sourcetype XmlWinEventLog with
#   source=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational, OR compound
#   XmlWinEventLog:Microsoft-Windows-Sysmon/Operational. Legacy: sysmon / sysmon:*.

version: 1
platform: splunk
telemetry_family: windows

# ---------------------------------------------------------------------------
# Canonical allowed sourcetype strings (FIRST set = Windows)
# ---------------------------------------------------------------------------
allowed_sourcetypes:
  # --- Windows Security ---
  - WinEventLog:Security
  - XmlWinEventLog:Security
  - WinEventLog                 # TA >=5 classic; filter with source=*Security*
  - XmlWinEventLog              # TA >=5 XML; filter with source=*Security* / *System* / *Sysmon* / *PowerShell*

  # --- Windows System ---
  - WinEventLog:System
  - XmlWinEventLog:System

  # --- PowerShell Operational (module/script block: 4103/4104) ---
  - WinEventLog:Microsoft-Windows-PowerShell/Operational
  - XmlWinEventLog:Microsoft-Windows-PowerShell/Operational

  # --- PowerShell classic channel (engine: 400/403/600) ---
  - WinEventLog:Windows PowerShell
  - XmlWinEventLog:Windows PowerShell

  # --- Sysmon ---
  - XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
  - WinEventLog:Microsoft-Windows-Sysmon/Operational  # classic render (not preferred; TA fields incomplete)
  - sysmon
  - "sysmon:*"                  # glob form used in some orgs / legacy TAs

  # --- VMware ESXi syslog (Splunk Add-on for VMware ESXi Logs) ---
  - vmw-syslog
  - "vmware:esxlog*"            # glob; test data also uses source=vmware:esxlog

  # --- VMware vCenter vpxd syslog (vclog / SC4S / Splunk Add-on for vCenter Logs) ---
  - vmware:vclog
  - "vmware:vclog:*"             # SC4S / TA form e.g. vmware:vclog:vpxd

# ---------------------------------------------------------------------------
# Optional: source= patterns that pair with collapsed sourcetypes
# (not CI-enforced as sourcetype strings; documented for rule authors)
# ---------------------------------------------------------------------------
source_patterns:
  security:
    - WinEventLog:Security
    - XmlWinEventLog:Security
    - WMI:WinEventLog:Security
  system:
    - WinEventLog:System
    - XmlWinEventLog:System
    - WMI:WinEventLog:System
  powershell_operational:
    - WinEventLog:Microsoft-Windows-PowerShell/Operational
    - XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
  powershell_classic:
    - "WinEventLog:Windows PowerShell"
    - "XmlWinEventLog:Windows PowerShell"
  sysmon:
    - XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    - WinEventLog:Microsoft-Windows-Sysmon/Operational
    - XmlWinEventLog:WEC-Sysmon   # WEF/WEC via Sysmon TA >=3.0 (uncertain naming in some orgs)

# ---------------------------------------------------------------------------
# Recommended search macros (org overrides index; rules use sourcetype macros)
# Implement as Splunk macros or DaC YAML macros expanded at build time.
# ---------------------------------------------------------------------------
macros:
  # Sourcetype-portability macros (PREFERRED in detections)
  windows_security:
    description: Security channel — classic + XML compound + collapsed XmlWinEventLog/WinEventLog
    suggested_definition: >-
      (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security
       OR (sourcetype=WinEventLog source=WinEventLog:Security)
       OR (sourcetype=XmlWinEventLog source=XmlWinEventLog:Security))
  windows_system:
    description: System channel variants
    suggested_definition: >-
      (sourcetype=WinEventLog:System OR sourcetype=XmlWinEventLog:System
       OR (sourcetype=WinEventLog source=WinEventLog:System)
       OR (sourcetype=XmlWinEventLog source=XmlWinEventLog:System))
  windows_powershell_operational:
    description: PowerShell Operational (4103/4104)
    suggested_definition: >-
      (sourcetype=WinEventLog:Microsoft-Windows-PowerShell/Operational
       OR sourcetype=XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
       OR (sourcetype=XmlWinEventLog source="*Microsoft-Windows-PowerShell/Operational")
       OR (sourcetype=WinEventLog source="*Microsoft-Windows-PowerShell/Operational"))
  windows_powershell_classic:
    description: Classic Windows PowerShell channel (400/403/600)
    suggested_definition: >-
      (sourcetype="WinEventLog:Windows PowerShell"
       OR sourcetype="XmlWinEventLog:Windows PowerShell"
       OR (sourcetype=WinEventLog source="*Windows PowerShell")
       OR (sourcetype=XmlWinEventLog source="*Windows PowerShell"))
  windows_sysmon:
    description: Sysmon Operational + legacy sysmon
    suggested_definition: >-
      (sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
       OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
       OR (sourcetype=XmlWinEventLog source="*Microsoft-Windows-Sysmon/Operational")
       OR sourcetype=sysmon OR sourcetype=sysmon:*)

  esxi_syslog:
    description: VMware ESXi syslog. Match field is Message. Do not hardcode index=.
    suggested_definition: "(sourcetype=vmw-syslog OR sourcetype=vmware:esxlog*)"

  vcenter_vclog:
    description: VMware vCenter vpxd syslog (vclog). Match class tokens in Message or _raw. Do not hardcode index=.
    suggested_definition: "(sourcetype=vmware:vclog OR sourcetype=vmware:vclog:*)"

  # Optional INDEX macros — org-specific; NEVER hardcode index= in rule bodies
  windows_security_index:
    description: Placeholder index constraint for Security events
    suggested_definition: "index=wineventlog"   # ORG OVERRIDE
  windows_system_index:
    description: Placeholder index constraint for System events
    suggested_definition: "index=wineventlog"   # ORG OVERRIDE
  windows_powershell_index:
    description: Placeholder index constraint for PowerShell events
    suggested_definition: "index=wineventlog"   # ORG OVERRIDE
  windows_sysmon_index:
    description: Placeholder index constraint for Sysmon events
    suggested_definition: "index=sysmon"        # ORG OVERRIDE

# Aliases: compound form ↔ collapsed form (documentation for CI / linters)
aliases:
  WinEventLog:Security:
    - { sourcetype: WinEventLog, source: WinEventLog:Security }
  XmlWinEventLog:Security:
    - { sourcetype: XmlWinEventLog, source: XmlWinEventLog:Security }
  WinEventLog:System:
    - { sourcetype: WinEventLog, source: WinEventLog:System }
  XmlWinEventLog:System:
    - { sourcetype: XmlWinEventLog, source: XmlWinEventLog:System }
  XmlWinEventLog:Microsoft-Windows-Sysmon/Operational:
    - { sourcetype: XmlWinEventLog, source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational }
  XmlWinEventLog:Microsoft-Windows-PowerShell/Operational:
    - { sourcetype: XmlWinEventLog, source: XmlWinEventLog:Microsoft-Windows-PowerShell/Operational }

ci:
  enforce: true
  match: exact_or_macro_expanded
  reject_hardcoded_index: true
  require_sourcetype_or_macro: true
