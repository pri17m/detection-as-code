name: validate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/validate/requirements.txt

      - name: Schema + portability + catalog field validation
        run: |
          python pipelines/validate/validate_repo.py

      - name: Telemetry field report (in-repo Windows + CloudTrail)
        run: |
          python pipelines/validate/validate_fields.py --in-repo --report content/validation/rule_field_report.json

      - name: Unit tests (catalog + field validation)
        run: |
          python -m unittest discover -s tests/validate -v

      - name: Smoke candidates (deterministic, no RuleAtlas/Jev network)
        run: |
          python pipelines/validate/validate_fields.py \
            --candidates content/validation/candidates.smoke.json \
            --report content/validation/rule_field_report.smoke.json

      - name: Rebuild MITRE coverage
        run: |
          python pipelines/validate/build_mitre_coverage.py

      - name: Ensure coverage.json is up to date
        run: |
          git diff --exit-code content/mitre/coverage.json

