id: DAC-CS-0156
title: 'Falcon: Credential access via netsh'
description: |
  detections.ai community gap-fill for: Credential access via netsh. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019fcd08-2a90-730f-aa12-63112fb0bf9f
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003
  - T1558
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019fcd08-2a90-730f-aa12-63112fb0bf9f
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1003/
- https://attack.mitre.org/techniques/T1558/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | ImageFileName=/\\netsh\.exe$/i
    | CommandLine=/(wlan|show\s+profile|key=clear|export)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
