id: DAC-CS-0147
title: 'Falcon: klist.exe Advanced Kerberos Subcommands – Recon via sessions, -li, get, purge'
description: |
  detections.ai community gap-fill for: klist.exe Advanced Kerberos Subcommands – Recon via sessions, -li, get, purge. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019f1ed9-2b98-77d5-b86e-0910f06c9f9d
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003
  - T1558
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019f1ed9-2b98-77d5-b86e-0910f06c9f9d
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1003/
- https://attack.mitre.org/techniques/T1558/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | ImageFileName=/\\klist\.exe$/i
    | CommandLine=/(sessions|\s-li\b|\bget\b|purge)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
