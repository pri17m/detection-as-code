    \ = /(nslookup|n\\^s\\^l\\^o\\^o\\^k\\^u\\^p).*(((-q|querytype|type)=?\\s*)?(txt|all)).*\\|.*findstr.*\\\
    |.*for \\/f.*\\|.*cmd/i\n| ParentBaseFileName != /services\\.exe|monitoring_agent\\.exe/i\n| groupBy([aid,\
    \ ComputerName, ImageFileName, CommandLine], function=count())\n"
