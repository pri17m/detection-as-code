id: DAC-CS-0213
title: odbcconf REGSVR, response file, or driver install
description: >-
  odbcconf.exe is a signed Windows binary that can register a DLL (REGSVR), load a response file
  (-f), or install an ODBC driver. Those arguments are the LOLBAS proxy-execution paths for
  T1218.008. A hit means the command line contains REGSVR, INSTALLDRIVER, configsysdsn, or a -f/-F
  response file. Plain odbcconf /S does not match. Telemetry is Falcon ProcessRollup2 and
  ProcessBlocked on event_platform=Win. ImageFileName is the full path. ParentBaseFileName is the
  parent file name only. Offline command-line samples were replayed: the documented malicious
  lines match and the documented benign lines do not. telemetry_validated stays false until this
  search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.008
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "ODBC driver installers. Allowlist the parent image."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://attack.mitre.org/techniques/T1218/008/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0334
- parity:DAC-MDE-0067
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\odbcconf\.exe$/i
    | CommandLine=/(regsvr|installdriver|configsysdsn|(\s|^)[-/]f(\s|$))/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
