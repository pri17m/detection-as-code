author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1547/001/
title: 'Falcon: Registry Run key to user-writable path'
description: Run/RunOnce Details under Temp/Users/AppData
severity: high
telemetry_validated: false
platforms:
- crowdstrike
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-CS-0023
status: experimental
tags:
- wave-a
- P0
- parity:DAC-WIN-0111
query:
  crowdstrike: 'RegistryPath CONTAINS_ANY ["\\CurrentVersion\\Run","\\CurrentVersion\\RunOnce"] AND RegistryValue
    CONTAINS_ANY ["\\Temp\\","\\Users\\","\\AppData\\"]

    '
sourcetypes:
- falcon:process
mitre:
  tactics:
  - persistence
  techniques:
  - T1547.001
