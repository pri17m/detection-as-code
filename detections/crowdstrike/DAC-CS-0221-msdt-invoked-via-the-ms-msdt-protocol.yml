id: DAC-CS-0221
title: msdt invoked via the ms-msdt protocol
description: >-
  CVE-2022-30190 (Follina) launches msdt.exe through the ms-msdt: protocol (T1203). A hit requires
  that protocol string. The normal troubleshooter command msdt.exe /id PCWDiagnostic does not
  match. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1203
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A custom protocol handler that still calls ms-msdt."
references:
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-30190
- https://attack.mitre.org/techniques/T1203/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0343
- parity:DAC-MDE-0076
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\msdt\.exe$/i
    | CommandLine=/ms-msdt:/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
