id: DAC-CS-0221
title: msdt invoked via the ms-msdt protocol
description: >-
  Alerts when msdt.exe is started with the ms-msdt: protocol. Attackers use that protocol, as in
  Follina (CVE-2022-30190), to hand a document a path into the Microsoft Support Diagnostic Tool.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1203
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A custom protocol handler that still calls ms-msdt."
references:
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-30190
- https://attack.mitre.org/techniques/T1203/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0343
- parity:DAC-MDE-0076
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\msdt\.exe$/i
    | CommandLine=/ms-msdt:/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
