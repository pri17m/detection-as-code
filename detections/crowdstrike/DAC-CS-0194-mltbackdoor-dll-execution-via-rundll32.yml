id: DAC-CS-0194
title: 'Falcon: MLTBackdoor DLL Execution via Rundll32'
description: |
  detections.ai community gap-fill for: MLTBackdoor DLL Execution via Rundll32. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019ead53-4555-76ef-a8b1-20fff3eb1c49
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  - persistence
  techniques:
  - T1574.001
  - T1055
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019ead53-4555-76ef-a8b1-20fff3eb1c49
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1574/001/
- https://attack.mitre.org/techniques/T1055/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | ImageFileName=/\\rundll32\.exe$/i
    | CommandLine=/\.dll/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
