id: DAC-CS-0169
title: 'Falcon: Crypto mining preparation through MSR write access'
description: |
  detections.ai community gap-fill for: Crypto mining preparation through MSR write access. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a05c17-c726-756e-b951-557ed0dbdf27
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1059
  - T1036
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a05c17-c726-756e-b951-557ed0dbdf27
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1036/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(xmrig|minerd|nicehash|stratum|cryptonight|msr)/i OR ImageFileName=/(xmrig|minerd)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
