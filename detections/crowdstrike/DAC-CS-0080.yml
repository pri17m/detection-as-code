query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `leaknet_campaign_deno_runtime_klist_suspicious_execution_detection.yml`\
    \ \u2014 experimental sketch; not raw dump\n| ImageFileName=/\\\\deno(\\.exe)?$/i\n| AND ImageFileName=/\\\
    \\(Users\\\\[^\\\\]+\\\\AppData\\\\(Local|Roaming)|Temp|ProgramData)\\\\/i\n| ImageFileName=/\\\\\
    klist\\.exe$/i\n| AND ParentBaseFileName=/^(cmd|powershell|pwsh|wscript|cscript|mshta)\\.exe$/i\n\
    | ParentBaseFileName=/^deno(\\.exe)?$/i\n| AND ImageFileName=/\\\\(cmd|powershell|pwsh|net|net1|whoami|hostname|nltest|dsquery|quser|qwinsta|vssadmin|wbadmin|reg|wevtutil|ipconfig|systeminfo|tasklist|qprocess|schtasks|wmic|bitsadmin|certutil)\\\
    .exe$/i\n| ImageFileName=/\\\\deno(\\.exe)?$/i\n| AND CommandLine=/(eval|--allow-all|--allow-net|--allow-run|https?:\\\
    /\\/|atob\\(|base64|WebSocket|fetch\\()/i\n| ImageFileName=/\\\\deno(\\.exe)?$/i\n| AND ImageFileName=/\\\
    \\(Program Files|Program Files \\(x86\\)|tools|dev|repos|source|git)\\\\/i\n| groupBy([aid, ComputerName,\
    \ ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: LeakNet Campaign: Deno Runtime & Klist Suspicious Execution Detection'
