mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
severity: high
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
- aid
- ComputerName
- TargetProcessId
query:
  crowdstrike: '#event_simpleName=ProcessRollup2

    // Enhanced from Query-Hub ProcessRollup patterns (01b); keep prior intent

    // prior: falcon_ioa_pattern: ImageFileName in ["powershell.exe","pwsh.exe"] AND CommandLine CONTAINS_ANY
    ["-enc","-encodedcommand"]

    // --- src: applications_spawning_cmd_or_powershell.yml (Falcon: Applications Spawning CMD or Powershell)
    ---

    | "#event_simpleName" = ProcessRollup2 event_platform="Win" FileName=/(cmd.exe|powershell.exe)/i

    | rename(field="ParentBaseFileName", as="FileName")

    // --- src: Detect_and_Decode_Base64-Encoded_PowerShell_Commands.yml (Falcon: Detect and Decode Base64-Encoded
    PowerShell Commands) ---

    | CommandLine=/\s+\-(e|encoded|encodedcommand|enc)\s+/i

    | CommandLine=/\-(?<psEncFlag>(e|encoded|encodedcommand|enc))\s+/i

    | length("CommandLine", as="cmdLength")

    // CI-safe: avoid CQL splitString named index arg

    | EncodedString := regexExtract("CommandLine", regex="(?i)-(?:e|enc|encoded|encodedcommand)\\s+([A-Za-z0-9+/=]+)")

    | table([executionCount, uniqueEndpoitnCount, cmdLength, DecodedString, CommandLine])

    // --- src: Detect_and_Decode_Base64-Encoded_PowerShell_Commands-http.yml (Falcon: Detect and Decode
    Base64-Encoded PowerShell Commands) ---

    | CommandLine=/.*\s+\-(e|encoded|encodedcommand|enc)\s+.*/

    | length("CommandLine", as="cmdLength")

    | table([executionCount, uniqueEndpoitnCount, DecodedString, CommandLine])

    // --- src: Hunting_Powershell_Command_Length_Anomaly.yml (Falcon: Powershell Command Length Anomaly
    Detection) ---

    | ImageFileName=/\\(powershell(_ise)?|pwsh)\.exe/i

    | CommandLength := length("CommandLine") | CommandLength>0

    // --- src: Suspicious_PowerShell_Execution.yml (Falcon: Suspicious PowerShell Execution) ---

    | CommandLine=/\s-[eE^]{1,2}[nN][cC][oO][dD][eE][mM][aA][nN][dD^]+\s/i

    | table([aid, UserName, ParentImageFileName, ImageFileName, CommandLine])

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
tags:
- enhance-01b
- processrollup2
- qh:applications_spawning_cmd_or_powershell.yml
- qh:Detect_and_Decode_Base64-Encoded_PowerShell_Commands.yml
- qh:Detect_and_Decode_Base64-Encoded_PowerShell_Commands-http.yml
- qh:Hunting_Powershell_Command_Length_Anomaly.yml
- qh:Suspicious_PowerShell_Execution.yml
sourcetypes:
- falcon:process
telemetry_validated: false
references:
- https://www.crowdstrike.com/
platforms:
- crowdstrike
false_positives:
- Legitimate automation; tune by parent process or signer.
- ProcessRollup2 field patterns may be noisy until tenant baselined; keep telemetry_validated=false.
id: DAC-CS-0001
title: 'Falcon: PowerShell encoded command'
author: DaC
status: experimental
description: Detects PowerShell executions using encoded command patterns (Custom IOA candidate). Enhanced
  with Query-Hub ProcessRollup2 patterns (applications_spawning_cmd_or_powershell.yml, Detect_and_Decode_Base64-Encoded_PowerShell_Commands.yml,
  Detect_and_Decode_Base64-Encoded_PowerShell_Commands-http.yml, Hunting_Powershell_Command_Length_Anomaly.yml,
  Suspicious_PowerShell_Execution.yml).
