id: DAC-CS-0012
title: 'Falcon: bitsadmin transfer'
description: Starter Falcon IOA/correlation rule candidate.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1105
severity: medium
false_positives:
- Tune to your environment and allowlist known tooling.
references:
- https://www.crowdstrike.com/
telemetry_validated: false
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
query:
  crowdstrike: 'falcon_ioa_pattern: ImageFileName="bitsadmin.exe" AND CommandLine
    CONTAINS_ANY ["/transfer","/addfile"]

    '
