sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
status: experimental
author: DaC
description: Detects bitsadmin.exe transfer/addfile/download/SetNotifyCmdLine abuse and remote URL usage.
  ProcessRollup2 port of Query-Hub hunting_bitsadmin_usage (ScriptControlScanV2/CommandHistory branch
  deferred to SAFE PR2 only).
tags:
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- qh:hunting_bitsadmin_usage.yml
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1105
id: DAC-CS-0012
query:
  crowdstrike: '#event_simpleName=ProcessRollup2 event_platform=Win

    | ImageFileName=/\\bitsadmin\.exe$/i

    | CommandLine=/(\/transfer|\/addfile|\/download|\/SetNotifyCmdLine|\/resume|https?:\/\/|ftp:\/\/)/i

    | !in(field=ParentBaseFileName, values=["svchost.exe","msiexec.exe"], ignoreCase=true)

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
severity: medium
title: 'Falcon: bitsadmin transfer'
false_positives:
- "Legitimate BITS jobs from msiexec/svchost during software updates \u2014 ParentBaseFileName exclusions\
  \ applied; extend allowlist as needed."
- Admin transfer tooling using bitsadmin; baseline CommandLine.
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1105/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/hunting_bitsadmin_usage.yml
