id: DAC-CS-0189
title: 'Falcon: Security Software Discovery via Command Line'
description: |
  detections.ai community gap-fill for: Security Software Discovery via Command Line. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a078a4-73a3-74bc-a527-ff0885b87224
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1059
  - T1036
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a078a4-73a3-74bc-a527-ff0885b87224
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1036/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(security|software|discovery|command)/i OR ImageFileName=/(security|software|discovery|command)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
