id: DAC-CS-0010
title: 'Falcon: netsh firewall off'
description: Starter Falcon IOA/correlation rule candidate.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1562.004
severity: medium
false_positives:
- Tune to your environment and allowlist known tooling.
references:
- https://www.crowdstrike.com/
telemetry_validated: false
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
query:
  crowdstrike: 'falcon_ioa_pattern: ImageFileName="netsh.exe" AND CommandLine CONTAINS_ALL
    ["advfirewall","state","off"]

    '
