sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
status: experimental
author: DaC
description: Detects netsh disabling or weakening the Windows firewall (advfirewall state off / firewall
  set opmode disable / delete rule). SAFE ProcessRollup2 rewrite — FirewallSetRule-heavy Query-Hub Firewall_Rule_Additions.yml
  is THIN; uses ImageFileName+CommandLine predicates instead.
tags:
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- esn:ProcessBlocked
- qh:Firewall_Rule_Additions.yml
- rewrite:firewallsetrule-thin-to-pr2-netsh
- attack-v19-remap
mitre:
  tactics:
  - execution
  - defense-impairment
  techniques:
  - T1686
id: DAC-CS-0010
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])

    | event_platform=Win

    | ImageFileName=/netsh\.exe$/i

    | CommandLine=/(advfirewall\s+set\s+(currentprofile|allprofiles|domainprofile|privateprofile|publicprofile)\s+state\s+off|firewall\s+set\s+opmode\s+(mode=)?disable|advfirewall\s+firewall\s+(add|delete)\s+rule|interface\s+.*\s+(admin|enabled)\s*=\s*disable)/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
severity: medium
title: 'Falcon: netsh firewall off'
false_positives:
- Legitimate GPO/MDM or IT scripts that toggle firewall during provisioning — allowlist management parents.
- Softphone/VPN installers briefly adjusting firewall rules; baseline CommandLine before promote.
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1562/004/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Firewall_Rule_Additions.yml
- https://attack.mitre.org/resources/updates/updates-april-2026/
