id: DAC-CS-0252
title: "Java4Shell: Falcon Java or Tomcat service-account process starts cmd or PowerShell"
description: >-
  ProcessRollup2 (Windows) where cmd.exe, powershell.exe or pwsh.exe is started by java.exe, javaw.exe,
  a Commons Daemon Tomcat service image (tomcat.exe, tomcat9.exe, tomcat10.exe and the same pattern),
  prunsrv.exe, or a parent whose command line contains the procrun //RS// run-service switch, and the
  parent is running as NT AUTHORITY\NETWORK SERVICE or LOCAL SERVICE (SID S-1-5-20 or S-1-5-19). The
  parent account is taken from a left join to the parent's ProcessRollup2 (child ParentProcessId equals
  parent TargetProcessId on the same aid), looking back 7 days. When that parent event is outside the
  join window, as is common for a long-running service, the rule falls back to the child's UserSid,
  which inherits the service token on the first hop. Install paths that contain \Jenkins\ are excluded
  when the join returns the parent image path. Companion to DAC-MDE-0106. Field names are from public
  CrowdStrike logscale-community-content and the public join() documentation. telemetry_validated false.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- "falcon:process"
mitre:
  tactics:
  - initial-access
  - execution
  techniques:
  - T1190
  - T1059.003
  - T1059.001
severity: high
false_positives:
- "Java CI or build agents that run as NETWORK SERVICE or LOCAL SERVICE and whose parent image path is missing from the join, or does not contain \\Jenkins\\. Allowlist by ParentImageFileName after a baseline (not measured)."
- "Java or Tomcat services that shell out for backups, image conversion, mail or install/upgrade scripts. Allowlist the specific parent path and command line after a baseline (not measured)."
- "service.bat, catalina.bat or similar Tomcat helper scripts. Those are normally started by an administrator, not by the running service process."
references:
- "https://github.com/CrowdStrike/logscale-community-content/blob/main/Queries-Only/Helpful-CQL-Queries/Use%20Join%20on%20Two%20Scoped%20Events.md"
- "https://github.com/CrowdStrike/logscale-community-content/blob/main/Queries-Only/Helpful-CQL-Queries/ProcessRollup2%20Curation.md"
- "https://github.com/CrowdStrike/logscale-community-content/blob/main/Queries-Only/Helpful-CQL-Queries/Using%20correlate%28%29%20to%20hunt%20process%20lineage.md"
- "https://library.humio.com/crowdstrike-query-language/functions-join.html"
- "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table"
- "https://tomcat.apache.org/tomcat-9.0-doc/windows-service-howto.html"
- "https://attack.mitre.org/techniques/T1190/"
- "https://attack.mitre.org/techniques/T1059/003/"
- "https://attack.mitre.org/techniques/T1059/001/"
- "https://community.fortinet.com/fortiedr-20/threat-coverage-how-fortiedr-protects-against-confluence-cve-2022-26134-post-exploitation-activity-109660"
- "https://www.vulncheck.com/blog/confluence-dreams-of-shells"
- "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_java_susp_child_process_2.yml"
- "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml"
- "https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2023/Exploits/CVE-2023-22518/proc_creation_win_exploit_cve_2023_22518_confluence_tomcat_child_proc.yml"
telemetry_validated: false
required_fields:
- "#event_simpleName"
- "event_platform"
- "aid"
- "ComputerName"
- "ImageFileName"
- "CommandLine"
- "ParentBaseFileName"
- "ParentProcessId"
- "TargetProcessId"
- "UserSid"
- "UserName"
tags:
- behavioural
- java
- tomcat
- webshell
- needs-review
- "parity:DAC-MDE-0106"
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2 event_platform=Win
    | ImageFileName=/\\(cmd|powershell|pwsh)\.exe$/i
    | join({#event_simpleName=ProcessRollup2 event_platform=Win
        | (ImageFileName=/\\(java|javaw|prunsrv|tomcat[0-9]*)\.exe$/i OR CommandLine=/\/\/RS\/\//)
        | ParentUserSid := UserSid
        | ParentUserName := UserName
        | ParentImageFileName := ImageFileName
        | ParentCmdLine := CommandLine
      }, field=[aid, ParentProcessId], key=[aid, TargetProcessId], include=[ParentUserSid, ParentUserName, ParentImageFileName, ParentCmdLine], mode=left, start=7d)
    | ParentBaseFileName=/^(java|javaw|prunsrv|tomcat[0-9]*)\.exe$/i OR ParentCmdLine=/\/\/RS\/\//
    | case {
        ParentUserSid=/^S-1-5-(19|20)$/ | AccountMatch := "parent";
        (ParentUserSid="" OR !ParentUserSid=*) AND UserSid=/^S-1-5-(19|20)$/ | AccountMatch := "child_fallback";
        * | AccountMatch := "none";
      }
    | AccountMatch != "none"
    | !ParentImageFileName=/\\[Jj]enkins\\/
    | table([@timestamp, aid, ComputerName, AccountMatch, UserName, UserSid, ParentBaseFileName, ParentUserSid, ParentUserName, ParentImageFileName, ParentCmdLine, ImageFileName, CommandLine, ParentProcessId, TargetProcessId])
