query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `jar_file_executed_from_appdata.yml`\
    \ \u2014 experimental sketch; not raw dump\n| ImageFileName=/javaw.exe/i CommandLine=/appdata/i\n\
    | table([aid, @timestamp, #event_simpleName, ImageFileName, SHA256HashData], limit=1000)\n| groupBy([aid,\
    \ ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: JAR files executed from %AppData%'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: This query detects if a JAR file was executed from the %AppData% folder
id: DAC-CS-0079
