  techniques:
  - T1105
severity: medium
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
- aid
- ComputerName
- TargetProcessId
query:
  crowdstrike: '#event_simpleName=ProcessRollup2

    // Enhanced from Query-Hub ProcessRollup patterns (01b); keep prior intent

    // prior: falcon_ioa_pattern: ImageFileName="certutil.exe" AND CommandLine CONTAINS_ANY ["-urlcache","-decode"]

    // --- src: LOLBin_Certutil.yml (Falcon: LOLBin Certutil) ---

    | event_platform=Win and ImageFileName=/certutil.exe/i and CommandLine=/(https?:)/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
tags:
- enhance-01b
- processrollup2
- qh:LOLBin_Certutil.yml
sourcetypes:
- falcon:process
telemetry_validated: false
references:
- https://www.crowdstrike.com/
platforms:
- crowdstrike
false_positives:
- Tune to your environment and allowlist known tooling.
- ProcessRollup2 field patterns may be noisy until tenant baselined; keep telemetry_validated=false.
