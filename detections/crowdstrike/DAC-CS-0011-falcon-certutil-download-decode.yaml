sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
status: experimental
author: DaC
description: Detects certutil used to download (urlcache/http) or decode payloads. Merges prior -urlcache/-decode
  IOA intent with Query-Hub LOLBin_Certutil https CommandLine gate.
tags:
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- esn:ProcessBlocked
- qh:LOLBin_Certutil.yml
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1105
id: DAC-CS-0011
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])

    | event_platform=Win

    | ImageFileName=/certutil\.exe$/i

    | CommandLine=/(-urlcache|-decode|-verifyctl|https?:)/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
severity: medium
title: 'Falcon: certutil download/decode'
false_positives:
- "PKI/admin certutil decode of legitimate certificates \u2014 allowlist known parents and paths."
- Software updates invoking certutil -urlcache; baseline before promote.
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1105/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/LOLBin_Certutil.yml
