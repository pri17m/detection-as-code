id: DAC-CS-0223
title: rclone copy or sync to a remote
description: "ProcessRollup2 for rclone.exe copy, sync, rcat, or move with a remote, --config, mega, or webdav. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - exfiltration
  techniques:
  - T1567.002
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Approved rclone backup jobs."
references:
- https://rclone.org/commands/rclone_copy/
- https://attack.mitre.org/techniques/T1567/002/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0345
- parity:DAC-MDE-0078
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\rclone\.exe$/i
    | CommandLine=/(^|\s)(copy|sync|rcat|move)(\s|$)/i
    | CommandLine=/(:|--config\b|mega|webdav)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
