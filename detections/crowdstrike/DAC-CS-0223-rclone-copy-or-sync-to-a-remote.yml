id: DAC-CS-0223
title: rclone copy or sync to a remote
description: >-
  rclone copy, sync, rcat, or move to a remote is a common way to stage stolen files (T1567.002).
  A hit requires the rclone.exe image, one of those verbs, and a remote marker (a colon, --config,
  mega, or webdav). rclone version, rclone config, and rclone help copy do not match. Telemetry is
  Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win. ImageFileName is the full path.
  ParentBaseFileName is the parent file name only. Offline command-line samples were replayed: the
  documented malicious lines match and the documented benign lines do not. telemetry_validated
  stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - exfiltration
  techniques:
  - T1567.002
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Approved rclone backup jobs."
references:
- https://rclone.org/commands/rclone_copy/
- https://attack.mitre.org/techniques/T1567/002/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0345
- parity:DAC-MDE-0078
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\rclone\.exe$/i
    | CommandLine=/(^|\s)(copy|sync|rcat|move)(\s|$)/i
    | CommandLine=/(:|--config\b|mega|webdav)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
