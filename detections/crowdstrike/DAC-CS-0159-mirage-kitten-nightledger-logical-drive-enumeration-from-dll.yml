id: DAC-CS-0159
title: 'Falcon: Mirage Kitten NightLedger Logical Drive Enumeration from DLL Context'
description: |
  detections.ai community gap-fill for: Mirage Kitten NightLedger Logical Drive Enumeration from DLL Context. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019fd254-2c75-7498-96eb-89eacc1e8fdd
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  - persistence
  techniques:
  - T1574.001
  - T1055
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019fd254-2c75-7498-96eb-89eacc1e8fdd
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1574/001/
- https://attack.mitre.org/techniques/T1055/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(mirage|kitten|nightledger|logical)/i OR ImageFileName=/(mirage|kitten|nightledger|logical)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
