references:
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/count_windows_discovery_commands.yml
query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `count_windows_discovery_commands.yml`\
    \ \u2014 experimental sketch; not raw dump\n| event_platform=Win #event_simpleName=ProcessRollup2\
    \ FileName=/(whoami|ping|net1?|systeminfo|quser|ipconfig)/iF\n| UserSid=S-1-5-21-*\n| FileName=/whoami/iF\
    \     | whoami:=\"1\";\n| FileName=/ping/iF       | ping:=\"1\";\n| FileName=/net1?/iF      | net:=\"\
    1\";\n| FileName=/systeminfo/iF | systeminfo:=\"1\";\n| FileName=/quser/iF      | quser:=\"1\";\n\
    | FileName=/ipconfig/iF   | ipconfig:=\"1\";\n| rename(field=\"CommandLine\", as=\"LastCommandRun\"\
    )\n| table([UserName, UserSid, totalDiscovery, whoami, ping, net, systeminfo, quser, ipconfig, LastCommandRun])\n\
    | groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: Count Windows Discovery Commands'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: This query counts the execution of discovery / reconnaissance commands.
id: DAC-CS-0070
sourcetypes:
- falcon:process
platforms:
- crowdstrike
mitre:
  tactics:
  - execution
  techniques:
  - T1059
severity: medium
author: Detection Engineer
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:count_windows_discovery_commands.yml
telemetry_validated: false
required_fields:
- CommandLine
- FileName
- UserName
- UserSid
- ImageFileName
- aid
status: experimental
