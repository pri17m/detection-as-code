id: DAC-CS-0216
title: desktopimgdownldr lockscreen URL outside Microsoft
description: >-
  desktopimgdownldr.exe downloads a lock-screen image. Windows Spotlight calls Microsoft hosts.
  The LOLBAS abuse points /lockscreenurl at an attacker host (T1105). A hit is this image plus
  lockscreenurl, unless the host is microsoft.com, windows.com, live.com, bing.com, msn.com,
  azureedge.net, or microsoftonline.com, including subdomains. A lookalike such as
  microsoft.com.evil.test still matches. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on
  event_platform=Win. ImageFileName is the full path. ParentBaseFileName is the parent file name
  only. Offline command-line samples were replayed: the documented malicious lines match and the
  documented benign lines do not. telemetry_validated stays false until this search is replayed on
  a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - command-and-control
  techniques:
  - T1105
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A management tool that sets a custom lock-screen image host."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Desktopimgdownldr/
- https://attack.mitre.org/techniques/T1105/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0337
- parity:DAC-MDE-0070
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\desktopimgdownldr\.exe$/i
    | CommandLine=/lockscreenurl/i
    | CommandLine!=/lockscreenurl:\s*https?:\/\/([a-z0-9.-]*\.)?(microsoft\.com|windows\.com|live\.com|bing\.com|msn\.com|azureedge\.net|microsoftonline\.com)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
