query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `find_openclaw_on_endpoints.yml`\
    \ \u2014 experimental sketch; not raw dump\n| CommandLine=/openclaw\\.ai\\/install\\.sh/\n| CommandLine=/openclaw\\\
    .ai\\/install\\.ps1/\n| CommandLine =~ in(values=[\"* openclaw*\", \"* clawdbot*\", \"* moltbot*\"\
    ])\n| CommandLine =~ in(values=[\"*npm*\", \"*npx*\", \"*brew*\"])\n| CommandLine=\"* install *\"\n\
    | FilePath =~ in(values=[\"*/.openclaw/*\", \"*/.clawdbot/*\", \"*/.moltbot/*\"])\n| CommandLine =~\
    \ in(values=[\"*openclaw*\", \"*clawdbot*\", \"*moltbot*\"])\n| ImageFileName=/node/i\n| CommandLine=/gateway\
    \ --port 18789/i\n| CommandLine =~ in(values=[\"*openclaw*\", \"*clawdbot*\", \"*moltbot*\"])\n| groupBy([aid,\
    \ ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: Find OpenClaw on Endpoints'
