id: DAC-CS-0195
title: 'Falcon: Crowdstrike CQL - Suspicious Network Connection by Clawbot/Moltbot/Openclaw'
description: |
  detections.ai community gap-fill for: Crowdstrike CQL - Suspicious Network Connection by Clawbot/Moltbot/Openclaw. Heuristic TP-style CQL on SAFE ESN NetworkConnectIP4 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019cb93c-cf1e-71da-8c2b-6af5657d7906
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - command-and-control
  - exfiltration
  techniques:
  - T1071
  - T1105
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019cb93c-cf1e-71da-8c2b-6af5657d7906
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1071/
- https://attack.mitre.org/techniques/T1105/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- RemoteAddressIP4
- RemotePort
- ComputerName
- aid
- ContextProcessId
- TargetProcessId
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:NetworkConnectIP4
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=NetworkConnectIP4
    | join({#event_simpleName=ProcessRollup2 | ImageFileName=/(claw|molt|openclaw)/i OR CommandLine=/(clawbot|moltbot|openclaw)/i}, key=TargetProcessId, field=ContextProcessId, include=[ImageFileName, CommandLine], tip="aid=aid")
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, RemoteAddressIP4, RemotePort], function=count())
