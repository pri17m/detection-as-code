query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `Detect_Suspicious_Windows_Command-Line_Activity_Using_System_Utilities.yml`\
    \ \u2014 experimental sketch; not raw dump\n| ImageFileName=/\\\\(?<FileName>(whoami|net1?|systeminfo|ping|nltest|sc|hostname|ipconfig)\\\
    .exe)/i\n| CommandLine := lower(CommandLine)\n| FileName := lower(FileName)\n| regex(\"(sc|net1?)\\\
    s+(?<netFlag>\\S+)\\s+\", field=CommandLine, strict=false)\n| FileName=/net1?\\.exe/ AND netFlag=\"\
    start\" | behaviorWeight := \"4\" ;\n| FileName=/net1?\\.exe/ AND netFlag=\"stop\" | behaviorWeight\
    \ := \"4\" ;\n| FileName=/net1?\\.exe/ AND netFlag=\"stop\" AND CommandLine=/falcon/i | behaviorWeight\
    \ := \"25\" ;\n| FileName=/sc\\.exe/ AND netFlag=\"start\" | behaviorWeight := \"4\" ;\n| FileName=/sc\\\
    .exe/ AND netFlag=\"stop\" | behaviorWeight := \"4\" ;\n| FileName=/sc\\.exe/ AND netFlag=/(query|stop)/i\
    \ AND CommandLine=/csagent/i | behaviorWeight := \"25\" ;\n| groupBy([aid, ComputerName, ImageFileName,\
    \ CommandLine], function=count())\n"
title: 'Falcon: Detect Suspicious Windows Command-Line Activity Using System Utilities'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
