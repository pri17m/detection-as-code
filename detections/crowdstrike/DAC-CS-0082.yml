query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `overnight-post-rdp-activity.yml`\
    \ \u2014 experimental sketch; not raw dump\n// Multi-ESN source: keep ProcessRollup2 primary; join\
    \ behaviors via aid+TargetProcessId/ContextProcessId per Telemetry matrix\n| ImageFileName=/\\\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|wmic|msbuild|installutil|regasm|regsvcs|certutil|bitsadmin|schtasks|sc|net|net1|nltest|whoami|quser|query|systeminfo|hostname|tasklist|netstat|ipconfig|curl|wget|rclone|scp|sftp|ftp|makecab|tar|7z|7za|rar|winrar|psexec|paexec|winrs|ssh|python|pythonw)\\\
    .exe$/i\n| ParentBaseFileName!=/^()\\.exe$/i\n| GrandParentBaseFileName!=/^()\\.exe$/i\n| CommandLine=/\\\
    b(whoami|quser|query\\s+user|net1?(\\.exe)?\"?\\s+(users?|group|localgroup|session)|nltest|ipconfig\\\
    s+\\/all|systeminfo|hostname|tasklist|wmic|netstat)\\b/i\n| CommandLine=/\\b(Get-Process|Get-NetTCPConnection|Get-SmbShare|Get-ADUser|Get-ADComputer|Get-DomainUser|Get-DomainComputer)\\\
    b/i\n| CommandLine=/\\b(rclone|curl|wget|scp|sftp|ftp|bitsadmin|certutil|makecab|tar|7z|7za|rar|winrar)\\\
    b/i\n| CommandLine=/\\b(Invoke-WebRequest|Invoke-RestMethod|Start-BitsTransfer|Compress-Archive|System\\\
    .IO\\.Compression)\\b/i\n| ImageFileName=/\\\\(cmd|powershell|pwsh)\\.exe$/i AND CommandLine=/\\s-(?:enc|encodedcommand)(?:\\\
    s|$|:)/i\n| table([@timestamp, cid, LogonTimestampMs, CommandTimestampMs, TimeFromLogonMinutes, aid,\
    \ ComputerName, UserName, UserPrincipal, LogonType, RemoteAddressIP4, SignalType, ImageFileName, FileName,\
    \ FilePath, CommandLine, ParentBaseFileName, GrandParentBaseFileName, OriginalFilename, SHA256HashData],\
    \ limit=1000)\n| groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: Overnight Post-RDP Activity Detection'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: Correlates remote interactive logons (UserLogon, LogonType=10) occurring during overnight
  hours with suspicious process execution (ProcessRollup2) from the same logon session, with
