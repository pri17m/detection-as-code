id: DAC-CS-0063
status: experimental
severity: high
author: Detection Engineer
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: This query detects the use of Msiexec.exe.
platforms:
- crowdstrike
title: 'Falcon: LOLBin Msiexec'
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.007
references:
- https://attack.mitre.org/techniques/T1218/007/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/LOLBin_Msiexec.yml
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])

    | event_platform=Win and ImageFileName=/msiexec.exe/i and CommandLine=/http/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P0
- src:LOLBin_Msiexec.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
- esn:ProcessBlocked
