id: DAC-CS-0086
status: experimental
severity: medium
author: DaC
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: Detects Rust build tools spawning command interpreters or download utilities, a behavior
  associated with malicious dependency and build-script execution.
platforms:
- crowdstrike
title: 'Falcon: Rust Build Toolchain Spawning Interpreter or Downloader'
mitre:
  tactics:
  - execution
  techniques:
  - T1195.002
  - T1059
references:
- https://attack.mitre.org/techniques/T1195/002/
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Rust_Build_Toolchain_Spawning_Interpreter_or_Downloader.yml
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","SyntheticProcessRollup2"])

    | in(ParentBaseFileName, values=["cargo.exe","cargo","rustc.exe","rustc"], ignoreCase=true)

    | ImageFileName=/\\(powershell|pwsh|wscript|cscript|cmd|curl|wget|bash|sh)(\.exe)?$/i

    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, ImageFileName, CommandLine, ParentCommandLine,
    aid])

    '
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- ParentCommandLine
- UserName
- aid
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:Rust_Build_Toolchain_Spawning_Interpreter_or_Downloader.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
- esn:SyntheticProcessRollup2
