query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `Rust_Build_Toolchain_Spawning_Interpreter_or_Downloader.yml`\
    \ \u2014 experimental sketch; not raw dump\n| in(ParentBaseFileName, values=[\"cargo.exe\",\"cargo\"\
    ,\"rustc.exe\",\"rustc\"], ignoreCase=true)\n| in(FileName, values=[\"powershell.exe\",\"pwsh.exe\"\
    ,\"wscript.exe\",\"cscript.exe\",\"cmd.exe\",\"curl.exe\",\"curl\",\"wget\",\"bash\",\"sh\"], ignoreCase=true)\n\
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, FileName, CommandLine, ParentCommandLine])\n\
    | groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: Rust Build Toolchain Spawning Interpreter or Downloader'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: Detects Rust build tools spawning command interpreters or download utilities, a behavior
  associated with malicious dependency and build-script execution.
id: DAC-CS-0086
