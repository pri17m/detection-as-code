query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `chromium_based_browser_hunting_via_dll_load.yml`\
    \ \u2014 experimental sketch; not raw dump\n// Multi-ESN source: keep ProcessRollup2 primary; join\
    \ behaviors via aid+TargetProcessId/ContextProcessId per Telemetry matrix\n| ImageFileName=/chrome\\\
    .dll/i\n| TargetImageFileName!=/chrome\\.exe/i}, include=[ComputerName, TargetProcessId], name=\"\
    DllLoads\")\n| #event_simpleName=ProcessRollup2 TargetProcessId=*\n| match(table=\"DllLoads\", field=[TargetProcessId])\n\
    | table([@timestamp, aid, ComputerName, FileName, TargetProcessId, ImageFileName, TargetImageFileName])\n\
    | groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: Chromium-Based Browser Hunting via DLL Load'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
