id: DAC-CS-0224
title: Add-MpPreference exclusion
description: >-
  Add-MpPreference can add a path, process, extension, or IP exclusion so Defender stops scanning
  it (T1562.001). A hit is powershell.exe or pwsh.exe with Add-MpPreference and one of those
  exclusion parameters. Set-MpPreference -DisableRealtimeMonitoring is a different rule and does
  not match here. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Security administrators who add Defender exclusions from PowerShell."
references:
- https://learn.microsoft.com/defender-endpoint/configure-process-opened-file-exclusions-microsoft-defender-antivirus
- https://attack.mitre.org/techniques/T1562/001/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-MDE-0079
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\(powershell|pwsh)\.exe$/i
    | CommandLine=/add-mppreference/i
    | CommandLine=/-(exclusionpath|exclusionprocess|exclusionextension|exclusionipaddress)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
