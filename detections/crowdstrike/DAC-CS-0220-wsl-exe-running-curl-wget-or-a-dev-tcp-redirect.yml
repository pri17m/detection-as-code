id: DAC-CS-0220
title: wsl.exe running curl, wget, or a /dev/tcp redirect
description: >-
  wsl.exe can run a Linux command from a Windows process creation event (T1059.004). A hit is
  wsl.exe whose command line pairs curl or wget with http(s), or contains /dev/tcp/. wsl --status
  and wsl -l do not match. Curl inside an already-running distro is a different event and is not
  this rule. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: medium
mitre:
  tactics:
  - execution
  techniques:
  - T1059.004
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Developers who pass curl to wsl.exe on the Windows command line."
references:
- https://learn.microsoft.com/windows/wsl/basic-commands
- https://attack.mitre.org/techniques/T1059/004/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0342
- parity:DAC-MDE-0075
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\wsl\.exe$/i
    | CommandLine=/((curl|wget).{0,80}https?:\/\/|https?:\/\/.{0,80}(curl|wget)|\/dev\/tcp\/)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
