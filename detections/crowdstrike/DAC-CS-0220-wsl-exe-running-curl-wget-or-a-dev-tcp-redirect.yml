id: DAC-CS-0220
title: wsl.exe running curl, wget, or a /dev/tcp redirect
description: >-
  Alerts when wsl.exe is started with curl or wget against a URL, or with /dev/tcp/. Attackers use
  the Windows Subsystem for Linux to run a download from a Windows process-creation event.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: medium
mitre:
  tactics:
  - execution
  techniques:
  - T1059.004
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Developers who pass curl to wsl.exe on the Windows command line."
references:
- https://learn.microsoft.com/windows/wsl/basic-commands
- https://attack.mitre.org/techniques/T1059/004/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0342
- parity:DAC-MDE-0075
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\wsl\.exe$/i
    | CommandLine=/((curl|wget).{0,80}https?:\/\/|https?:\/\/.{0,80}(curl|wget)|\/dev\/tcp\/)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
