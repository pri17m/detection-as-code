id: DAC-CS-0161
title: 'Falcon: Pre-execution EDR/AV process check (CrowdStrike/Sophos) followed by stealthy msed…'
description: |
  detections.ai community gap-fill for: Pre-execution EDR/AV process check (CrowdStrike/Sophos) followed by stealthy msedge.exe stealth-flag launch. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019fd292-ad4e-707d-a06f-d5fff5e0a60c
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019fd292-ad4e-707d-a06f-d5fff5e0a60c
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1562/001/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(check|sophos|followed|stealthy)/i OR ImageFileName=/(check|sophos|followed|stealthy)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
