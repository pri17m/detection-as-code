id: DAC-CS-0071
status: experimental
severity: medium
author: DaC
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: This query correlates web browser process executions with their DNS queries to identify which
  domains were resolved by browser processes on specific endpoints
platforms:
- crowdstrike
title: 'Falcon: DNS Resolutions from Browser Processes'
mitre:
  tactics:
  - execution
  techniques:
  - T1059
references:
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/DNS_Resolutions_from_Browser_Processes.yml
query:
  crowdstrike: '(#event_simpleName=ProcessRollup2 OR #event_simpleName=DnsRequest) event_platform=Win

    | fileName:=concat([FileName, ContextBaseFileName])

    | in(field="fileName", values=["chrome.exe","firefox.exe","msedge.exe"], ignoreCase=true)

    | falconPID:=TargetProcessId | falconPID:=ContextProcessId

    | selfJoinFilter(field=[aid, falconPID], where=[{#event_simpleName=ProcessRollup2}, {#event_simpleName=DnsRequest}])

    | DomainName=*

    | groupBy([aid, falconPID, ComputerName], function=([collect([UserName, fileName, DomainName, ImageFileName])]))

    '
required_fields:
- '#event_simpleName'
- ComputerName
- ContextBaseFileName
- ContextProcessId
- DomainName
- FileName
- ImageFileName
- TargetProcessId
- UserName
- aid
- event_platform
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:DNS_Resolutions_from_Browser_Processes.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
- esn:DnsRequest
