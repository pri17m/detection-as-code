references:
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/DNS_Resolutions_from_Browser_Processes.yml
query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `DNS_Resolutions_from_Browser_Processes.yml`\
    \ \u2014 experimental sketch; not raw dump\n// Multi-ESN source: keep ProcessRollup2 primary; join\
    \ behaviors via aid+TargetProcessId/ContextProcessId per Telemetry matrix\n| fileName:=concat([FileName,\
    \ ContextBaseFileName])\n| falconPID:=TargetProcessId | falconPID:=ContextProcessId\n| groupBy([aid,\
    \ ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: DNS Resolutions from Browser Processes'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: This query correlates web browser process executions with their DNS queries to identify which
  domains were resolved by browser processes on specific endpoints
id: DAC-CS-0071
sourcetypes:
- falcon:process
platforms:
- crowdstrike
mitre:
  tactics:
  - execution
  techniques:
  - T1059
severity: medium
author: Detection Engineer
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:DNS_Resolutions_from_Browser_Processes.yml
telemetry_validated: false
required_fields:
- ComputerName
- FileName
- TargetProcessId
- UserName
- ImageFileName
- CommandLine
- aid
