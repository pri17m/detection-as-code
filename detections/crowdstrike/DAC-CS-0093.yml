platforms:
- crowdstrike
author: DaC
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'Detects scheduled task registration where the principal RunLevel is HighestAvailable, indicating

  elevated persistence.

  '
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0093
query:
  crowdstrike: '#event_simpleName=ScheduledTaskRegistered

    | TaskName!=/^\\?Microsoft\\Windows\\/i

    | TaskXML=/<RunLevel>\s*HighestAvailable\s*<\/RunLevel>/i

    | groupBy([aid, ComputerName, TaskName], function=[count(), collect([TaskXML], limit=1)])

    '
mitre:
  tactics:
  - persistence
  - privilege-escalation
  techniques:
  - T1053.005
title: 'Falcon: Scheduled Task Highest Privileges RunLevel'
status: experimental
references:
- https://attack.mitre.org/techniques/T1053/005/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/tasks_scheduled_by_run_level.yml
tags:
- cs-query-hub
- safe-esn-wave
- tp-quality-v2
- src:tasks_scheduled_by_run_level.yml
- esn:ScheduledTaskRegistered
severity: medium
required_fields:
- '#event_simpleName'
- ComputerName
- TaskName
- TaskXML
- aid
