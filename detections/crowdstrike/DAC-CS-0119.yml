platforms:
- crowdstrike
author: Detection Engineer
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'ScriptControlScanV2 detecting Net.WebClient / DownloadString / DownloadFile / Invoke-WebRequest

  download cradles in ScriptContent.

  '
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0119
query:
  crowdstrike: '#event_simpleName=ScriptControlScanV2

    | ScriptContent=/(Net\.WebClient|DownloadString|DownloadFile|Invoke-WebRequest|Invoke-RestMethod)/i

    | ScriptContent=/https?:\/\//i

    | groupBy([aid, ComputerName], function=[count(), collect([ScriptContent], limit=3)])

    '
mitre:
  tactics:
  - execution
  - command-and-control
  techniques:
  - T1059.001
  - T1105
title: 'Falcon: ScriptControlScanV2 WebClient Download Cradle'
status: experimental
references:
- https://attack.mitre.org/techniques/T1059/001/
- https://attack.mitre.org/techniques/T1105/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Powershell_Downloads.yml
tags:
- cs-query-hub
- safe-esn-wave
- tp-quality-v2
- src:Powershell_Downloads.yml
- esn:ScriptControlScanV2
severity: high
required_fields:
- '#event_simpleName'
- ComputerName
- ScriptContent
- aid
