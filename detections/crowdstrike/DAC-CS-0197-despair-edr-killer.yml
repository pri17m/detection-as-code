id: DAC-CS-0197
title: 'Falcon: Despair EDR Killer'
description: |
  detections.ai community gap-fill for: Despair EDR Killer. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019da376-453c-775d-b4bd-dd6d51acf9e2
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019da376-453c-775d-b4bd-dd6d51acf9e2
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1562/001/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | ImageFileName=/\\(taskkill|sc)\.exe$/i
    | CommandLine=/(csfalconservice|csagent|crowdstrike|msmpeng|sense|sophos|carbonblack|cb\.exe|elastic-endpoint|sentinelagent)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
