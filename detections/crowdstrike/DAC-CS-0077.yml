query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n// Enhanced from Query-Hub `Crowdstrike_Falcon_0day_Privilege_Escalation_Vulnerability_FalconFlank.yml`\
    \ \u2014 experimental sketch; not raw dump\n| TargetFileName = /\\\\NamedPipe\\\\FALCONFLANK$/i\n\
    | OR TargetFileName = /\\\\Flanker_\\{?[-0-9a-f]+\\}?\\\\WindowsPowerShell\\\\v1\\.0\\\\bcrypt\\.dll$/i\n\
    | OR TargetFileName = /\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1\\.0\\\\bcrypt\\.dll$/i\n\
    | TargetFileName = /\\\\System32\\\\WindowsPowerShell\\\\/i | Indicator := \"bcrypt.dll written to\
    \ System32 PowerShell directory (escalation succeeded)\";\n| field=[aid, TargetProcessId], key=[aid,\
    \ ContextProcessId],\n| include=[FirstArtifact, Indicator, TargetFileName])\n| table([FirstArtifact,\
    \ aid, ComputerName, UserName, UserSid, ImageFileName, CommandLine, ParentBaseFileName, Indicator,\
    \ TargetFileName])\n| groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())\n"
title: 'Falcon: FalconFlank Exploit Artifacts (Named Pipe and Dropped DLL)'
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
description: Detects on-host artifacts of the FalconFlank local privilege escalation exploit against the
  CrowdStrike Falcon sensor (the FALCONFLANK named pipe, the staged bcrypt.dll under Flank
