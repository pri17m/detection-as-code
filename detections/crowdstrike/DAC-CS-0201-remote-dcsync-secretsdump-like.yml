id: DAC-CS-0201
title: Remote DCSync-style dump via secretsdump-like tooling
description: "Detects Impacket secretsdump / mimikatz lsadump::dcsync / ntdsutil IFM-style process activity correlated with outbound SMB/RPC/LDAP connections (ports 445/135/389/636) from the same process. Remote secretsdump run solely on an attacker host creates no ProcessRollup2 on the DC — pair with DAC-WIN-0332 (4662 replication GUIDs) as the primary DC-side control. Original behaviour logic (T1003.006 / T1021.002)."
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- "falcon:process"
mitre:
  tactics:
  - credential-access
  - lateral-movement
  techniques:
  - T1003.006
  - T1021.002
severity: critical
false_positives:
- Authorized red-team or AD assessment tooling using Impacket/mimikatz — allowlist operator hosts and signed change windows.
- "Tuning knob: require network stage (default via selfJoinFilter) or loosen to process-only; adjust CommandLine regex for internal wrappers."
references:
- "https://attack.mitre.org/techniques/T1003/006/"
- "https://attack.mitre.org/techniques/T1021/002/"
- "https://github.com/CrowdStrike/logscale-community-content/blob/main/Queries-Only/Helpful-CQL-Queries/Combine%20ProcessRollup2%20and%20NetworkConnectIP4%20Events.md"
- "https://library.humio.com/data-analysis/functions-selfjoinfilter.html"
telemetry_validated: false
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
- TargetProcessId
- ContextProcessId
- RemoteAddressIP4
- RemotePort
tags:
- wave1
- ad
- dcsync
- tp-quality
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked","NetworkConnectIP4"])
    | event_platform=Win
    | case {
        in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])
          | (ImageFileName=/\\(secretsdump|wmiexec|smbexec|atexec|mimikatz|ntdsutil)\.exe$/i OR CommandLine=/(secretsdump|lsadump::dcsync| \/dcsync |ntdsutil.*ifm|ntds\.dit|--just-dc|--ntds)/i)
          | ParentBaseFileName!=/^(MsMpEng|CSFalconService|SenseIR)\.exe$/i
          | falconPID := TargetProcessId
          | Stage := "tool" ;
        #event_simpleName=NetworkConnectIP4
          | in(RemotePort, values=[445,135,389,636])
          | falconPID := ContextProcessId
          | Stage := "net" ;
      }
    | selfJoinFilter([aid, falconPID], where=[{Stage="tool"},{Stage="net"}])
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName, RemoteAddressIP4, RemotePort], function=count())
