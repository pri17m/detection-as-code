id: DAC-CS-0201
title: Remote DCSync-style dump via secretsdump-like tooling
description: |
  Detects process executions whose image or command line match Impacket secretsdump, mimikatz lsadump::dcsync / sekurlsa patterns, or similar remote NTDS replication tooling, optionally correlated with outbound SMB/RPC connections (ports 445/135). Original behaviour logic grounded in ATT&CK T1003.006 / T1021.002 and Falcon ProcessRollup2 + NetworkConnectIP4 fields.
author: DaC
status: experimental
platforms:
  - crowdstrike
sourcetypes:
  - falcon:process
mitre:
  tactics:
    - credential-access
    - lateral-movement
  techniques:
    - T1003.006
    - T1021.002
severity: critical
false_positives:
  - Authorized red-team or AD assessment tooling using Impacket/mimikatz — allowlist operator hosts and signed change windows.
  - 'Tuning knob: require NetworkConnectIP4 join (default) or loosen to process-only;
  adjust CommandLine regex for internal wrappers.'
references:
  - https://attack.mitre.org/techniques/T1003/006/
  - https://attack.mitre.org/techniques/T1021/002/
  - https://www.crowdstrike.com/blog/
telemetry_validated: false
required_fields:
  - '#event_simpleName'
  - event_platform
  - aid
  - ComputerName
  - ImageFileName
  - CommandLine
  - ParentBaseFileName
  - TargetProcessId
  - ContextProcessId
  - RemoteAddressIP4
  - RemotePort
tags:
  - wave1
  - ad
  - dcsync
  - tp-quality
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\(secretsdump|wmiexec|smbexec|atexec|psexec|mimikatz|ntdsutil)\.exe$/i OR CommandLine=/(secretsdump|lsadump::dcsync| \/dcsync |drsuapi|ntdsutil.*ifm|ntds\.dit|--just-dc|--ntds)/i
    | ParentBaseFileName!=/^(MsMpEng|CSFalconService|SenseIR)\.exe$/i
    | join({#event_simpleName=NetworkConnectIP4 | in(RemotePort, values=[445,135,389,636])}, key=TargetProcessId, field=ContextProcessId, include=[RemoteAddressIP4, RemotePort], tip="aid=aid", limit=20000)
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName, RemoteAddressIP4, RemotePort], function=count())
    
