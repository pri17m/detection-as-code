platforms:
- crowdstrike
author: DaC
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'ScriptControlScanV2 ScriptContent matching common AMSI bypass tokens (amsiInitFailed, amsiContext,

  AmsiUtils reflection).

  '
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0120
query:
  crowdstrike: '#event_simpleName=ScriptControlScanV2

    | ScriptContent=/(amsiInitFailed|AmsiUtils|amsiContext|System\.Management\.Automation\.AmsiUtils|amsiSession)/i

    | groupBy([aid, ComputerName], function=[count(), collect([ScriptContent], limit=3)])

    '
