platforms:
- crowdstrike
author: DaC
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'Detects AMSI bypass techniques in Falcon ScriptControl script content (#event_simpleName=/^ScriptControl/) and ProcessRollup2 command lines: (1) AmsiUtils/amsiInitFailed reflection (Atomic Red Team T1685 test 16); (2) AmsiScanBuffer in-memory patching via GetProcAddress/VirtualProtect against amsi.dll (ART T1685 test 78; AmsiScanBuffer API per Microsoft Learn); (3) removal of the AMSI provider registry key HKLM\SOFTWARE\Microsoft\AMSI\Providers (ART T1685 test 17); (4) AMSI COM server hijack of CLSID {fdb00e52-a214-4aa1-8fba-4357bb0072ec} under HKCU\Software\Classes (ART T1685 test 48); (5) setting AmsiEnable=0 under HKCU\Software\Microsoft\Windows Script\Settings (ART T1685 test 56). Defender exclusions (Add-MpPreference) are out of scope; see DAC-CS-0224. Unconfirmed: whether every /^ScriptControl/ subtype (ScanInfo, DetectInfo, Blocked) carries ScriptContent; public vendor content shows it on ScriptControlScanInfo.'
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0120
query:
  crowdstrike: |
    (#event_simpleName=/^ScriptControl/ event_platform=Win) OR (#event_simpleName=ProcessRollup2 event_platform=Win)
    | concat([ScriptContent, CommandLine], as=Evidence)
    | case {
        Evidence=/AmsiUtils/i Evidence=/amsiInitFailed/i | Pattern:="amsiInitFailed reflection";
        Evidence=/AmsiScanBuffer/i Evidence=/(GetProcAddress|VirtualProtect)/i | Pattern:="AmsiScanBuffer patch";
        Evidence=/\\Microsoft\\AMSI\\Providers/i Evidence=/(Remove-Item|reg(\.exe)?["']?\s+delete)/i | Pattern:="AMSI provider key removal";
        Evidence=/\{?fdb00e52-a214-4aa1-8fba-4357bb0072ec\}?/i Evidence=/InProcServer32/i | Pattern:="AMSI COM server hijack";
        Evidence=/Windows Script\\Settings/i Evidence=/AmsiEnable/i | Pattern:="AmsiEnable disabled";
      }
    | groupBy([aid, ComputerName, Pattern], function=[count(), collect([#event_simpleName, Evidence], limit=5)])
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
  - T1059.001
title: 'Falcon: AMSI bypass patterns in ScriptControl content or command lines'
status: experimental
