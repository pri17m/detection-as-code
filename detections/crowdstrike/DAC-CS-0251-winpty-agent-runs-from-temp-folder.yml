id: DAC-CS-0251
title: "Falcon: winpty-agent.exe runs from a temp folder"
description: >-
  ProcessRollup2 on Windows where the image is winpty-agent.exe under \AppData\Local\Temp\ or \Windows\Temp\.
  Kaspersky's ShadowCloud Part 1 says the WinPTY shell module drops winpty.dll and winpty-agent.exe into the
  %TEMP% directory to give the operator a fully interactive reverse shell. Legitimate tools that use WinPTY ship it
  in their install folders. Only the agent's own start is covered: ProcessRollup2 gives the parent as a base file
  name, so the parent-path branch in the Defender version has no equivalent here. telemetry_validated false.
  Companion rule: DAC-MDE-0104.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- "falcon:process"
mitre:
  tactics:
  - execution
  - command-and-control
  techniques:
  - T1059.003
  - T1105
severity: high
false_positives:
- "A tool that unpacks its WinPTY copy to %TEMP% at run time would match. I didn't find one in public docs, but this is not measured."
- "Developer machines that run portable builds out of a temp download folder."
references:
- "https://securelist.com/operation-shadowcloud-gitdoor/122004/"
- "https://securelist.com/operation-shadowcloud-graphdoor/122005/"
- "https://github.com/rprichard/winpty"
- "https://attack.mitre.org/techniques/T1059/003/"
- "https://github.com/CrowdStrike/logscale-community-content"
telemetry_validated: false
required_fields:
- "#event_simpleName"
- "event_platform"
- "aid"
- "ComputerName"
- "UserName"
- "ImageFileName"
- "CommandLine"
- "ParentBaseFileName"
tags:
- behavioural
- reverse-shell
- shadowcloud
- needs-review
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2 event_platform=Win
    | ImageFileName=/\\winpty-agent\.exe$/i
    | ImageFileName=/\\(AppData\\Local\\Temp|Windows\\Temp)\\/i
    | table([@timestamp, aid, ComputerName, UserName, ParentBaseFileName, ImageFileName, CommandLine])
