id: DAC-CS-0144
title: 'Falcon: LegionLoader Bulk SharePoint/OneDrive Access via M365 Copilot Organizational Perm…'
description: |
  detections.ai community gap-fill for: LegionLoader Bulk SharePoint/OneDrive Access via M365 Copilot Organizational Permissions. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019f1762-676a-7230-8d9a-08c3f29c4c58
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/019f1762-676a-7230-8d9a-08c3f29c4c58
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1562/001/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(legionloader|bulk|sharepoint|onedrive)/i OR ImageFileName=/(legionloader|bulk|sharepoint|onedrive)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
