id: DAC-CS-0214
title: hh.exe opening a remote URL
description: >-
  hh.exe is HTML Help. Opening a local CHM is normal. Opening an http, https, or ftp URL lets it
  fetch a remote CHM or script (T1218.001). A hit requires the image to be hh.exe and the command
  line to contain one of those URL schemes. A path such as C:\Windows\Help\aclui.chm does not
  match. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.001
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A help desk that opens a vendor CHM over HTTPS."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Hh/
- https://attack.mitre.org/techniques/T1218/001/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0335
- parity:DAC-MDE-0068
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\hh\.exe$/i
    | CommandLine=/(https?:\/\/|ftp:\/\/)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
