mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1218.005
severity: medium
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
- aid
- ComputerName
- TargetProcessId
query:
  crowdstrike: '#event_simpleName=ProcessRollup2

    // Enhanced from Query-Hub ProcessRollup patterns (01b); keep prior intent

    // prior: falcon_ioa_pattern: ImageFileName="mshta.exe" AND CommandLine CONTAINS_ANY ["http://","https://","javascript:","vbscript:"]

    // --- src: LOLBin_Mshta.yml (Falcon: LOLBin Mshta) ---

    | event_platform=Win and ImageFileName=/mshta.exe/i

    | CommandLine=/mshta(?:\.exe)?\"?\s+\"?(?<HtaPath>(?:.*?\.hta|(?=\").*?(?=\")|.*?(?=(?:\s|$))))/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
tags:
- enhance-01b
- processrollup2
- qh:LOLBin_Mshta.yml
sourcetypes:
- falcon:process
telemetry_validated: false
references:
- https://www.crowdstrike.com/
platforms:
- crowdstrike
false_positives:
- Tune to your environment and allowlist known tooling.
- ProcessRollup2 field patterns may be noisy until tenant baselined; keep telemetry_validated=false.
id: DAC-CS-0004
title: 'Falcon: mshta remote execution'
author: DaC
status: experimental
description: Starter Falcon IOA/correlation rule candidate. Enhanced with Query-Hub ProcessRollup2 patterns
  (LOLBin_Mshta.yml).
