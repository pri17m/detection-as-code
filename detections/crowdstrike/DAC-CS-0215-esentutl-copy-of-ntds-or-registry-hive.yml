id: DAC-CS-0215
title: esentutl copy of NTDS or registry hive
description: >-
  Alerts when esentutl.exe is started with /y against ntds.dit or the SAM, SYSTEM, or SECURITY
  hive. Attackers use that copy mode, often with /vss, to steal the Active Directory database or
  local credential stores from a locked file.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.003
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Domain-controller backup jobs that copy ntds.dit with esentutl."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
- https://attack.mitre.org/techniques/T1003/003/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0336
- parity:DAC-MDE-0069
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\esentutl\.exe$/i
    | CommandLine=/\/y/i
    | CommandLine=/(\/vss|ntds\.dit|\\config\\sam|\\config\\system|\\config\\security|\\ntds\\)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
