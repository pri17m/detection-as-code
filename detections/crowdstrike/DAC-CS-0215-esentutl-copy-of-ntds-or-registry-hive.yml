id: DAC-CS-0215
title: esentutl copy of NTDS or registry hive
description: >-
  esentutl.exe /y copies a database, including a locked file when /vss is set. Attackers use it to
  copy ntds.dit or the SAM, SYSTEM, and SECURITY hives (T1003.003). A hit requires /y and one of
  those targets. Repair mode (/r) and copies of an ordinary mailbox .edb do not match, and a bare
  System32 path is not treated as the SYSTEM hive. Telemetry is Falcon ProcessRollup2 and
  ProcessBlocked on event_platform=Win. ImageFileName is the full path. ParentBaseFileName is the
  parent file name only. Offline command-line samples were replayed: the documented malicious
  lines match and the documented benign lines do not. telemetry_validated stays false until this
  search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.003
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Domain-controller backup jobs that copy ntds.dit with esentutl."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
- https://attack.mitre.org/techniques/T1003/003/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0336
- parity:DAC-MDE-0069
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\esentutl\.exe$/i
    | CommandLine=/\/y/i
    | CommandLine=/(\/vss|ntds\.dit|\\config\\sam|\\config\\system|\\config\\security|\\ntds\\)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
