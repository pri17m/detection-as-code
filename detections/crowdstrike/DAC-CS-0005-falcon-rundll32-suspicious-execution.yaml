sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
status: experimental
author: Detection Engineer
description: Detects rundll32 launched from suspicious parents (Office/script hosts/cmd) or loading a
  remote UNC DLL by ordinal. Merges Query-Hub LOLBin_Rundll32 and Rundll32_Remote_UNC_DLL_Ordinal_Execution
  as OR hypotheses.
tags:
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- esn:ProcessBlocked
- qh:LOLBin_Rundll32.yml
- qh:Rundll32_Remote_UNC_DLL_Ordinal_Execution.yml
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1218.011
id: DAC-CS-0005
query:
  crowdstrike: "in(#event_simpleName, values=[\"ProcessRollup2\",\"ProcessBlocked\"])\n| event_platform=Win\n\
    | ImageFileName=/rundll32\\.exe$/i\n| case {\n    in(ParentBaseFileName, values=[\"cmd.exe\",\"winword.exe\"\
    ,\"powerpnt.exe\",\"excel.exe\",\"outlook.exe\",\"mshta.exe\",\"cscript.exe\",\"wscript.exe\"], ignoreCase=true)\n\
    \      | Hypothesis := \"H1_RUNDLL32_SUSPICIOUS_PARENT\";\n    CommandLine=/\\\\\\\\[a-z0-9._\\-]+(@[a-z0-9]+)*\\\
    \\/i AND CommandLine=/,#[0-9]+/i\n      | Hypothesis := \"H2_RUNDLL32_UNC_ORDINAL\";\n    CommandLine=/(javascript:|vbscript:|comsvcs\\\
    .dll)/i\n      | Hypothesis := \"H3_RUNDLL32_SCRIPT_OR_COMSVCS\";\n    * | Hypothesis := \"NO_MATCH\"\
    ;\n  }\n| Hypothesis != \"NO_MATCH\"\n| groupBy([aid, ComputerName, Hypothesis, ImageFileName, CommandLine,\
    \ ParentBaseFileName], function=count())\n"
severity: medium
title: 'Falcon: rundll32 suspicious execution'
false_positives:
- "Approved software deployment that loads DLLs from network shares via rundll32 \u2014 allowlist shares/parents."
- "Rare legitimate Office/cmd\u2192rundll32 helpers; tune ParentBaseFileName allowlists."
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1218/011/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/LOLBin_Rundll32.yml
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Rundll32_Remote_UNC_DLL_Ordinal_Execution.yml
