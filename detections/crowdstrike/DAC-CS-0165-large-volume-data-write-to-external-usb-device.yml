id: DAC-CS-0165
title: 'Falcon: Large Volume Data Write to External USB Device'
description: |
  detections.ai community gap-fill for: Large Volume Data Write to External USB Device. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a05a9e-d003-70c8-b2f7-5376b3d606b3
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1059
  - T1036
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a05a9e-d003-70c8-b2f7-5376b3d606b3
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1036/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(\\[a-z]:\\|usb|removable)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine], function=count())
