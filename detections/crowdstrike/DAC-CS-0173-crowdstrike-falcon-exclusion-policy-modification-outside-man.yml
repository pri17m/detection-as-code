id: DAC-CS-0173
title: 'Falcon: CrowdStrike Falcon Exclusion Policy Modification Outside Management Channel'
description: |
  detections.ai community gap-fill for: CrowdStrike Falcon Exclusion Policy Modification Outside Management Channel. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a07c1e-8260-762b-a849-0198c7fc55f8
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a07c1e-8260-762b-a849-0198c7fc55f8
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1562/001/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(exclusion|policy|modification|outside)/i OR ImageFileName=/(exclusion|policy|modification|outside)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
