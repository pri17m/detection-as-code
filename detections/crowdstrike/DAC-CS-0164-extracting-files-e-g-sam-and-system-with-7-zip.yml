id: DAC-CS-0164
title: 'Falcon: Extracting FIles (e.g. SAM and SYSTEM) With 7-Zip'
description: |
  detections.ai community gap-fill for: Extracting FIles (e.g. SAM and SYSTEM) With 7-Zip. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a01c14-6da2-7613-a2d2-81e71e366ad9
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003
  - T1558
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a01c14-6da2-7613-a2d2-81e71e366ad9
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1003/
- https://attack.mitre.org/techniques/T1558/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | ImageFileName=/\\(7z|7za|7zr)\.exe$/i
    | CommandLine=/(sam|system|security|ntds\.dit|\\windows\\system32\\config)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
