id: DAC-CS-0085
status: experimental
severity: medium
author: Detection Engineer
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: Detects the use of Plink (PuTTY Link) to establish remote port forwarding tunnels, specifically
  targeting traffic redirected to port 3389 (RDP). This technique is frequently used b
platforms:
- crowdstrike
title: 'Falcon: Remote Port Forwarding via Plink - Unauthorized RDP Tunneling Detection'
mitre:
  tactics:
  - execution
  - lateral-movement
  techniques:
  - T1572
  - T1021.004
references:
- https://attack.mitre.org/techniques/T1572/
- https://attack.mitre.org/techniques/T1021/004/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/remote_port_forwarding_via_plink_unauthorized_rdp_tunneling_detection.yml
query:
  crowdstrike: '#event_simpleName=ProcessRollup2

    | ImageFileName=/\\plink(64)?\.exe$/i

    | CommandLine=/\s-(R|L).*:3389/i

    | table([aid, ComputerName, UserName, ImageFileName, CommandLine, ParentBaseFileName])

    '
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- UserName
- aid
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:remote_port_forwarding_via_plink_unauthorized_rdp_tunneling_detection.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
