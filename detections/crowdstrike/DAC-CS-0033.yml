author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1059/001/
title: 'Falcon: Office spawning PowerShell or cmd'
description: "winword/excel/outlook \u2192 powershell/cmd"
severity: high
telemetry_validated: false
platforms:
- crowdstrike
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-CS-0033
status: experimental
tags:
- wave-a
- P0
- parity:DAC-WIN-0122
query:
  crowdstrike: 'ParentBaseFileName IN ["WINWORD.EXE","EXCEL.EXE","OUTLOOK.EXE","POWERPNT.EXE"] AND ImageFileName
    IN ["powershell.exe","pwsh.exe","cmd.exe"]

    '
sourcetypes:
- falcon:process
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
