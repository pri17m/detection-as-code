id: DAC-CS-0193
title: 'Falcon: Notepad.exe Executing Markdown from WindowsApps (Excluding Specific Version) - Cr…'
description: |
  detections.ai community gap-fill for: Notepad.exe Executing Markdown from WindowsApps (Excluding Specific Version) - CrowdStrike Version. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/019da375-1f98-7754-88d4-1460aa12b4f4
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
