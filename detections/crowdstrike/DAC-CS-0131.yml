platforms:
- crowdstrike
author: DaC
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'ProcessBlocked OR ProcessRollup2 for mshta.exe with http/javascript/vbscript CommandLine
  patterns.

  '
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0131
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])

    | event_platform=Win

    | ImageFileName=/\\mshta\.exe$/i

    | CommandLine=/(https?:\/\/|javascript:|vbscript:|\.hta)/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName, #event_simpleName],
    function=count())

    '
mitre:
  tactics:
  - defense-evasion
  - execution
  techniques:
  - T1218.005
title: 'Falcon: ProcessBlocked Mshta Remote Pattern'
status: experimental
references:
- https://attack.mitre.org/techniques/T1218/005/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/LOLBin_Mshta.yml
tags:
- cs-query-hub
- safe-esn-wave
- tp-quality-v2
- src:LOLBin_Mshta.yml
- esn:ProcessBlocked
- esn:ProcessRollup2
severity: high
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
