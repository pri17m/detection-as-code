id: DAC-CS-0218
title: accessibility binary spawning a shell
description: >-
  If an accessibility binary such as sethc or utilman starts cmd or PowerShell, the sticky-keys
  backdoor is in use (T1546.008). A hit is that parent-child pair. Explorer starting cmd does not
  match. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - persistence
  - privilege-escalation
  techniques:
  - T1546.008
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "Assistive technology that launches PowerShell by design."
references:
- https://attack.mitre.org/techniques/T1546/008/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0347
- parity:DAC-MDE-0081
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ParentBaseFileName=/^(sethc|utilman|osk|magnify|narrator)\.exe$/i
    | ImageFileName=/\\(cmd|powershell|pwsh)\.exe$/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
