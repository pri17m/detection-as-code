id: DAC-CS-0172
title: 'Falcon: FalconFlank: CrowdStrike Falcon Macro-Remediation DLL Sideload LPE'
description: |
  detections.ai community gap-fill for: FalconFlank: CrowdStrike Falcon Macro-Remediation DLL Sideload LPE. Heuristic TP-style CQL on SAFE ESN ClassifiedModuleLoad derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a07c1e-8548-76ef-aa78-362a7f9d9421
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  - persistence
  techniques:
  - T1574.001
  - T1055
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a07c1e-8548-76ef-aa78-362a7f9d9421
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1574/001/
- https://attack.mitre.org/techniques/T1055/
telemetry_validated: false
required_fields:
- #event_simpleName
- ModulePath
- ImageFileName
- ComputerName
- aid
- TargetProcessId
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ClassifiedModuleLoad
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ClassifiedModuleLoad
    | ModulePath=/(\\users\\|\\appdata\\|\\programdata\\|\\temp\\)/i
    | groupBy([aid, ComputerName, ModulePath, ImageFileName], function=count())
