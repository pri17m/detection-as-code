id: DAC-CS-0217
title: auto-elevate binary spawning a shell or script host
description: >-
  fodhelper, computerdefaults, sdclt, and eventvwr are auto-elevate binaries. The UAC bypass
  (T1548.002) is visible when one of them starts cmd, PowerShell, wscript, cscript, mshta,
  rundll32, or regsvr32. eventvwr starting mmc, and fodhelper starting SystemSettings, do not
  match. Telemetry is Falcon ProcessRollup2 and ProcessBlocked on event_platform=Win.
  ImageFileName is the full path. ParentBaseFileName is the parent file name only. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1548.002
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A settings binary that is supposed to start one of these children."
references:
- https://attack.mitre.org/techniques/T1548/002/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0346
- parity:DAC-MDE-0080
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ParentBaseFileName=/^(fodhelper|computerdefaults|sdclt|eventvwr)\.exe$/i
    | ImageFileName=/\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32)\.exe$/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
