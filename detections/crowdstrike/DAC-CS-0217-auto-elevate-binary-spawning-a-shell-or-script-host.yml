id: DAC-CS-0217
title: auto-elevate binary spawning a shell or script host
description: "ProcessRollup2 where ParentBaseFileName is fodhelper, computerdefaults, sdclt, or eventvwr and the child is a shell or script host. ParentBaseFileName is the base name, not a path. mmc is not a child. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1548.002
sourcetypes:
- falcon:process
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
telemetry_validated: false
false_positives:
- "A settings binary that is supposed to start one of these children."
references:
- https://attack.mitre.org/techniques/T1548/002/
- https://docs.panther.com/data-onboarding/supported-logs/crowdstrike/falcon-data-replicator
tags:
- quality-wave
- parity:DAC-WIN-0346
- parity:DAC-MDE-0080
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2", "ProcessBlocked"])
    | event_platform=Win
    | ParentBaseFileName=/^(fodhelper|computerdefaults|sdclt|eventvwr)\.exe$/i
    | ImageFileName=/\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32)\.exe$/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
