sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- SHA256HashData
- UserName
- aid
- event_platform
status: experimental
author: Detection Engineer
description: Detects credential-dumping tooling and LSASS-targeted CommandLine/ImageFileName activity
  (mimikatz/procdump/pwdump/sekurlsa). ProcessRollup2 port of Query-Hub Credential_Dumping_Detection;
  process-access IOA preferred when available in tenant.
tags:
- wave-a
- P0
- parity:DAC-WIN-0100
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- qh:Credential_Dumping_Detection.yml
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.001
id: DAC-CS-0013
query:
  crowdstrike: "#event_simpleName=ProcessRollup2 event_platform=Win\n| (CommandLine=/(mimikatz|procdump|sekurlsa|lsass\\\
    .exe)/i\n    OR ImageFileName=/\\\\(mimikatz|procdump|pwdump)\\.exe$/i)\n| !in(field=ParentBaseFileName,\
    \ values=[\"powershell.exe\",\"pwsh.exe\",\"cmd.exe\"], ignoreCase=true)\n| table([aid, ComputerName,\
    \ UserName, ImageFileName, CommandLine, ParentBaseFileName, SHA256HashData])\n"
severity: high
title: 'Falcon: LSASS process access by non-EDR'
false_positives:
- "Security tools and EDR that legitimately touch LSASS \u2014 exclude known EDR ImageFileName/SHA256\
  \ in tenant."
- Admin procdump for crash analysis; allowlist approved operators and parents.
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1003/001/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Credential_Dumping_Detection.yml
