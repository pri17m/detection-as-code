id: DAC-CS-0188
title: 'Falcon: Infostealer browser credential access from suspicious paths (multi-file)'
description: |
  detections.ai community gap-fill for: Infostealer browser credential access from suspicious paths (multi-file). Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a08592-67b0-775c-b1eb-85cc39bf06ae
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003
  - T1558
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a08592-67b0-775c-b1eb-85cc39bf06ae
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1003/
- https://attack.mitre.org/techniques/T1558/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(infostealer|browser|credential|access)/i OR ImageFileName=/(infostealer|browser|credential|access)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
