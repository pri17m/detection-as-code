id: DAC-CS-0087
status: experimental
severity: medium
author: DaC
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: This query detects potential exploitation of the April 2026 Adobe Reader zero-day vulnerability
  by identifying suspicious network connections originating from Adobe Reader processe
platforms:
- crowdstrike
title: 'Falcon: Snowman'
mitre:
  tactics:
  - execution
  techniques:
  - T1059
references:
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/snowman.yml
query:
  crowdstrike: "#event_simpleName=ProcessRollup2\n| ImageFileName=/\\\\(Acrobat|AcroRd32|AcroRd64)\\.exe$/i\n\
    | rename(field=TargetProcessId, as=AdobePid)\n| join({\n    in(#event_simpleName, values=[\"NetworkConnectIP4\"\
    ,\"NetworkConnectIP6\"])\n    | ContextBaseFileName=/\\b(Acrobat|AcroRd32|AcroRd64|AdobeCollabSync|Synchronizer)\\\
    .exe\\b/i\n    | rename(field=ContextProcessId, as=AdobePid)\n  }, field=[aid, AdobePid], key=[aid,\
    \ AdobePid], include=[RemoteAddressIP4, RemoteAddressIP6, RemotePort, ContextTimeStamp])\n| (RemoteAddressIP4=*\
    \ OR RemoteAddressIP6=*)\n| RemotePort!=80 RemotePort!=443\n| case {\n    in(RemoteAddressIP4, values=[\"\
    169.40.2.68\",\"188.214.34.20\"]) | Confidence:=\"HIGH - Known C2 IOC\";\n    in(RemotePort, values=[45191,\
    \ 34123]) | Confidence:=\"MEDIUM - Known C2 port\";\n    * | Confidence:=\"LOW - Anomalous non-HTTP(S)\
    \ connection\";\n  }\n| table([aid, ComputerName, ImageFileName, CommandLine, RemoteAddressIP4, RemotePort,\
    \ Confidence])\n"
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ContextBaseFileName
- ContextProcessId
- ContextTimeStamp
- ImageFileName
- RemoteAddressIP4
- RemoteAddressIP6
- RemotePort
- TargetProcessId
- aid
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:snowman.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
- esn:NetworkConnectIP4
- esn:NetworkConnectIP6
