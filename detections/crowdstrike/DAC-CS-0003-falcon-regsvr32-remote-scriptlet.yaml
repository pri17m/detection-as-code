sourcetypes:
- falcon:process
telemetry_validated: false
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- aid
- event_platform
status: experimental
author: Detection Engineer
description: 'Detects regsvr32 loading scrobj.dll with /i: (remote scriptlet / Squiblydoo-style proxy
  execution). Direct Query-Hub LOLBin_Regsvr32 port.'
tags:
- enhance-tp
- tp-quality-v2
- processrollup2
- esn:ProcessRollup2
- esn:ProcessBlocked
- qh:LOLBin_Regsvr32.yml
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1218.010
id: DAC-CS-0003
query:
  crowdstrike: 'in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])

    | event_platform=Win

    | ImageFileName=/regsvr32\.exe$/i

    | CommandLine=/scrobj\.dll/i

    | CommandLine=/[\/\-]i:/i

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
severity: medium
title: 'Falcon: regsvr32 remote scriptlet'
false_positives:
- Rare legitimate COM scriptlet registration; allowlist known admin tooling and parents.
- "Software deployment that registers scriptlets from approved shares \u2014 baseline CommandLine."
platforms:
- crowdstrike
references:
- https://attack.mitre.org/techniques/T1218/010/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/LOLBin_Regsvr32.yml
