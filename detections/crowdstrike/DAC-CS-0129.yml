platforms:
- crowdstrike
author: Detection Engineer
sourcetypes:
- falcon:process
telemetry_validated: false
description: "Module loads where hosting ImageFileName is a System32 Microsoft binary but loaded FilePath\
  \ is under\nuser-writable locations \u2014 DLL side-loading shape (distinct from DAC-CS-0069 Chromium\
  \ hunt).\n"
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0129
query:
  crowdstrike: '#event_simpleName=ClassifiedModuleLoad

    | ImageFileName=/\\Windows\\(System32|SysWOW64)\\[^\\]+\.exe$/i

    | FileName=/\.dll$/i

    | FilePath=/(\\AppData\\|\\Temp\\|\\Users\\Public\\|\\ProgramData\\)/i

    | FilePath!=/\\Windows\\(System32|SysWOW64)\\/i

    | groupBy([aid, ComputerName, ImageFileName, FileName, FilePath], function=count())

    '
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1574.001
title: 'Falcon: ClassifiedModuleLoad into Signed Microsoft Binary from User Path'
status: experimental
references:
- https://attack.mitre.org/techniques/T1574/001/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/Dll-Side_Loading_Detection_Query.yml
tags:
- cs-query-hub
- safe-esn-wave
- tp-quality-v2
- src:Dll-Side_Loading_Detection_Query.yml
- esn:ClassifiedModuleLoad
severity: high
required_fields:
- '#event_simpleName'
- ComputerName
- FileName
- FilePath
- ImageFileName
- aid
