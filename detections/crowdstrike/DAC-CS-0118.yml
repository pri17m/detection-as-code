platforms:
- crowdstrike
author: DaC
sourcetypes:
- falcon:process
telemetry_validated: false
description: 'ScriptControlScanV2 ScriptContent matching Start-BitsTransfer / BitsTransfer module usage
  with

  HTTP(S) or -Source/-Destination.

  '
false_positives:
- "Legitimate admin, software deployment, or IT tooling matching these patterns \u2014 baseline before\
  \ promote."
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
id: DAC-CS-0118
query:
  crowdstrike: '#event_simpleName=ScriptControlScanV2

    | ScriptContent=/(Start-BitsTransfer|Import-Module\s+BitsTransfer|BITS\.IBackgroundCopyManager)/i

    | ScriptContent=/(https?:\/\/|-Source|-Destination)/i

    | groupBy([aid, ComputerName], function=[count(), collect([ScriptContent], limit=3)])

    '
