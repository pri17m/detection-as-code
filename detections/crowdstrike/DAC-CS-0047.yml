mitre:
  tactics:
  - impact
  techniques:
  - T1490
severity: high
required_fields:
- ImageFileName
- CommandLine
- ParentBaseFileName
- aid
- ComputerName
- TargetProcessId
query:
  crowdstrike: '#event_simpleName=ProcessRollup2

    // Enhanced from Query-Hub ProcessRollup patterns (01b); keep prior intent

    // prior: ImageFileName="bcdedit.exe" AND CommandLine CONTAINS_ANY ["recoveryenabled","bootstatuspolicy"]

    // --- src: ransomware_precursors.yml (Falcon: Ransomware Precursors) ---

    | CmdLower := lower("CommandLine")

    | ImageFileName=/\\vssadmin\.exe$/i

    | ImageFileName=/\\vssadmin\.exe$/i

    | ImageFileName=/\\wmic\.exe$/i

    | ImageFileName=/\\(powershell|powershell_ise|pwsh)\.exe$/i

    | ImageFileName=/\\wbadmin\.exe$/i

    | ImageFileName=/\\bcdedit\.exe$/i

    | ImageFileName=/\\fsutil\.exe$/i

    // --- src: shadow_mcp_server_activity_via_common_runtime_interpreters.yml (Falcon: Shadow MCP Server
    Activity via Common Runtime Interp) ---

    | FileName = /(?i)^(node|node\.exe|npx|npx\.cmd|python|python\.exe|python3|uv|uvx|docker|docker\.exe)$/

    | CommandLine = /(?i)(server-filesystem|server-github|server-postgres|server-sqlite|server-puppeteer|server-brave|modelcontext|mcp)/

    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())

    '
