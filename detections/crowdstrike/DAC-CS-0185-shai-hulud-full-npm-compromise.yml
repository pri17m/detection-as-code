id: DAC-CS-0185
title: 'Falcon: Shai-Hulud full npm compromise'
description: |
  detections.ai community gap-fill for: Shai-Hulud full npm compromise. Heuristic TP-style CQL on SAFE ESN DnsRequest derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/0f5b020b-343b-48c4-bfbd-e04449892657
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - initial-access
  - execution
  techniques:
  - T1195.001
  - T1059
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/0f5b020b-343b-48c4-bfbd-e04449892657
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1195/001/
- https://attack.mitre.org/techniques/T1059/
telemetry_validated: false
required_fields:
- #event_simpleName
- DomainName
- ComputerName
- aid
- ContextProcessId
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:DnsRequest
- lang:cql
query:
  crowdstrike: |
    #event_simpleName=DnsRequest
    | DomainName=/(npmjs|registry\.npmjs|pub\.dev|googleapis|github)/i
    | groupBy([aid, ComputerName, DomainName], function=count())
