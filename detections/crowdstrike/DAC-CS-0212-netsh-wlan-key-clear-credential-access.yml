id: DAC-CS-0212
title: Credential access via netsh wlan key material dump
description: Detects netsh.exe invoking WLAN profile export or show commands that disclose cleartext/key material (key=clear, keyMaterial, export profile) — credential access / discovery behaviour (T1040 / T1003). Uses only ProcessRollup2 fields confirmed in Falcon public content.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- "falcon:process"
mitre:
  tactics:
  - credential-access
  - discovery
  techniques:
  - T1040
  - T1003
severity: medium
false_positives:
- IT helpdesk exporting WLAN profiles for device provisioning — allowlist admin accounts and approved parent processes.
- "Tuning knob: require key=clear specifically; drop generic export profile if noisy."
references:
- "https://attack.mitre.org/techniques/T1040/"
- "https://attack.mitre.org/techniques/T1003/"
- "https://learn.microsoft.com/en-us/windows-server/networking/technologies/netsh/netsh-contexts"
telemetry_validated: false
required_fields:
- "#event_simpleName"
- event_platform
- aid
- ComputerName
- ImageFileName
- CommandLine
- ParentBaseFileName
tags:
- wave1
- credential-access
- tp-quality
- backfill
query:
  crowdstrike: |
    in(#event_simpleName, values=["ProcessRollup2","ProcessBlocked"])
    | event_platform=Win
    | ImageFileName=/\\netsh\.exe$/i
    | CommandLine=/\bwlan\b/i
    | CommandLine=/(key\s*=\s*clear|keyMaterial|export\s+profile|show\s+profiles?\s+name)/i
    | ParentBaseFileName!=/^(MsMpEng|CSFalconService)\.exe$/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
