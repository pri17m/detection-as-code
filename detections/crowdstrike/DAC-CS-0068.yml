id: DAC-CS-0068
status: experimental
severity: medium
author: DaC
false_positives:
- "Legitimate admin or software deployment matching ImageFileName/CommandLine patterns \u2014 baseline\
  \ before promote."
- Tune ParentBaseFileName allowlists for known management tools.
sourcetypes:
- falcon:process
telemetry_validated: false
description: Exploitation of Windows Shell CVE-2026-32202
platforms:
- crowdstrike
title: 'Falcon: CVE-2026-32202 - Windows Shell'
mitre:
  tactics:
  - execution
  techniques:
  - T1059
references:
- https://attack.mitre.org/techniques/T1059/
- https://github.com/ByteRay-Labs/Query-Hub/blob/main/queries/cve_2026_32202_windows_shell.yml
query:
  crowdstrike: "#event_simpleName=ProcessRollup2 event_platform=Win\n| (\n    (ImageFileName=/\\\\(cmd|powershell|pwsh|net|net1)\\\
    .exe$/i\n      AND CommandLine=/(net\\s+use|\\\\\\\\[^\\\\\\s]+\\\\(ADMIN\\$|C\\$|IPC\\$)|Copy-Item\\\
    s+.*\\\\\\\\|New-PSDrive|net\\s+share)/i)\n    OR\n    (ImageFileName=/\\\\(cmd|powershell|pwsh)\\\
    .exe$/i\n      AND ParentBaseFileName=/^(services|svchost)\\.exe$/i\n      AND CommandLine=/(whoami|net\\\
    s+user|nltest|ipconfig\\s+\\/all)/i)\n  )\n| table([aid, ComputerName, UserName, ImageFileName, ParentBaseFileName,\
    \ CommandLine])\n"
required_fields:
- '#event_simpleName'
- CommandLine
- ComputerName
- ImageFileName
- ParentBaseFileName
- UserName
- aid
- event_platform
tags:
- cs-query-hub
- processrollup2
- wave-cs-qh
- P1
- src:cve_2026_32202_windows_shell.yml
- tp-rewrite
- tp-quality-v2
- esn:ProcessRollup2
