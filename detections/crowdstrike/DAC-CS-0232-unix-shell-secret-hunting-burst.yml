id: DAC-CS-0232
title: Burst of shell searches for secrets on Linux or macOS
description: Counts distinct grep/egrep/fgrep/rg/find/awk/ack command lines per host and UID that search for credential keywords (password, secret, AWS_SECRET_ACCESS_KEY, PRIVATE KEY, api_key, token) recursively or across home, /root, /etc or web roots, and alerts at 3 or more distinct searches in the window. One-off greps are normal; repeated keyword sweeps across the filesystem are credential hunting. Schedule every 15 minutes over a 15-minute window. CommandHistory is not used because its field name is undocumented.
author: DaC
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - credential-access
  techniques:
  - T1552.001
severity: medium
false_positives:
- Secret-scanning or config-audit scripts run by platform teams; allowlist by UID and parent.
references:
- https://attack.mitre.org/techniques/T1552/001/
- https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
- https://github.com/CrowdStrike/logscale-community-content/blob/main/Queries-Only/Queries/%5BT1087.001%5D%20Account%20Discovery%20-%20Local%20Accounts%20-%20Mac.logscale
telemetry_validated: false
required_fields:
- '#event_simpleName'
- event_platform
- aid
- ComputerName
- UID
- ImageFileName
- CommandLine
- ParentBaseFileName
tags:
- behavioural
- clean-room
- wave2
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2 event_platform=/^(Lin|Mac)$/
    | ImageFileName=/\/(grep|egrep|fgrep|rg|find|awk|ack)$/
    | CommandLine=/(password|passwd|secret|AWS_SECRET_ACCESS_KEY|PRIVATE KEY|api[_-]?key|token)/i
    | CommandLine=/(\s-[a-zA-Z]*[rR][a-zA-Z]*\s|--recursive|\/home\/|\/Users\/|\/root\b|\/etc\b|\/var\/www|~\/|\s\/\s)/
    | groupBy([aid, ComputerName, UID], function=[count(CommandLine, distinct=true, as=distinctSearches), count(as=runs), collect([ImageFileName, CommandLine, ParentBaseFileName])])
    | distinctSearches >= 3
