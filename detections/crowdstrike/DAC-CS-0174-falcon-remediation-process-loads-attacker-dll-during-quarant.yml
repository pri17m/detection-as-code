id: DAC-CS-0174
title: 'Falcon: Falcon Remediation Process Loads Attacker DLL During Quarantine Action'
description: |
  detections.ai community gap-fill for: Falcon Remediation Process Loads Attacker DLL During Quarantine Action. Heuristic TP-style CQL on SAFE ESN ProcessRollup2 derived from title/tags; telemetry_validated=false until tenant baselining. Source: https://detections.ai/rules/01a07c1e-82b3-74df-bbbd-1575de58a6b6
author: Detection Engineer
status: experimental
platforms:
- crowdstrike
sourcetypes:
- falcon:process
mitre:
  tactics:
  - defense-evasion
  - persistence
  techniques:
  - T1574.001
  - T1055
severity: medium
false_positives:
- Legitimate admin, software deployment, or IT tooling matching these patterns — baseline before promote.
- Tune allowlists for known management / RMM / build accounts and approved paths after tenant baselining.
references:
- https://detections.ai/rules/01a07c1e-82b3-74df-bbbd-1575de58a6b6
- https://attack.mitre.org/
- https://attack.mitre.org/techniques/T1574/001/
- https://attack.mitre.org/techniques/T1055/
telemetry_validated: false
required_fields:
- #event_simpleName
- ImageFileName
- CommandLine
- ParentBaseFileName
- ComputerName
- aid
tags:
- detections-ai-gap
- tp-quality-v2
- src:detections.ai
- esn:ProcessRollup2
- lang:kql-ported
query:
  crowdstrike: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/(remediation|loads|attacker|during)/i OR ImageFileName=/(remediation|loads|attacker|during)/i
    | groupBy([aid, ComputerName, ImageFileName, CommandLine, ParentBaseFileName], function=count())
