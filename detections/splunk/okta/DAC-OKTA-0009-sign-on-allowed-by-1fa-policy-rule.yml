id: DAC-OKTA-0009
title: 'Okta: sign-in allowed by a single-factor (1FA) policy rule'
description: Detects Okta System Log policy.evaluate_sign_on events with outcome.result=ALLOW where a matched rule target has detailEntry.policyRuleFactorMode=1FA, i.e. Okta let the user in with one factor. A stolen password alone is enough for these sign-ins. One row per user and app (target of type AppInstance) with the matched rule names. Built only from field paths and values in the Splunk attack_data sample okta_single_factor_auth.log.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- OktaIM2:log
mitre:
  tactics:
  - initial-access
  - persistence
  - privilege-escalation
  - stealth
  techniques:
  - T1078.004
severity: medium
false_positives:
- Apps or networks deliberately configured for 1FA (e.g. a low-risk app from a trusted zone). Tune by app and rule name; each row names both.
references:
- https://github.com/splunk/security_content/blob/develop/detections/application/okta_successful_single_factor_authentication.yml
- https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078.004/okta_single_factor_auth/okta_single_factor_auth.log
- https://developer.okta.com/docs/okta-event-types.csv
- https://developer.okta.com/docs/reference/system-log-query/
- https://splunk.github.io/splunk-add-on-for-okta-identity-cloud/Sourcetypes/
- 'Attribution: splunk/security_content and splunk/attack_data (Apache-2.0), see THIRD_PARTY_NOTICES.md'
telemetry_validated: false
required_fields:
- eventType
- outcome.result
- target{}.detailEntry.policyRuleFactorMode
- target{}.type
- target{}.displayName
- actor.alternateId
- client.ipAddress
tags:
- okta
- policy
- mfa
- okta-system-log
- attack-data-payload
query:
  splunk: |
    sourcetype="OktaIM2:log" eventType="policy.evaluate_sign_on" outcome.result="ALLOW" "target{}.detailEntry.policyRuleFactorMode"="1FA"
    | eval app=mvindex('target{}.displayName', mvfind('target{}.type', "^AppInstance$"))
    | fillnull value="unknown" app
    | stats min(_time) as firstTime max(_time) as lastTime count values(target{}.displayName) as targets values(client.ipAddress) as src_ip by actor.alternateId app
