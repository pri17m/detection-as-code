id: DAC-OKTA-0007
title: 'Okta: five or more users fail sign-in from one IP in 10 minutes (password spray)'
description: 'Counts Okta System Log user.session.start events with outcome.result=FAILURE and outcome.reason=INVALID_CREDENTIALS per client.ipAddress in 10-minute bins and alerts when five or more distinct actor.alternateId values fail with no more than three failures per user on average (spray shape: few tries across many accounts, not one locked-out user). Built only from field paths and values in the Splunk attack_data sample okta_multiple_users_from_ip.log.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- OktaIM2:log
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
severity: medium
false_positives:
- Large office or VPN egress IP where several users mistype passwords in the same 10 minutes (e.g. after a forced password change). Check securityContext.asOrg against your own egress ranges.
references:
- https://github.com/splunk/security_content/blob/develop/detections/application/okta_multiple_users_failing_to_authenticate_from_ip.yml
- https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1110.003/okta_multiple_users_from_ip/okta_multiple_users_from_ip.log
- https://developer.okta.com/docs/okta-event-types.csv
- https://developer.okta.com/docs/reference/system-log-query/
- https://splunk.github.io/splunk-add-on-for-okta-identity-cloud/Sourcetypes/
- 'Attribution: splunk/security_content and splunk/attack_data (Apache-2.0), see THIRD_PARTY_NOTICES.md'
telemetry_validated: false
required_fields:
- eventType
- outcome.result
- outcome.reason
- client.ipAddress
- actor.alternateId
- client.userAgent.rawUserAgent
- securityContext.asOrg
tags:
- okta
- password-spray
- okta-system-log
- attack-data-payload
query:
  splunk: |
    sourcetype="OktaIM2:log" eventType="user.session.start" outcome.result="FAILURE" outcome.reason="INVALID_CREDENTIALS"
    | bin _time span=10m
    | stats min(_time) as firstTime max(_time) as lastTime count as failures dc(actor.alternateId) as users values(actor.alternateId) as user values(client.userAgent.rawUserAgent) as user_agent values(securityContext.asOrg) as as_org by _time client.ipAddress
    | eval failures_per_user=round(failures/users, 1)
    | where users>=5 AND failures_per_user<=3
