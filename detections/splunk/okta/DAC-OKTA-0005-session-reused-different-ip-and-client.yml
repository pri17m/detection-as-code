id: DAC-OKTA-0005
title: 'Okta: one session allowed from two IPs with different browser or OS'
description: Groups Okta System Log policy.evaluate_sign_on events with outcome.result=ALLOW by authenticationContext.externalSessionId and user, and alerts when the same session is allowed from more than one client.ipAddress and the client.userAgent.browser or client.userAgent.os also changes. A stolen Okta session cookie replayed from another machine keeps the session id but brings a new IP and client. country_change=1 when client.geographicalContext.country differs. Built only from field paths and values in the Splunk attack_data sample okta_web_session_multiple_ip.log.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- OktaIM2:log
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1550.004
severity: high
false_positives:
- 'User moves between networks and browsers while one Okta session stays valid (rare: the session cookie lives in one browser). Corporate proxies that rewrite User-Agent.'
references:
- https://github.com/splunk/security_content/blob/develop/detections/application/okta_suspicious_use_of_a_session_cookie.yml
- https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1539/okta_web_session_multiple_ip/okta_web_session_multiple_ip.log
- https://developer.okta.com/docs/okta-event-types.csv
- https://developer.okta.com/docs/reference/system-log-query/
- https://splunk.github.io/splunk-add-on-for-okta-identity-cloud/Sourcetypes/
- 'Attribution: splunk/security_content and splunk/attack_data (Apache-2.0), see THIRD_PARTY_NOTICES.md'
telemetry_validated: false
required_fields:
- eventType
- outcome.result
- authenticationContext.externalSessionId
- actor.alternateId
- client.ipAddress
- client.userAgent.browser
- client.userAgent.os
- client.userAgent.rawUserAgent
- client.geographicalContext.country
- target{}.displayName
tags:
- okta
- session
- okta-system-log
- attack-data-payload
query:
  splunk: |
    sourcetype="OktaIM2:log" eventType="policy.evaluate_sign_on" outcome.result="ALLOW" authenticationContext.externalSessionId=*
    | eval session='authenticationContext.externalSessionId', ip='client.ipAddress', browser='client.userAgent.browser', os='client.userAgent.os'
    | stats min(_time) as firstTime max(_time) as lastTime dc(ip) as ip_count dc(browser) as browser_count dc(os) as os_count values(ip) as src_ip values(browser) as browser values(os) as os values(client.userAgent.rawUserAgent) as user_agent values(client.geographicalContext.country) as country values(target{}.displayName) as target by session actor.alternateId
    | where ip_count>1 AND (browser_count>1 OR os_count>1)
    | eval country_change=if(mvcount(country)>1, 1, 0)
