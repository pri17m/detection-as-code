    | search modifiedProperties{}.newValue="*mfa*" OR ResultReason="*disabled*" OR ResultReason="*exclude*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
