query:
  splunk: 'sourcetype=azure:monitor:aad

    | search operationName IN ("Set DirSyncEnabled feature","Enable Soft Match","Update DirSync soft match")
    OR ActivityDisplayName="*DirSync*" OR ActivityDisplayName="*seamless SSO*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
