query:
  splunk: 'sourcetype=azure:monitor:aad

    | search operationName="Add member to role"

    | where initiator==target OR initiatedBy.user.userPrincipalName==targetResources{}.userPrincipalName

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
id: DAC-ENTRA-0004
title: 'Entra: Self-elevation via role assignment by same actor'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- azure:monitor:aad
platforms:
- splunk
tags:
- wave-b
- P0
telemetry_validated: false
required_fields:
- operationName
- initiatedBy
- ipAddress
- userPrincipalName
references:
- https://attack.mitre.org/techniques/T1098/003/
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1098.003
author: Detection Engineer
status: experimental
description: initiator == target role assignee
