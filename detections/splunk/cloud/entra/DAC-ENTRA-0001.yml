    | search operationName="Add member to role" OR ActivityDisplayName="Add member to role"

    | search modifiedProperties{}.newValue="*Global Administrator*" OR modifiedProperties{}.newValue="*Privileged
    Role Administrator*" OR ResultReason="*Global Admin*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
