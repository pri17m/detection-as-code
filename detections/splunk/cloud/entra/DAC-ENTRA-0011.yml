query:
  splunk: 'sourcetype=azure:monitor:aad

    | search Category="SignInLogs" OR OperationName="Sign-in activity"

    | search Status.errorCode=0

    | search authenticationRequirement="singleFactorAuthentication" OR logonType="nonInteractiveUser"
    OR isInteractive=false

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
