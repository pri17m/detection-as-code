query:
  splunk: 'sourcetype=azure:monitor:aad

    | search operationName IN ("Delete diagnostic setting","Update diagnostic setting","Disable AzureAD
    audit logs") OR ActivityDisplayName="*diagnostic*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
