query:
  splunk: 'sourcetype=azure:monitor:aad

    | search Category="SignInLogs" Status.errorCode!=0

    | stats dc(userPrincipalName) as users count as attempts by ipAddress, bin(_time,15m)

    | where users>=10 AND attempts/users < 5

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
id: DAC-ENTRA-0033
title: 'Entra: Password spray pattern across many users one source IP'
false_positives:
