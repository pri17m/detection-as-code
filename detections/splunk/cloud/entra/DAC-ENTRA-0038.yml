query:
  splunk: 'sourcetype=azure:monitor:aad

    | search operationName="Consent to application"

    | search ConsentType="Principal" OR ResultReason="*User*"

    | search Scope="*Mail.*" OR Scope="*Files.*" OR Scope="*RoleManagement*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
