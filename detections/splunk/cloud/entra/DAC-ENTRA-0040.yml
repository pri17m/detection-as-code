query:
  splunk: 'sourcetype=azure:monitor:aad

    | search operationName IN ("Add user to access package","Add member to privileged access group") OR
    ActivityDisplayName="*access package*"

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
