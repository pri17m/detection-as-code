query:
  splunk: 'sourcetype=azure:monitor:aad

    | search Category="SignInLogs"

    | search Status.failureReason="*MFA*" OR authenticationDetails{}.succeeded=false

    | stats count as challenges sum(eval(if(Status.errorCode=0,1,0))) as accepts by userPrincipalName,
    bin(_time,15m)

    | where challenges>=5 AND accepts<=1

    | table _time, operationName, ActivityDisplayName, initiatedBy, targetResources, Result, ipAddress,
    userPrincipalName

    '
id: DAC-ENTRA-0031
title: "Entra: MFA fatigue \u2014 burst challenges then single accept"
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- azure:monitor:aad
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-related
telemetry_validated: false
required_fields:
- operationName
- initiatedBy
- ipAddress
- userPrincipalName
references:
- https://attack.mitre.org/techniques/T1621/
mitre:
  tactics:
  - credential-access
  techniques:
  - T1621
author: Detection Engineer
status: experimental
description: MFA deny storm then success
