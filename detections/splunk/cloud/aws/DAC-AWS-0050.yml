id: DAC-AWS-0050
title: 'AWS: IAM write AccessDenied from IMDSv1 AssumedRole (ec2RoleDelivery 1.0)'
description: "Part 2 Scenario 3 Event 1: AssumedRole (often EC2 instance profile) attempting IAM persistence/probe\
  \ (CreateUser/CreateRole/CreateAccessKey/Attach*Policy) that fails with AccessDenied, with userIdentity.ec2RoleDelivery=1.0\
  \ confirming IMDSv1-delivered credentials (SSRF\u2192IMDS harvest path)."
mitre:
  tactics:
  - credential-access
  - persistence
  - discovery
  techniques:
  - T1552.005
  - T1078.004
  - T1069
severity: high
references:
- https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-2/
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
- https://attack.mitre.org/techniques/T1552/005/
required_fields:
- eventName
- eventSource
- errorCode
- userIdentity.type
- userIdentity.arn
- userIdentity.ec2RoleDelivery
- userIdentity.sessionContext.sessionIssuer.userName
- sourceIPAddress
- awsRegion
- requestParameters.userName
tags:
- cloudtrail-ir-part2
- scenario-3
- P0
- tp-quality
- imdsv1
query:
  splunk: '(sourcetype=aws:cloudtrail OR sourcetype=aws:cloudtrail:json OR sourcetype=aws:cloudtrail:event)

    | search eventSource="iam.amazonaws.com" eventName IN ("CreateUser","CreateRole","CreateAccessKey","CreateLoginProfile","AttachUserPolicy","AttachRolePolicy","PutUserPolicy","PutRolePolicy","UpdateAssumeRolePolicy")

    | search errorCode="AccessDenied" OR errorCode="Client.UnauthorizedOperation" OR errorCode="AccessDeniedException"

    | search userIdentity.type="AssumedRole" (''userIdentity.ec2RoleDelivery''="1.0" OR userIdentity.ec2RoleDelivery=1.0
    OR userIdentity.ec2RoleDelivery="1")

    | table _time, eventName, errorCode, errorMessage, userIdentity.arn, userIdentity.principalId, userIdentity.ec2RoleDelivery,
    userIdentity.sessionContext.sessionIssuer.userName, userIdentity.sessionContext.attributes.mfaAuthenticated,
    requestParameters.userName, requestParameters.roleName, sourceIPAddress, awsRegion, userAgent, readOnly

    '
author: Threat detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- aws:cloudtrail
- aws:cloudtrail:json
- aws:cloudtrail:event
telemetry_validated: false
false_positives:
- Tune after baselining legitimate workload roles and Regions; experimental until tenant field confirm.
