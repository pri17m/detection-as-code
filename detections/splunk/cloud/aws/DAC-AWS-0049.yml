id: DAC-AWS-0049
title: 'AWS: S3 ListBuckets then DeleteBucket by same principal (management-plane)'
description: 'Management-plane impact chain when S3 data events are unavailable: ListBuckets recon followed
  by DeleteBucket from the same actor within 60m. Object DeleteObject remains DAC-AWS-0043 (needs data
  events).'
author: Threat detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- aws:cloudtrail
- aws:cloudtrail:json
- aws:cloudtrail:event
mitre:
  tactics:
  - impact
  - discovery
  techniques:
  - T1485
  - T1580
severity: high
false_positives:
- "Bucket teardown automation \u2014 allowlist destroy roles."
references:
- https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-1/
- https://attack.mitre.org/techniques/T1485/
telemetry_validated: false
required_fields:
- eventName
- eventSource
- userIdentity.arn
- sourceIPAddress
- awsRegion
tags:
- cloudtrail-ir-part1
- scenario-1
- P0
- tp-quality
- management-plane
query:
  splunk: '(sourcetype=aws:cloudtrail OR sourcetype=aws:cloudtrail:json OR sourcetype=aws:cloudtrail:event)

    | search eventSource="s3.amazonaws.com" eventName IN ("ListBuckets","DeleteBucket")

    | eval actor=coalesce(userIdentity.arn, userIdentity.principalId)

    | transaction actor maxspan=60m startswith=(eventName="ListBuckets") endswith=(eventName="DeleteBucket")

    | search eventcount>=2

    | table _time, actor, eventcount, sourceIPAddress, awsRegion, userIdentity.type, userAgent

    '
