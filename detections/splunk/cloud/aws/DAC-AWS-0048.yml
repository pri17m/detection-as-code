id: DAC-AWS-0048
title: 'AWS: ConsoleLogin success without MFA (MFAUsed=No)'
description: 'Primary console MFA signal per Telemetry: eventName=ConsoleLogin with additionalEventData.MFAUsed=No
  and responseElements.ConsoleLogin=Success. Complements DAC-AWS-0045 (sessionCredentialFromConsole /
  session mfaAuthenticated on follow-on APIs). Values are Yes/No strings. Tightens Wave C DAC-AWS-0011.

  '
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- aws:cloudtrail
mitre:
  tactics:
  - initial-access
  techniques:
  - T1078.004
severity: high
false_positives:
- "Break-glass IAM users without MFA \u2014 allowlist. Some federated/SSO flows emit MFAUsed=No; baseline\
  \ IdP."
- "Failed logons can still carry MFAUsed=No \u2014 this variant requires ConsoleLogin=Success only."
references:
- https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-1/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
- https://attack.mitre.org/techniques/T1078/004/
telemetry_validated: false
required_fields:
- eventName
- eventSource
- additionalEventData.MFAUsed
- responseElements.ConsoleLogin
- userIdentity.arn
- userIdentity.type
- sourceIPAddress
- userAgent
- awsRegion
tags:
- cloudtrail-ir-part1
- scenario-2
- P0
- tp-quality
- console-login
query:
  splunk: '(sourcetype=aws:cloudtrail OR sourcetype=aws:cloudtrail:json OR sourcetype=aws:cloudtrail:event)

    | search eventSource=signin.amazonaws.com eventName=ConsoleLogin additionalEventData.MFAUsed="No"

    | search responseElements.ConsoleLogin="Success" OR errorCode="success"

    | stats count values(userIdentity.type) as user_type values(userIdentity.userName) as userName values(sourceIPAddress)
    as sourceIPAddress values(userAgent) as userAgent values(awsRegion) as awsRegion min(_time) as first_seen
    max(_time) as last_seen by userIdentity.arn

    | where count>=1

    '
