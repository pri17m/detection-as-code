id: DAC-AWS-0048
title: 'AWS: S3 CopyObject or GetObject then DeleteObject steal-then-destroy (data events required)'
description: "Scenario 1 steal-then-destroy chain on object APIs. REQUIRES S3 CloudTrail data events (or\
  \ equivalent) \u2014 CopyObject/DeleteObject/GetObject are NOT in management-only trails. telemetry_validated=false\
  \ until tenant enables data events; sourcetype still aws:cloudtrail* when data events land in same index/sourcetype\
  \ family."
author: Threat detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- aws:cloudtrail
- aws:cloudtrail:json
- aws:cloudtrail:event
mitre:
  tactics:
  - exfiltration
  - impact
  techniques:
  - T1537
  - T1485
severity: critical
false_positives:
- "App lifecycle rewrite/delete patterns \u2014 require data-event enablement and path allowlists before\
  \ promote."
references:
- https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-1/
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-s3-info.html
- https://attack.mitre.org/techniques/T1485/
telemetry_validated: false
required_fields:
- eventName
- eventSource
- userIdentity.arn
- requestParameters.bucketName
- requestParameters.key
- sourceIPAddress
- awsRegion
tags:
- cloudtrail-ir-part1
- scenario-1
- P0
- tp-quality
- requires-s3-data-events
query:
  splunk: '(sourcetype=aws:cloudtrail OR sourcetype=aws:cloudtrail:json OR sourcetype=aws:cloudtrail:event)

    | search eventSource="s3.amazonaws.com" eventName IN ("CopyObject","GetObject","DeleteObject","DeleteObjects")

    | eval actor=coalesce(userIdentity.arn, userIdentity.principalId)

    | eval obj=coalesce(requestParameters.key, requestParameters.Key, resources{}.ARN)

    | transaction actor obj maxspan=30m startswith=(eventName IN ("CopyObject","GetObject")) endswith=(eventName
    IN ("DeleteObject","DeleteObjects"))

    | search eventcount>=2

    | table _time, actor, obj, eventcount, sourceIPAddress, awsRegion, userAgent, recipientAccountId

    '
