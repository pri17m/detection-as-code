id: DAC-AWS-0048
title: 'AWS: ConsoleLogin success without MFA (MFAUsed=No)'
description: 'Primary console MFA signal per Telemetry: eventName=ConsoleLogin with additionalEventData.MFAUsed=No
  and successful login. Complements DAC-AWS-0045 (sessionCredentialFromConsole / session mfaAuthenticated
  on follow-on APIs). Values are Yes/No strings.'
author: Threat detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- aws:cloudtrail
- aws:cloudtrail:json
- aws:cloudtrail:event
mitre:
  tactics:
  - initial-access
  techniques:
  - T1078.004
severity: high
false_positives:
- "Break-glass IAM users without MFA \u2014 allowlist. Some federated/SSO flows may emit MFAUsed=No; baseline\
  \ IdP."
references:
- https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-1/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
- https://attack.mitre.org/techniques/T1078/004/
telemetry_validated: false
required_fields:
- eventName
- additionalEventData.MFAUsed
- userIdentity.arn
- sourceIPAddress
- awsRegion
- responseElements.ConsoleLogin
tags:
- cloudtrail-ir-part1
- scenario-2
- P0
- tp-quality
- console-login
query:
  splunk: '(sourcetype=aws:cloudtrail OR sourcetype=aws:cloudtrail:json OR sourcetype=aws:cloudtrail:event)

    | search eventName="ConsoleLogin" additionalEventData.MFAUsed="No"

    | search responseElements.ConsoleLogin="Success" OR errorCode="success" OR (errorCode="" OR isnull(errorCode))

    | table _time, eventName, userIdentity.arn, userIdentity.type, userIdentity.userName, additionalEventData.MFAUsed,
    responseElements.ConsoleLogin, sourceIPAddress, awsRegion, userAgent, errorCode

    '
