query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("repo.download_zip","git.clone","repo.access")

    | stats count by actor

    | where count>20

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0030
title: 'GitHub: Mass private repository clone or archive download'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-related
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1213/003/
mitre:
  tactics:
  - collection
  techniques:
  - T1213.003
author: Detection Engineer
status: experimental
description: repo.download_zip / git.clone burst private
