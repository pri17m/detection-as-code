query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("integration_installation.create","integration_installation_request.*")

    | search repository_selection="all" OR permissions="*admin*" OR permissions="*write*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0008
title: 'GitHub: GitHub App installed with write/admin on many repos'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1671/
mitre:
  tactics:
  - persistence
  techniques:
  - T1671
author: Detection Engineer
status: experimental
description: integration_installation / repository_selection all
