query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action!=""

    | stats dc(actor_ip) as ips values(action) as actions by actor

    | where ips>3

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0038
title: 'GitHub: Privileged org member activity from new geo or device'
false_positives:
