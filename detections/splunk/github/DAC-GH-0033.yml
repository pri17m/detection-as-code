query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action="git.push"

    | search name IN ("package-lock.json","yarn.lock","pnpm-lock.yaml","Cargo.lock")

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0033
title: 'GitHub: Dependabot or lockfile change adds high-risk dependency'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: medium
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P1
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1195/001/
mitre:
  tactics:
  - persistence
  techniques:
  - T1195.001
author: Detection Engineer
status: experimental
description: push package-lock/yarn with new remote
