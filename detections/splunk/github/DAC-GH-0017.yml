query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("workflows.update","workflows.created","repo.update")

    | search name="*.yml" OR name="*.yaml" OR data.workflow_file="*" OR request.path="*/.github/workflows/*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0017
title: 'GitHub: Workflow file modified on privileged production repo'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
- needs-review
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1677/
mitre:
  tactics:
  - persistence
  techniques:
  - T1677
author: Detection Engineer
status: experimental
description: 'workflows.update .github/workflows on prod NEEDS REVIEW (2026-11-12): the query uses action names that are not in GitHub''s ''Audit log events for your organization'' list (workflows.update, workflows.created, repo.update), so it cannot match real audit-log data. The audit log does not record which files a push changed, so a workflow file change on a production repo cannot be expressed with audit-log data alone; it needs push webhook or repository content data. Query left as-is pending a decision; see reviews/DAC-GH-0017/REVIEW.md.'
