id: DAC-GH-0047
title: 'GitHub: Repository deleted'
description: 'Detects repo.destroy. GitHub documents this action as a repository being deleted. Fields used are the documented audit fields action, actor, actor_id, org, and repo.'
author: Detection Engineer
status: experimental
platforms:
  - splunk
sourcetypes:
  - github:audit
  - github:cloud:audit
mitre:
  tactics:
    - impact
  techniques:
    - T1485
severity: high
false_positives:
  - 'An owner deleting a repository that is no longer used. Rare in a healthy org.'
references:
  - 'https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise'
telemetry_validated: false
required_fields:
  - action
  - actor
  - repo
query:
  splunk: |
    (sourcetype=github:audit OR sourcetype=github:cloud:audit OR sourcetype=httpevent) action=repo.destroy
    | fillnull
    | stats count min(_time) as firstTime max(_time) as lastTime values(user_agent) as user_agent values(actor_is_bot) as actor_is_bot by actor, actor_id, org, repo
