id: DAC-GH-0002
title: "GitHub: SSH key added to account"
description: "Detects SSH key additions which can indicate persistence on a compromised GitHub account."
author: "DaC"
status: experimental
platforms: [splunk, google_secops]
sourcetypes: ["github:audit"]
mitre:
  tactics: ["persistence"]
  techniques: ["T1098"]
severity: medium
false_positives:
  - "Legitimate key rotation or onboarding."
references:
  - "https://docs.github.com/en/authentication/connecting-to-github-with-ssh"
telemetry_validated: false
required_fields: ["action", "actor", "created_at"]
query:
  splunk: |
    sourcetype=github:audit action="user.ssh_key.add"
    | stats count values(actor) as actors values(user) as users by action
  google_secops: |-
    rule dac_gh_0002 {
      meta:
        author = "DaC"
        description = "GitHub: SSH key added to account - Detects SSH key additions which can indicate persistence on a compromised GitHub account."
        severity = "Medium"
        rule_id = "DAC-GH-0002"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1098"

      events:
        $e.metadata.log_type = "GITHUB"
        $e.metadata.product_event_type = "user.ssh_key.add" nocase
        $action = $e.metadata.product_event_type

      match:
        $action over 1h

      outcome:
        $count = count($e.metadata.id)
        $actors = array_distinct($e.principal.user.userid)
        $users = array_distinct($e.principal.user.userid)

      condition:
        $e
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.95
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: github.audit
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
