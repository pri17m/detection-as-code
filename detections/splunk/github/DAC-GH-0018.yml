query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("workflows.update","workflows.created","repo.update")

    | search name="*.yml" OR name="*.yaml" OR data.workflow_file="*" OR request.path="*/.github/workflows/*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0018
title: 'GitHub: Workflow run with elevated permissions after unreviewed edit'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1677/
mitre:
  tactics:
  - execution
  techniques:
  - T1677
author: Detection Engineer
status: experimental
description: workflow_run after workflows.update without PR review
