id: DAC-GH-0006
title: "GitHub: Actions workflow enabled, disabled, or created"
description: "Detects a GitHub Actions workflow being enabled, disabled, or a workflow run being created, plus a git push to the repository. GitHub audit events do not include the changed file path, so this rule does not match .github/workflows. Fields are the ones Splunk security_content uses on github audit events: action, actor, actor_id, actor_is_bot, org, repo, user_agent, operation_type."
author: "DaC"
status: experimental
platforms: [splunk]
sourcetypes: ["github:audit", "github:cloud:audit", "httpevent"]
mitre:
  tactics: ["execution", "persistence"]
  techniques: ["T1195"]
severity: medium
false_positives:
  - "A normal git push. This action does not say the push touched a workflow file."
  - "A scheduled or trusted workflow run."
references:
  - "https://github.com/splunk/security_content/blob/develop/detections/cloud/github_enterprise_register_self_hosted_runner.yml"
  - "https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise"
telemetry_validated: false
required_fields: ["action", "actor", "repo"]
query:
  splunk: |
    (sourcetype=github:audit OR sourcetype=github:cloud:audit OR sourcetype=httpevent) action IN ("workflows.enable_workflow", "workflows.disable_workflow", "workflows.created_workflow_run", "git.push")
    | fillnull
    | stats count min(_time) as firstTime max(_time) as lastTime values(action) as actions values(actor) as actors values(actor_is_bot) as actor_is_bot values(user_agent) as user_agent values(operation_type) as operation_type by org, repo
