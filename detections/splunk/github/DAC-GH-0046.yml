  - T1078.004
author: Detection Engineer
status: experimental
description: 'Behavior: an AWS role is assumed through GitHub Actions OIDC (sts AssumeRoleWithWebIdentity, identity provider token.actions.githubusercontent.com) by a repository that first appears for that role in the last hour of the search window, while the role already has at least one other repo on record. The repo comes from the OIDC sub claim (repo:ORG/REPO:...). The GitHub org audit log has no OIDC token or role-assumption event, so this rule reads CloudTrail. Aikido reports the wfx CI stealer mints GitHub OIDC tokens for AWS audiences and exchanges them for cloud sessions. Schedule hourly over a 30-day window so the baseline exists; the window and the 1-hour cut are unmeasured. Not telemetry_validated. Fixed 2026-11-12: the earlier query searched GitHub audit actions oidc.* that GitHub does not document and did not parse in Splunk.'
