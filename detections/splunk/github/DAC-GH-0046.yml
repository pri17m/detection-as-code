query:
  splunk: |
    sourcetype=aws:cloudtrail eventSource="sts.amazonaws.com" eventName="AssumeRoleWithWebIdentity"
    | where like(coalesce('userIdentity.identityProvider','responseElements.provider',""),"%token.actions.githubusercontent.com%")
    | eventstats max(_time) AS last_event
    | eval sub=coalesce('responseElements.subjectFromWebIdentityToken','userIdentity.userName',"unknown"), role_arn=coalesce('requestParameters.roleArn',"unknown")
    | rex field=sub "^repo:(?<gh_repo>[^:]+):(?<gh_context>.+)$"
    | eval gh_repo=coalesce(gh_repo,"unparsed:".sub), ok=if(isnull(errorCode),1,0)
    | stats min(_time) AS first_seen max(_time) AS last_seen count AS calls sum(ok) AS successes values(gh_context) AS contexts values(errorCode) AS errorCodes values(sourceIPAddress) AS src_ip values(userAgent) AS user_agent max(last_event) AS last_event BY role_arn gh_repo
    | eventstats dc(gh_repo) AS repos_seen_for_role BY role_arn
    | where first_seen>=last_event-3600 AND repos_seen_for_role>=2
    | eval severity=if(successes>0,"high","medium")
    | convert ctime(first_seen) ctime(last_seen) ctime(last_event)
id: DAC-GH-0046
title: 'GitHub: OIDC cloud role assumption from Actions for unexpected repo'
false_positives:
- A new repository legitimately added to a shared deploy role. Expected once per new repo; volume not measured.
- Repos renamed or transferred change the sub claim and look new.
severity: high
sourcetypes:
- aws:cloudtrail
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
- aikido-wfx
- fixed-2026-11-12
telemetry_validated: false
required_fields:
- eventSource
- eventName
- errorCode
- userIdentity.identityProvider
- userIdentity.userName
- responseElements.subjectFromWebIdentityToken
- responseElements.provider
- requestParameters.roleArn
- sourceIPAddress
- userAgent
references:
- https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories
- https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
- https://docs.aws.amazon.com/IAM/latest/UserGuide/cloudtrail-integration.html
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
- https://attack.mitre.org/techniques/T1550/001/
