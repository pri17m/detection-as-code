query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("personal_access_token.create","org.personal_access_token.*")

    | search scopes="*repo*" OR scopes="*admin*" OR scopes="*write*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0009
title: 'GitHub: Personal access token created with admin or repo scope'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1528/
mitre:
  tactics:
  - credential-access
  techniques:
  - T1528
author: Detection Engineer
status: experimental
description: personal_access_token.create privileged scopes
