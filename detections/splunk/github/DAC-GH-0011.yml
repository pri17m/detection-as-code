query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("personal_access_token.create","org.personal_access_token.*")

    | search scopes="*repo*" OR scopes="*admin*" OR scopes="*write*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0011
title: 'GitHub: PAT or App token auth from new IP or UA after create'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-top5
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1550/001/
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1550.001
author: Detection Engineer
status: experimental
description: token use anomaly vs create geo/UA
