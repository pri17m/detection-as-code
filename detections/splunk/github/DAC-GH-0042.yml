query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("hook.create","org.hook.create","repo.hook.create")

    | search url!="*.corp.*" url!="*.internal.*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0042
title: 'GitHub: Webhook created pointing to non-corp destination'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: medium
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P1
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
