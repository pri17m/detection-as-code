query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("repo.add_member","member.invite")

    | search permission IN ("write","admin","maintain") OR visibility="outside"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0024
title: 'GitHub: Outside collaborator invite accepted on critical org repo'
