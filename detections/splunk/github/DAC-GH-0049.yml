id: DAC-GH-0049
title: 'GitHub: Branch protection destroyed'
description: 'Detects protected_branch.destroy. GitHub documents this action as branch protection disabled on a branch. An update is a different action and is not included.'
author: Detection Engineer
status: experimental
platforms:
  - splunk
sourcetypes:
  - github:audit
  - github:cloud:audit
mitre:
  tactics:
    - defense-evasion
  techniques:
    - T1562.001
severity: high
false_positives:
  - 'An admin removing protection from a branch that is being retired.'
references:
  - 'https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise'
telemetry_validated: false
required_fields:
  - action
  - actor
  - repo
query:
  splunk: |
    (sourcetype=github:audit OR sourcetype=github:cloud:audit OR sourcetype=httpevent) action=protected_branch.destroy
    | fillnull
    | stats count min(_time) as firstTime max(_time) as lastTime values(user_agent) as user_agent by actor, actor_id, org, repo
