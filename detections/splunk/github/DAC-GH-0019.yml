query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action="workflows.update"

    | search data.diff="*@v*" OR data.diff="*@main*" OR data.diff="*@master*"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
id: DAC-GH-0019
title: 'GitHub: reusable workflow or action pin changed from SHA to mutable tag'
false_positives:
- Tune after baselining; experimental sketch may be noisy.
severity: high
sourcetypes:
- github:audit
- github:cloud:audit
platforms:
- splunk
tags:
- wave-b
- P0
- phase2-next
telemetry_validated: false
required_fields:
- actor
- action
- org
- repo
- actor_ip
references:
- https://attack.mitre.org/techniques/T1677/
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1677
author: Detection Engineer
status: experimental
description: workflow uses @v* or @main after previously @sha
