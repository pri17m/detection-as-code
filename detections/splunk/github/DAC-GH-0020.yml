query:
  splunk: '(sourcetype=github:audit OR sourcetype=github:cloud:audit)

    | search action IN ("org.update_actions_secret","business.update_default_repository_permission","org.update_default_repository_permission")
    OR action="actions_permissions.policy_updated"

    | table _time, actor, action, org, repo, actor_ip, user_agent

    '
