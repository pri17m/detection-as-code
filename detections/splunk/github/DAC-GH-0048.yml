id: DAC-GH-0048
title: 'GitHub: Repository archived'
description: 'Detects repo.archived. GitHub documents this action as a repository being archived. Gate on a production repository list before paging. Fields used are the documented audit fields.'
author: Detection Engineer
status: experimental
platforms:
  - splunk
sourcetypes:
  - github:audit
  - github:cloud:audit
mitre:
  tactics:
    - impact
  techniques:
    - T1485
severity: medium
false_positives:
  - 'Archiving a finished repository is normal. Archiving a production repository is not.'
references:
  - 'https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise'
telemetry_validated: false
required_fields:
  - action
  - actor
  - repo
query:
  splunk: |
    (sourcetype=github:audit OR sourcetype=github:cloud:audit OR sourcetype=httpevent) action=repo.archived
    | fillnull
    | stats count min(_time) as firstTime max(_time) as lastTime values(user_agent) as user_agent by actor, actor_id, org, repo
