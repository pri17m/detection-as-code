id: DAC-WIN-0002
title: DCSync replication rights abuse
description: Security 4662 replication GUIDs; exclude DC$ accounts
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - Credential Access
  techniques:
  - T1003.006
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- SubjectDomainName
- ObjectName
- ObjectGUID
- ObjectType
- Properties
- AccessMask
telemetry_validated: false
false_positives:
- AAD Connect / sync service accounts
- DC machine accounts
references:
- https://attack.mitre.org/techniques/T1003/006/
- rules/windows/builtin/security/win_security_ad_replication_non_machine_account.yml
tags:
- phase1
- windows
- P0
- ad-auth
query:
  splunk: '`windows_security` EventCode=4662

    | search Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
    OR Properties="*89e95b76-444d-4c62-991a-0bb64e7babf0*"

    | search NOT SubjectUserName="*$"

    | table _time host SubjectUserName SubjectDomainName ObjectName Properties

    '
