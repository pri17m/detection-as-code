id: DAC-WIN-0178
title: WMI process call via powershell
description: 'Behavior: WMI process call via powershell. Anchor after classic/XML coalesce. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - execution
  techniques:
  - T1047
severity: medium
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1047/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\powershell.exe" CommandLine IN ("*Invoke-WmiMethod*","*Get-WmiObject*","*Invoke-CimMethod*","*wmic
    *")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0178 {
      meta:
        author = "Detection Engineer"
        description = "WMI process call via powershell - Behavior: WMI process call via powershell. Anchor after classic/XML coalesce. Not telemetry_validated."
        severity = "Medium"
        rule_id = "DAC-WIN-0178"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1047"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        $e.target.process.file.full_path = /\\powershell\.exe$/ nocase
        ($e.target.process.command_line = /Invoke-WmiMethod/ nocase or $e.target.process.command_line = /Get-WmiObject/ nocase or $e.target.process.command_line = /Invoke-CimMethod/ nocase or $e.target.process.command_line = /wmic / nocase)

      condition:
        $e
    }
tags:
- phase1
- windows
- P2
- process
