id: DAC-WIN-0180
title: Account locked out burst (4740)
description: 'Behavior: Account locked out burst (4740). Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. 4740 many users one caller'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1110/
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- CallerComputerName
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4740 OR EventID=4740)

    | stats count values(Account) AS accounts by Ip host

    | where count>=5

    '
tags:
- phase1
- windows
- P2
- logon
