id: DAC-WIN-0137
title: NTLM credential validation failures spray (4776)
description: 'Behavior: NTLM credential validation failures spray (4776). Anchor after classic/XML coalesce.
  Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TargetUserName
- Workstation
- Status
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1110/003/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0038
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4776 OR EventID=4776)

    | eval Status=coalesce(Status, Error_Code)

    | stats count dc(Account) AS users by Ip host Status

    | where count>=8

    '
