id: DAC-WIN-0162
title: LogonType 3 from new workstation for privileged user
description: 'Behavior: LogonType 3 from new workstation for privileged user. Anchor after classic/XML
  coalesce. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1078.002
  - T1021.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1078/002/
- https://attack.mitre.org/techniques/T1021/002/
tags:
- P1
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0063
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4624 OR EventID=4624) LogonType=3

    | eval Workstation=coalesce(WorkstationName, Workstation_Name)

    | where match(Account, "(?i)admin")

    | stats dc(Workstation) AS hosts values(Workstation) AS srcs by Account

    | where hosts>=3

    '
