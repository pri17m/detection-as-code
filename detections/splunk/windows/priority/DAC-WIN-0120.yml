id: DAC-WIN-0120
title: New service installed with suspicious ImagePath
description: 'Behavior: New service installed with suspicious ImagePath. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. System 7045 ImagePath Temp/Users/UNC'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - persistence
  techniques:
  - T1543.003
  - T1021.002
sourcetypes:
- WinEventLog:System
- XmlWinEventLog:System
required_fields:
- ServiceName
- ImagePath
- ServiceFileName
- StartType
- AccountName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1543/003/
- https://attack.mitre.org/techniques/T1021/002/
tags:
- P0
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0021
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:System OR sourcetype=XmlWinEventLog:System) `windows_system`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Service=coalesce(ServiceName, param1)

    | search EventCode=7045

    | eval ImagePath=coalesce(ImagePath, ServiceFileName)

    | where match(ImagePath, "(?i)\\users\\|\\temp\\|\\appdata\\|powershell|cmd.exe")

    | table _time host Service ImagePath AccountName

    '
