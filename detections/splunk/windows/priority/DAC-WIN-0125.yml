id: DAC-WIN-0125
title: Local user account created
description: 'Behavior: Local user account created. Anchor is process+flag or event id+field after classic/XML
  coalesce. Not telemetry_validated. Security 4720'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: medium
mitre:
  tactics:
  - persistence
  techniques:
  - T1136.001
  - T1098
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TargetUserName
- SubjectUserName
- SubjectDomainName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1136/001/
- https://attack.mitre.org/techniques/T1098/
tags:
- P0
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0026
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4720 OR EventID=4720)

    | table _time host Account SubjectUserName TargetUserName

    '
  google_secops: |-
    rule dac_win_0125 {
      meta:
        author = "Detection Engineer"
        description = "Local user account created - Behavior: Local user account created. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Security 4720"
        severity = "Medium"
        rule_id = "DAC-WIN-0125"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1136.001"
        mitre_attack_technique = "T1098"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4720"

      condition:
        $e
    }
