id: DAC-WIN-0159
title: SMB sweep many destinations from one host
description: 'Behavior: SMB sweep many destinations from one host. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 3 many DestinationIp:445'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - discovery
  techniques:
  - T1018
  - T1021.002
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- Image
- User
- Protocol
- Initiated
- SourceIp
- SourcePort
- DestinationIp
- DestinationPort
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1018/
- https://attack.mitre.org/techniques/T1021/002/
tags:
- P1
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0060
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=5140 ShareName IN ("*ADMIN$*","*C$*","*IPC$*")

    | stats dc(ShareName) AS shares dc(Ip) AS srcs by host Account

    | where shares>=3 OR srcs>=5

    '
