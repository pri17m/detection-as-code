id: DAC-WIN-0169
title: Critical binary masquerading outside System32
description: 'Behavior: Critical binary masquerading outside System32. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 svchost.exe NOT System32'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1036.005
severity: high
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1036/005/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image IN ("*\\svchost.exe","*\\lsass.exe","*\\csrss.exe","*\\services.exe","*\\wininit.exe")

    | where NOT match(Image, "(?i)\\Windows\\System32\\") AND NOT match(Image, "(?i)\\Windows\\SysWOW64\\")

    | table _time host User Image ParentImage CommandLine

    '
tags:
- phase1
- windows
- P2
- defense-evasion
