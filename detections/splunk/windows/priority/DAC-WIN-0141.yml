id: DAC-WIN-0141
title: Suspicious process access for token theft
description: 'Behavior: Suspicious process access for token theft. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 10 unusual Source to high-priv Target'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1134.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- SourceImage
- TargetImage
- GrantedAccess
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1134/001/
tags:
- P1
- category:priv-esc
- phase1
- priv-esc
- remapped_from:DAC-WIN-0042
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=10 OR EventID=10)

    | eval TargetImage=coalesce(TargetImage, TargetFilename)

    | eval GrantedAccess=coalesce(GrantedAccess, AccessMask)

    | search GrantedAccess IN ("0x1010","0x1410","0x143a","0x1fffff")

    | table _time host User Image TargetImage GrantedAccess

    '
