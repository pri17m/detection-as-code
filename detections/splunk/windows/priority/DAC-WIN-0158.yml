id: DAC-WIN-0158
title: Nltest / domain trust discovery
description: 'Behavior: Nltest / domain trust discovery. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. Sysmon 1 nltest /dclist /domain_trusts'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: medium
mitre:
  tactics:
  - discovery
  techniques:
  - T1018
  - T1482
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1018/
- https://attack.mitre.org/techniques/T1482/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0059
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) (Image="*\\nltest.exe" OR CommandLine="*nltest*") CommandLine
    IN ("*/domain_trusts*","*/dclist*","*/dsgetdc*")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0158 {
      meta:
        author = "Detection Engineer"
        description = "Nltest / domain trust discovery - Behavior: Nltest / domain trust discovery. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 nltest /dclist /domain_trusts"
        severity = "Medium"
        rule_id = "DAC-WIN-0158"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1018"
        mitre_attack_technique = "T1482"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.target.process.file.full_path = /\\nltest\.exe$/ nocase or $e.target.process.command_line = /nltest/ nocase)
        ($e.target.process.command_line = /\/domain_trusts/ nocase or $e.target.process.command_line = /\/dclist/ nocase or $e.target.process.command_line = /\/dsgetdc/ nocase)

      condition:
        $e
    }
conversions:
