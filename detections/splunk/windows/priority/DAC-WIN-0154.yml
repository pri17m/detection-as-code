id: DAC-WIN-0154
title: Remote scheduled task creation (schtasks /s)
description: 'Behavior: Remote scheduled task creation (schtasks /s). Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 schtasks /create /s'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1053.005
  - T1021.002
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1053/005/
- https://attack.mitre.org/techniques/T1021/002/
tags:
- P1
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0055
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\schtasks.exe" CommandLine="*/create*" CommandLine="*/s*"

    | table _time host User Image ParentImage CommandLine

    '
