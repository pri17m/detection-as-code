id: DAC-WIN-0150
title: Bitsadmin download
description: 'Behavior: Bitsadmin download. Anchor is process+flag or event id+field after classic/XML
  coalesce. Not telemetry_validated. Sysmon 1 bitsadmin /transfer'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1197
  - T1105
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1197/
- https://attack.mitre.org/techniques/T1105/
tags:
- P1
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0051
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\bitsadmin.exe" CommandLine IN ("*/transfer*","*/addfile*","*/download*")

    | table _time host User Image ParentImage CommandLine

    '
