id: DAC-WIN-0118
title: Explicit credentials (4648) to remote host
description: 'Behavior: Explicit credentials (4648) to remote host. Anchor after classic/XML coalesce.
  Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.002
  - T1550.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- SubjectDomainName
- TargetUserName
- TargetDomainName
- TargetServerName
- ProcessName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1021/002/
- https://attack.mitre.org/techniques/T1550/002/
tags:
- P0
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0019
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4648 OR EventID=4648)

    | eval Target=coalesce(TargetServerName, Target_Server_Name)

    | table _time host Account Target Ip Process

    '
