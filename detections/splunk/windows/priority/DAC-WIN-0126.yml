id: DAC-WIN-0126
title: Scheduled task updated (4702) suspicious content
description: 'Behavior: Scheduled task updated (4702) suspicious content. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Security 4702 TaskContent change'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - persistence
  techniques:
  - T1053.005
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TaskName
- SubjectUserName
- SubjectDomainName
- TaskContent
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1053/005/
tags:
- P0
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0027
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4702 OR EventID=4702)

    | table _time host Account TaskName SubjectUserName

    '
