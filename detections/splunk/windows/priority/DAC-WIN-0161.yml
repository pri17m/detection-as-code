id: DAC-WIN-0161
title: Successful logon after failures same account
description: 'Behavior: Successful logon after failures same account. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. 4625 then 4624 same user+src'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110
  - T1078.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
- Status
- SubStatus
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1110/
- https://attack.mitre.org/techniques/T1078/002/
tags:
- P1
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0062
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode IN (4625,4624) OR EventID IN (4625,4624))

    | stats count(eval((EventCode=4625 OR EventID=4625))) AS fails count(eval((EventCode=4624 OR EventID=4624)))
    AS ok values(Ip) AS src by host Account

    | where fails>=5 AND ok>=1

    | table host Account src fails ok

    '
