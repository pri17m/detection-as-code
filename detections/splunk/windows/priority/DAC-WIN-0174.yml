id: DAC-WIN-0174
title: Suspicious parent-child of system tools
description: 'Behavior: Suspicious parent-child of system tools. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 suspicious ParentImage for cmd/powershell'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - execution
  techniques:
  - T1059
  - T1036
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1036/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) ParentImage IN ("*\\svchost.exe","*\\services.exe","*\\wininit.exe")
    Image IN ("*\\cmd.exe","*\\powershell.exe","*\\wscript.exe","*\\mshta.exe")

    | table _time host User ParentImage Image CommandLine

    '
  google_secops: |-
    rule dac_win_0174 {
      meta:
        author = "Detection Engineer"
        description = "Suspicious parent-child of system tools - Behavior: Suspicious parent-child of system tools. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 suspicious ParentImage for cmd/powershell"
        severity = "Medium"
        rule_id = "DAC-WIN-0174"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1059"
        mitre_attack_technique = "T1036"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.principal.process.file.full_path = /\\svchost\.exe$/ nocase or $e.principal.process.file.full_path = /\\services\.exe$/ nocase or $e.principal.process.file.full_path = /\\wininit\.exe$/ nocase)
        ($e.target.process.file.full_path = /\\cmd\.exe$/ nocase or $e.target.process.file.full_path = /\\powershell\.exe$/ nocase or $e.target.process.file.full_path = /\\wscript\.exe$/ nocase or $e.target.process.file.full_path = /\\mshta\.exe$/ nocase)

      condition:
        $e
    }
tags:
- phase1
- windows
- P2
- process
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: exact
