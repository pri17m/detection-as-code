id: DAC-WIN-0174
title: Suspicious parent-child of system tools
description: 'Behavior: Suspicious parent-child of system tools. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 suspicious ParentImage for cmd/powershell'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - execution
  techniques:
  - T1059
  - T1036
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1036/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search EventCode=1 ParentImage IN ("*\\svchost.exe","*\\services.exe","*\\wininit.exe") Image IN
    ("*\\cmd.exe","*\\powershell.exe","*\\wscript.exe","*\\mshta.exe")

    | table _time host User ParentImage Image CommandLine

    '
tags:
- phase1
- windows
- P2
- process
