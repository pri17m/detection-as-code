id: DAC-WIN-0131
title: RDP LogonType 10 outside jump-host allowlist
description: 'Behavior: RDP LogonType 10 outside jump-host allowlist. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. 4624 LogonType=10'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Helpdesk RDP
- VDI
references:
- https://attack.mitre.org/techniques/T1021/001/
tags:
- P1
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0032
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4624 OR EventID=4624) LogonType=10

    | stats dc(host) AS hosts values(host) AS dests by Account

    | where hosts>=3

    '
