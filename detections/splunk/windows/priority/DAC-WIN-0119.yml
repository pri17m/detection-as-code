id: DAC-WIN-0119
title: Network share Admin$ access
description: 'Behavior: Network share Admin$ access. Anchor is process+flag or event id+field after classic/XML
  coalesce. Not telemetry_validated. Security 5140/5145 ShareName Admin$'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- SubjectDomainName
- ShareName
- RelativeTargetName
- AccessMask
- IpAddress
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1021/002/
tags:
- P0
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0020
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=5140 ShareName IN ("*ADMIN$*","*C$*","*IPC$*")

    | stats dc(ShareName) AS shares dc(Ip) AS srcs by host Account

    | where shares>=3 OR srcs>=5

    '
