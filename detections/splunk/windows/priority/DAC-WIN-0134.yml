id: DAC-WIN-0134
title: WMI permanent event consumer creation attempt
description: 'Behavior: WMI permanent event consumer creation attempt. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1/19/20/21 WMI if enabled'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - persistence
  techniques:
  - T1047
  - T1546.003
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1047/
- https://attack.mitre.org/techniques/T1546/003/
tags:
- P1
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0035
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search EventCode=20 OR (EventCode=1 Image="*\\wmic.exe" CommandLine="*eventconsumer*")

    | table _time host User Image CommandLine EventType

    '
