id: DAC-WIN-0107
title: Suspicious PowerShell (enc/IEX/remote)
description: 'Detects suspicious PowerShell via 4104 ScriptBlock, Sysmon 1, or Security
  4688 (classic+XML) with -enc/-EncodedCommand, IEX, download, or hidden-window patterns.
  Image/NewProcessName are coalesced after the base search so XML 4688 is not dropped.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Security
- XmlWinEventLog:Security
- sysmon
- sysmon:*
required_fields:
- EventCode
- ScriptBlockText
- SubjectUserName
- Image
- NewProcessName
- CommandLine
- ParentImage
- ParentProcessName
- User
telemetry_validated: false
false_positives:
- Admin encoded automation
references:
- https://attack.mitre.org/techniques/T1059/001/
tags:
- P0
- category:process
- hardened-v1
- phase1
- process
- remapped_from:DAC-WIN-0008
- tier:P0
- windows
query:
  splunk: '((`windows_powershell_operational` EventCode=4104) OR (`windows_sysmon` EventCode=1)
    OR (`windows_security` EventCode=4688))

    | eval ScriptBlockText=coalesce(ScriptBlockText, Message)

    | eval CommandLine=coalesce(CommandLine, process_command_line, cmdline)

    | eval Image=coalesce(Image, NewProcessName, process)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName, Creator_Process_Name)

    | eval User=coalesce(User, UserName, SubjectUserName, user)

    | search (EventCode=4104 AND (ScriptBlockText="*IEX*" OR ScriptBlockText="*Invoke-Expression*"
    OR ScriptBlockText="*DownloadString*" OR ScriptBlockText="*FromBase64String*"
    OR ScriptBlockText="*Net.WebClient*")) OR ((EventCode=1 OR EventCode=4688)
    AND (Image="*powershell.exe" OR Image="*pwsh.exe") AND (CommandLine="*-enc*" OR
    CommandLine="*-EncodedCommand*" OR CommandLine="*IEX*" OR CommandLine="*DownloadString*"
    OR CommandLine="*-w hidden*" OR CommandLine="*-WindowStyle Hidden*"))

    | table _time host EventCode Image ParentImage CommandLine User ScriptBlockText Path

    '
