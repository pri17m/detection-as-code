id: DAC-WIN-0189
title: CMSTP / InstallUtil / Regasm LOLBin execution
description: 'Behavior: CMSTP / InstallUtil / Regasm LOLBin execution. Anchor after classic/XML coalesce.
  Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.003
  - T1218.004
severity: medium
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1218/003/
- https://attack.mitre.org/techniques/T1218/004/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image IN ("*\\cmstp.exe","*\\installutil.exe","*\\regasm.exe","*\\regsvcs.exe")

    | table _time host User Image ParentImage CommandLine

    '
tags:
- phase1
- windows
- P2
- defense-evasion
