id: DAC-WIN-0189
title: CMSTP / InstallUtil / Regasm LOLBin execution
description: 'Behavior: CMSTP / InstallUtil / Regasm LOLBin execution. Anchor after classic/XML coalesce.
  Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - stealth
  techniques:
  - T1218.003
  - T1218.004
severity: medium
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1218/003/
- https://attack.mitre.org/techniques/T1218/004/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image IN ("*\\cmstp.exe","*\\installutil.exe","*\\regasm.exe","*\\regsvcs.exe")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0189 {
      meta:
        author = "Detection Engineer"
        description = "CMSTP / InstallUtil / Regasm LOLBin execution - Behavior: CMSTP / InstallUtil / Regasm LOLBin execution. Anchor after classic/XML coalesce. Not telemetry_validated."
        severity = "Medium"
        rule_id = "DAC-WIN-0189"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1218.003"
        mitre_attack_technique = "T1218.004"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.target.process.file.full_path = /\\cmstp\.exe$/ nocase or $e.target.process.file.full_path = /\\installutil\.exe$/ nocase or $e.target.process.file.full_path = /\\regasm\.exe$/ nocase or $e.target.process.file.full_path = /\\regsvcs\.exe$/ nocase)

      condition:
        $e
    }
tags:
- phase1
- windows
- P2
- defense-evasion
