id: DAC-WIN-0109
title: Password spray then success
description: '4625/4771 many users one src then 4624 | checklist: macros only; no index=; EventCode on
  allowlisted channel; coalesce classic/XML aliases; fieldsummary required before telemetry_validated=true;
  FP baseline pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
  - T1078.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- EventCode
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
- Status
- SubStatus
- TicketEncryptionType
telemetry_validated: false
false_positives:
- Scanners
- shared NAT
references:
- https://attack.mitre.org/techniques/T1110/003/
- https://attack.mitre.org/techniques/T1078/002/
tags:
- P0
- category:logon
- hardened-v1
- logon
- phase1
- remapped_from:DAC-WIN-0010
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`
    (EventCode IN (4625,4771,4624) OR EventID IN (4625,4771,4624))

    | eval EventCode=coalesce(EventCode, EventID)

    | eval TargetUserName=coalesce(TargetUserName, Account_Name, user)

    | eval IpAddress=coalesce(IpAddress, Client_Address, src, src_ip, IpAddress)

    | eval WorkstationName=coalesce(WorkstationName, Workstation_Name)

    | eval src=coalesce(IpAddress, WorkstationName)

    | bin _time span=15m

    | stats dc(TargetUserName) AS users values(EventCode) AS codes count(eval((EventCode=4625 OR EventID=4625)
    OR (EventCode=4771 OR EventID=4771))) AS fails count(eval((EventCode=4624 OR EventID=4624))) AS oks
    by _time src host

    | where users > 15 AND fails > 20

    '
