id: DAC-WIN-0153
title: Disable Windows Defender via process
description: 'Behavior: Disable Windows Defender via process. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Set-MpPreference disable patterns'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: high
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1562/001/
- https://attack.mitre.org/resources/updates/updates-april-2026/
tags:
- P1
- category:defense-evasion
- defense-evasion
- phase1
- remapped_from:DAC-WIN-0054
- tier:P1
- windows
- attack-v19-remap
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image IN ("*\\sc.exe","*\\net.exe","*\\powershell.exe") CommandLine
    IN ("*WinDefend*","*Sense*","*Set-MpPreference*","*DisableRealtimeMonitoring*")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0153 {
      meta:
        author = "Detection Engineer"
        description = "Disable Windows Defender via process - Behavior: Disable Windows Defender via process. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Set-MpPreference disable patterns"
        severity = "High"
        rule_id = "DAC-WIN-0153"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1685"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.target.process.file.full_path = /\\sc\.exe$/ nocase or $e.target.process.file.full_path = /\\net\.exe$/ nocase or $e.target.process.file.full_path = /\\powershell\.exe$/ nocase)
        ($e.target.process.command_line = /WinDefend/ nocase or $e.target.process.command_line = /Sense/ nocase or $e.target.process.command_line = /Set-MpPreference/ nocase or $e.target.process.command_line = /DisableRealtimeMonitoring/ nocase)

      condition:
        $e
    }
conversions:
