id: DAC-WIN-0177
title: PowerShell classic engine suspicious start
description: 'Behavior: PowerShell classic engine suspicious start. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Classic PS start with -enc'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
severity: low
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/001/
telemetry_validated: false
required_fields:
- EventCode
query:
  splunk: '(sourcetype="WinEventLog:Windows PowerShell" OR sourcetype="XmlWinEventLog:Windows PowerShell")
    `windows_powershell_classic`

    | eval EventCode=coalesce(EventCode, EventID)

    | search EventCode=400

    | table _time host User Message

    '
tags:
- phase1
- windows
- P2
- process
