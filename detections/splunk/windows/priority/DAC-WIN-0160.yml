id: DAC-WIN-0160
title: Over-pass-the-hash indicators
description: 'Behavior: Over-pass-the-hash indicators. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. 4648 + 4768 overpass patterns'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1550.002
  - T1550.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- SubjectDomainName
- TargetUserName
- TargetDomainName
- TargetServerName
- ProcessName
- IpAddress
- TicketEncryptionType
- Status
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1550/002/
- https://attack.mitre.org/techniques/T1550/003/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0061
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4624 OR EventID=4624) LogonType=3

    | eval KeyLength=coalesce(KeyLength, Key_Length)

    | eval Auth=coalesce(AuthenticationPackageName, Authentication_Package)

    | search Auth="NTLM" KeyLength=0

    | table _time host Account Ip Auth KeyLength WorkstationName

    '
