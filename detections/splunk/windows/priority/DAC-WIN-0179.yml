id: DAC-WIN-0179
title: PsExec-like named service PSEXESVC
description: 'Behavior: PsExec-like named service PSEXESVC. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. 7045 ServiceName PSEXESVC'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:System
- XmlWinEventLog:System
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.002
  - T1569.002
severity: high
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1021/002/
- https://attack.mitre.org/techniques/T1569/002/
telemetry_validated: false
required_fields:
- EventCode
- ServiceName
- ImagePath
- ServiceFileName
- StartType
- AccountName
query:
  splunk: '(sourcetype=WinEventLog:System OR sourcetype=XmlWinEventLog:System) `windows_system`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Service=coalesce(ServiceName, param1)

    | search (EventCode=7045 OR EventID=7045) Service IN ("*PSEXESVC*","*PaExec*")

    | table _time host Service ImagePath AccountName

    '
tags:
- phase1
- windows
- P2
- persistence
