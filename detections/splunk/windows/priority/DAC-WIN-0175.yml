id: DAC-WIN-0175
title: Process tampering indicators (Sysmon 25 if present)
description: 'Behavior: Process tampering indicators (Sysmon 25 if present). Anchor is process+flag or
  event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 25 ProcessTampering'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - stealth
  techniques:
  - T1055.012
severity: high
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1055/012/
telemetry_validated: false
required_fields:
- EventCode
- Image
- Type
- User
- ProcessGuid
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=25 OR EventID=25)

    | table _time host User Image ProcessTamperingType

    '
  google_secops: |-
    rule dac_win_0175 {
      meta:
        author = "Detection Engineer"
        description = "Process tampering indicators (Sysmon 25 if present) - Behavior: Process tampering indicators (Sysmon 25 if present). Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 25 ProcessTampering"
        severity = "High"
        rule_id = "DAC-WIN-0175"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1055.012"

      events:
        $e.metadata.log_type = "WINDOWS_SYSMON"
        $e.metadata.product_event_type = "25"

      condition:
        $e
    }
tags:
- phase1
- windows
- P2
- defense-evasion
