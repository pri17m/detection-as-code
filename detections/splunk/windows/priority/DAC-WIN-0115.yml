id: DAC-WIN-0115
title: LSASS access via comsvcs MiniDump pattern
description: 'Behavior: LSASS access via comsvcs MiniDump pattern. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 rundll32/comsvcs MiniDump OR Sysmon 10'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
- SourceImage
- TargetImage
- GrantedAccess
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1003/001/
tags:
- P0
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0016
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) (Image="*\\rundll32.exe" OR CommandLine="*comsvcs*") CommandLine="*MiniDump*"

    | table _time host User Image ParentImage CommandLine

    '
