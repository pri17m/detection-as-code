id: DAC-WIN-0121
title: PowerShell encoded command line (Sysmon)
description: 'Behavior: PowerShell encoded command line (Sysmon). Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 powershell -EncodedCommand/-enc'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: medium
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/001/
tags:
- P0
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0022
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\powershell.exe" CommandLine IN ("*-enc*","*-encodedcommand*")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0121 {
      meta:
        author = "Detection Engineer"
        description = "PowerShell encoded command line (Sysmon) - Behavior: PowerShell encoded command line (Sysmon). Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 powershell -EncodedCommand/-enc"
        severity = "Medium"
        rule_id = "DAC-WIN-0121"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1059.001"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        $e.target.process.file.full_path = /\\powershell\.exe$/ nocase
        ($e.target.process.command_line = /-enc/ nocase or $e.target.process.command_line = /-encodedcommand/ nocase)

      condition:
        $e
    }
