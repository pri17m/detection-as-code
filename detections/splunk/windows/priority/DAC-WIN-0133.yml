id: DAC-WIN-0133
title: WinRM host process spawning script interpreter
description: 'Behavior: WinRM host process spawning script interpreter. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Parent wsmprovhost to powershell/cmd'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: high
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.006
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1021/006/
tags:
- P1
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0034
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) ParentImage IN ("*\\wsmprovhost.exe","*\\winrshost.exe") Image
    IN ("*\\cmd.exe","*\\powershell.exe","*\\whoami.exe")

    | table _time host User ParentImage Image CommandLine

    '
  google_secops: |-
    rule dac_win_0133 {
      meta:
        author = "Detection Engineer"
        description = "WinRM host process spawning script interpreter - Behavior: WinRM host process spawning script interpreter. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Parent wsmprovhost to powershell/cmd"
        severity = "High"
        rule_id = "DAC-WIN-0133"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1021.006"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.principal.process.file.full_path = /\\wsmprovhost\.exe$/ nocase or $e.principal.process.file.full_path = /\\winrshost\.exe$/ nocase)
        ($e.target.process.file.full_path = /\\cmd\.exe$/ nocase or $e.target.process.file.full_path = /\\powershell\.exe$/ nocase or $e.target.process.file.full_path = /\\whoami\.exe$/ nocase)

      condition:
        $e
    }
conversions:
