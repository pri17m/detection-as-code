id: DAC-WIN-0129
title: Possible Golden Ticket (unusual TGT)
description: 'Behavior: Possible Golden Ticket (unusual TGT). Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. 4768 encryption/lifetime anomalies'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1558.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TargetUserName
- IpAddress
- TicketEncryptionType
- Status
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1558/001/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0030
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4769 OR EventID=4769)

    | eval Enc=coalesce(TicketEncryptionType, Ticket_Encryption_Type)

    | eval Service=coalesce(ServiceName, Service_Name)

    | where Enc="0x17" OR Service="krbtgt"

    | table _time host Account Service Enc Ip

    '
