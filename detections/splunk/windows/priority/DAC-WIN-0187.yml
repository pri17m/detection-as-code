id: DAC-WIN-0187
title: Clear PowerShell history via process
description: 'Behavior: Clear PowerShell history via process. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Remove-Item PSReadLine history'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - stealth
  techniques:
  - T1070.003
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1070/003/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) CommandLine IN ("*ConsoleHost_history*","*Clear-History*","*Remove-Item*history*")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0187 {
      meta:
        author = "Detection Engineer"
        description = "Clear PowerShell history via process - Behavior: Clear PowerShell history via process. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 Remove-Item PSReadLine history"
        severity = "Medium"
        rule_id = "DAC-WIN-0187"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1070.003"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.target.process.command_line = /ConsoleHost_history/ nocase or $e.target.process.command_line = /Clear-History/ nocase or $e.target.process.command_line = /^.*Remove-Item.*history.*$/ nocase)

      condition:
        $e
    }
tags:
- phase1
- windows
- P2
- defense-evasion
conversions:
