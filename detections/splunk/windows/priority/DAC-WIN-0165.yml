id: DAC-WIN-0165
title: User account enabled after create
description: 'Behavior: User account enabled after create. Anchor after classic/XML coalesce. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1098
severity: medium
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1098/
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
- SubjectDomainName
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode IN (4720,4722) OR EventID IN (4720,4722))

    | stats values(EventCode) AS codes by host Account

    | where mvcount(codes)>=2

    '
tags:
- phase1
- windows
- P2
- ad-auth
