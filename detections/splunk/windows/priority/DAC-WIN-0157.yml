id: DAC-WIN-0157
title: Net.exe domain group enumeration
description: 'Behavior: Net.exe domain group enumeration. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. Sysmon 1 net group/user /domain'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: low
mitre:
  tactics:
  - discovery
  techniques:
  - T1087.002
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1087/002/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0058
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image IN ("*\\net.exe","*\\net1.exe") CommandLine IN ("*group*","*/domain*","*user
    /domain*")

    | table _time host User Image ParentImage CommandLine

    '
  google_secops: |-
    rule dac_win_0157 {
      meta:
        author = "Detection Engineer"
        description = "Net.exe domain group enumeration - Behavior: Net.exe domain group enumeration. Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 1 net group/user /domain"
        severity = "Low"
        rule_id = "DAC-WIN-0157"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1087.002"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.target.process.file.full_path = /\\net\.exe$/ nocase or $e.target.process.file.full_path = /\\net1\.exe$/ nocase)
        ($e.target.process.command_line = /group/ nocase or $e.target.process.command_line = /\/domain/ nocase or $e.target.process.command_line = /user \/domain/ nocase)

      condition:
        $e
    }
