id: DAC-WIN-0127
title: Startup folder file create
description: 'Behavior: Startup folder file create. Anchor is process+flag or event id+field after classic/XML
  coalesce. Not telemetry_validated. Sysmon 11 Startup folder'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - persistence
  techniques:
  - T1547.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- TargetFilename
- User
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1547/001/
tags:
- P0
- category:persistence
- persistence
- phase1
- remapped_from:DAC-WIN-0028
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=11 OR EventID=11)

    | eval TargetFilename=coalesce(TargetFilename, Image)

    | search TargetFilename="*\\Start Menu\\Programs\\Startup\\*"

    | table _time host User Image TargetFilename

    '
