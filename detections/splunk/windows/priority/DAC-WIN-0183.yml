id: DAC-WIN-0183
title: Scheduled task deleted suspiciously (4699)
description: 'Behavior: Scheduled task deleted suspiciously (4699). Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Security 4699'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1053.005
  - T1070
severity: low
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1053/005/
- https://attack.mitre.org/techniques/T1070/
telemetry_validated: false
required_fields:
- EventCode
- TaskName
- SubjectUserName
- SubjectDomainName
- TaskContent
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=4699

    | table _time host Account TaskName SubjectUserName

    '
tags:
- phase1
- windows
- P2
- persistence
