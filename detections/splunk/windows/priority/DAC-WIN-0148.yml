id: DAC-WIN-0148
title: Mshta executing remote or script content
description: 'Behavior: Mshta executing remote or script content. Anchor after classic/XML coalesce. Not
  telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.005
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1218/005/
tags:
- P1
- category:defense-evasion
- defense-evasion
- phase1
- remapped_from:DAC-WIN-0049
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\mshta.exe"

    | where match(CommandLine, "(?i)http|javascript:|vbscript:|\\users\\|\\temp\\")

    | table _time host User Image ParentImage CommandLine

    '
