id: DAC-WIN-0341
title: MMC launched against MSC file in a user-writable path
description: 'Behavior: mmc.exe opening an MSC from a user-writable path (T1218.014). Anchor is Image+CommandLine
  path. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.014
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
required_fields:
- EventCode
- Image
- CommandLine
telemetry_validated: false
false_positives:
- Administrators opening MSC consoles from a profile
references:
- https://attack.mitre.org/techniques/T1218/014/
tags:
- windows
- gap-fill
- lolbin
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) Image="*\\mmc.exe" CommandLine="*.msc"

    | where match(CommandLine, "(?i)\\users\\|\\temp\\|\\appdata\\|\\programdata\\")

    | table _time host User Image ParentImage CommandLine

    '
