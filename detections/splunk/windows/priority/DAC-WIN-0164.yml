id: DAC-WIN-0164
title: Service installed via sc.exe create
description: 'Behavior: Service installed via sc.exe create. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. Sysmon 1 sc.exe create'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:System
- XmlWinEventLog:System
mitre:
  tactics:
  - persistence
  techniques:
  - T1543.003
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1543/003/
telemetry_validated: false
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype=WinEventLog:System OR sourcetype=XmlWinEventLog:System) `windows_system`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Service=coalesce(ServiceName, param1)

    | search EventCode=7045

    | eval ImagePath=coalesce(ImagePath, ServiceFileName)

    | where match(ImagePath, "(?i)\\users\\|\\temp\\|\\appdata\\|powershell|cmd.exe")

    | table _time host Service ImagePath AccountName

    '
tags:
- phase1
- windows
- P2
- persistence
