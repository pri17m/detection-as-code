id: DAC-WIN-0138
title: GPO modification by non-change-control account
description: 'Behavior: GPO modification by non-change-control account. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. 5136/5137 GPO Directory Service Changes'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1484.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- SubjectDomainName
- ObjectDN
- ObjectGUID
- ObjectClass
- AttributeLDAPDisplayName
- AttributeValue
- OperationType
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1484/001/
tags:
- P1
- ad-auth
- category:ad-auth
- phase1
- remapped_from:DAC-WIN-0039
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode IN (5136,5137) OR EventID IN (5136,5137))

    | search ObjectClass="groupPolicyContainer" OR ObjectDN="*CN=Policies,CN=System*"

    | table _time host Account ObjectDN AttributeLDAPDisplayName

    '
