id: DAC-WIN-0190
title: Suspicious driver load (Sysmon 6)
description: 'Behavior: Suspicious driver load (Sysmon 6). Anchor after classic/XML coalesce. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
mitre:
  tactics:
  - persistence
  techniques:
  - T1547.006
  - T1068
severity: high
false_positives:
- Admin tooling and change windows
- Security agents loading signed drivers or modules
references:
- https://attack.mitre.org/techniques/T1547/006/
- https://attack.mitre.org/techniques/T1068/
telemetry_validated: false
required_fields:
- EventCode
- ImageLoaded
- Hashes
- Signed
- Signature
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=6 OR EventID=6)

    | eval ImageLoaded=coalesce(ImageLoaded, Image)

    | eval Signed=coalesce(Signed, SignatureStatus)

    | where Signed="false" OR match(ImageLoaded, "(?i)\\users\\|\\temp\\|\\appdata\\")

    | table _time host ImageLoaded Signed Signature Hashes

    '
tags:
- phase1
- windows
- P2
- persistence
