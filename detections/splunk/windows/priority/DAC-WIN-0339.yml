id: DAC-WIN-0339
title: Indirect command execution via forfiles or pcalua
description: 'Behavior: forfiles /c or pcalua.exe -a launches a child command, a common indirect execution
  path (T1202). Anchor is Image+CommandLine after classic/XML coalesce. Not telemetry_validated.'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1202
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
telemetry_validated: false
false_positives:
- Admin scripts that use forfiles for log rotation
references:
- https://attack.mitre.org/techniques/T1202/
tags:
- windows
- gap-fill
- phase1
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search EventCode=1 Image IN ("*\\forfiles.exe","*\\pcalua.exe")

    | where match(CommandLine, "(?i)/c | -a |cmd.exe|powershell")

    | table _time host User Image ParentImage CommandLine

    '
