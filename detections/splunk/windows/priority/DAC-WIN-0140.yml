id: DAC-WIN-0140
title: Token impersonation / NewCredentials LogonType 9
description: 'Behavior: Token impersonation / NewCredentials LogonType 9. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. 4624 LogonType=9'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1134.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1134/001/
tags:
- P1
- category:priv-esc
- phase1
- priv-esc
- remapped_from:DAC-WIN-0041
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4624 OR EventID=4624) LogonType=9

    | table _time host Account Ip Process WorkstationName

    '
