id: DAC-WIN-0113
title: WmiPrvSE / wsmprovhost unusual children
description: 'Sysmon 1 Parent WmiPrvSE/wsmprovhost to cmd/powershell/LOLBins | checklist: macros only;
  no index=; EventCode on allowlisted channel; coalesce classic/XML aliases; fieldsummary required before
  telemetry_validated=true; FP baseline pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1047
  - T1021.006
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- SCCM/remote management
references:
- https://attack.mitre.org/techniques/T1047/
- https://attack.mitre.org/techniques/T1021/006/
tags:
- P0
- category:process
- hardened-v1
- phase1
- process
- remapped_from:DAC-WIN-0014
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon` (EventCode=1 OR EventID=1)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName, parent_process)

    | eval Image=coalesce(Image, NewProcessName, process)

    | eval CommandLine=coalesce(CommandLine, process_command_line, cmdline)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search ParentImage="*\\WmiPrvSE.exe" OR ParentImage="*\\wsmprovhost.exe" OR ParentImage="*\\winrshost.exe"

    | search Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\certutil.exe"
    OR Image="*\\mshta.exe" OR Image="*\\rundll32.exe" OR Image="*\\bitsadmin.exe"

    | table _time host ParentImage Image CommandLine User

    '
  google_secops: |-
    rule dac_win_0113 {
      meta:
        author = "Detection Engineer"
        description = "WmiPrvSE / wsmprovhost unusual children - Sysmon 1 Parent WmiPrvSE/wsmprovhost to cmd/powershell/LOLBins"
        severity = "High"
        rule_id = "DAC-WIN-0113"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1047"
        mitre_attack_technique = "T1021.006"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.log_type = "WINDOWS_SYSMON"
        ($e.principal.process.file.full_path = /\\WmiPrvSE\.exe$/ nocase or $e.principal.process.command_line = /\\WmiPrvSE\.exe$/ nocase or $e.principal.process.file.full_path = /\\wsmprovhost\.exe$/ nocase or $e.principal.process.command_line = /\\wsmprovhost\.exe$/ nocase or $e.principal.process.file.full_path = /\\winrshost\.exe$/ nocase or $e.principal.process.command_line = /\\winrshost\.exe$/ nocase)
        ($e.target.process.file.full_path = /\\cmd\.exe$/ nocase or $e.target.process.command_line = /\\cmd\.exe$/ nocase or $e.target.process.file.full_path = /\\powershell\.exe$/ nocase or $e.target.process.command_line = /\\powershell\.exe$/ nocase or $e.target.process.file.full_path = /\\pwsh\.exe$/ nocase or $e.target.process.command_line = /\\pwsh\.exe$/ nocase or $e.target.process.file.full_path = /\\certutil\.exe$/ nocase or $e.target.process.command_line = /\\certutil\.exe$/ nocase or $e.target.process.file.full_path = /\\mshta\.exe$/ nocase or $e.target.process.command_line = /\\mshta\.exe$/ nocase or $e.target.process.file.full_path = /\\rundll32\.exe$/ nocase or $e.target.process.command_line = /\\rundll32\.exe$/ nocase or $e.target.process.file.full_path = /\\bitsadmin\.exe$/ nocase or $e.target.process.command_line = /\\bitsadmin\.exe$/ nocase)

      condition:
        $e
    }
