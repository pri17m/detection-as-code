id: DAC-WIN-0135
title: Password spray distinct users single source (4625)
description: 'Behavior: Password spray distinct users single source (4625). Anchor is process+flag or
  event id+field after classic/XML coalesce. Not telemetry_validated. 4625 dc(TargetUserName) by IpAddress'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: high
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
- Status
- SubStatus
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1110/003/
tags:
- P1
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0036
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4625 OR EventID=4625)

    | stats dc(Account) AS users count by Ip host

    | where users>=8

    '
  google_secops: |-
    rule dac_win_0135 {
      meta:
        author = "Detection Engineer"
        description = "Password spray distinct users single source (4625) - Behavior: Password spray distinct users single source (4625). Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. 4625 dc(TargetUserName) by IpAddress"
        severity = "High"
        rule_id = "DAC-WIN-0135"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1110.003"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4625"
        $ip = $e.principal.ip
        $name = $e.principal.hostname

      match:
        $ip, $name over 1h

      outcome:
        $users = count_distinct($e.target.user.userid)
        $count = count($e.metadata.id)

      condition:
        $e and $users >= 8
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.9
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: win.security
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - group-by `Ip` is a coalesce of ['IpAddress', 'Source_Network_Address', 'WorkstationName']; first field used per target.
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
