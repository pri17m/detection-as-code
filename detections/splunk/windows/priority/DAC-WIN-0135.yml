id: DAC-WIN-0135
title: Password spray distinct users single source (4625)
description: 'Behavior: Password spray distinct users single source (4625). Anchor is process+flag or
  event id+field after classic/XML coalesce. Not telemetry_validated. 4625 dc(TargetUserName) by IpAddress'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
- Status
- SubStatus
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1110/003/
tags:
- P1
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0036
- tier:P1
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=4625

    | stats dc(Account) AS users count by Ip host

    | where users>=8

    '
