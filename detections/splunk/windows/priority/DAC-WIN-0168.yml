id: DAC-WIN-0168
title: UAC flag change disabling Kerberos preauth
description: 'Behavior: UAC flag change disabling Kerberos preauth. Anchor is process+flag or event id+field
  after classic/XML coalesce. Not telemetry_validated. 4738/5136 userAccountControl preauth bit'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1558.004
  - T1098
severity: high
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1558/004/
- https://attack.mitre.org/techniques/T1098/
telemetry_validated: false
required_fields:
- EventCode
- SubjectUserName
- SubjectDomainName
- TargetUserName
- TargetDomainName
- ObjectDN
- ObjectGUID
- ObjectClass
- AttributeLDAPDisplayName
- AttributeValue
- OperationType
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4738 OR EventID=4738)

    | search UserAccountControl="*DONT_REQUIRE_PREAUTH*" OR OldUacValue!=""

    | table _time host Account SubjectUserName UserAccountControl

    '
tags:
- phase1
- windows
- P2
- ad-auth
