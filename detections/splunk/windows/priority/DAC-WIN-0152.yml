id: DAC-WIN-0152
title: AMSI related registry tampering
description: 'Behavior: AMSI related registry tampering. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. Sysmon 13 AMSI keys OR Sysmon 1'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- TargetObject
- Details
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1562/001/
- https://attack.mitre.org/resources/updates/updates-april-2026/
tags:
- P1
- category:defense-evasion
- defense-evasion
- phase1
- remapped_from:DAC-WIN-0053
- tier:P1
- windows
- attack-v19-remap
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search EventCode=13

    | eval TargetObject=coalesce(TargetObject, Image)

    | search TargetObject="*Amsi*"

    | table _time host User Image TargetObject Details

    '
