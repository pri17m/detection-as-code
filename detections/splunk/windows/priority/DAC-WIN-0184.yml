id: DAC-WIN-0184
title: Privileged group member removed unexpectedly
description: 'Behavior: Privileged group member removed unexpectedly. Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. 4729/4733/4757'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1098
severity: medium
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1098/
telemetry_validated: false
required_fields:
- EventCode
- MemberName
- MemberSid
- TargetUserName
- SubjectUserName
- SubjectDomainName
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode IN (4729,4733,4757)

    | eval Group=coalesce(TargetUserName, Group_Name)

    | search Group IN ("Domain Admins","Enterprise Admins","Administrators")

    | table _time host Account Group SubjectUserName

    '
tags:
- phase1
- windows
- P2
- ad-auth
