id: DAC-WIN-0102
title: Kerberoasting RC4 TGS burst
description: 'Security 4769 TicketEncryptionType=0x17; burst distinct ServiceName
  | checklist: macros only; no index=; EventCode on allowlisted channel; coalesce
  classic/XML aliases; fieldsummary required before telemetry_validated=true; FP baseline
  pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - credential-access
  techniques:
  - T1558.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- EventCode
- TargetUserName
- ServiceName
- IpAddress
- TicketEncryptionType
- Status
telemetry_validated: false
false_positives:
- Legacy RC4 apps
- batch SPN jobs
references:
- https://attack.mitre.org/techniques/T1558/003/
- rules/windows/builtin/security/win_security_kerberoasting_activity.yml
tags:
- P0
- ad-auth
- category:ad-auth
- hardened-v1
- phase1
- remapped_from:DAC-WIN-0003
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security)
    `windows_security` EventCode=4769

    | eval TargetUserName=coalesce(TargetUserName, Account_Name, user)

    | eval ServiceName=coalesce(ServiceName, Service_Name, Ticket_Service_Name)

    | eval IpAddress=coalesce(IpAddress, Client_Address, src, src_ip)

    | eval TicketEncryptionType=coalesce(TicketEncryptionType, Ticket_Encryption_Type)

    | search TicketEncryptionType=0x17 OR TicketEncryptionType=23 OR TicketEncryptionType="0x17"

    | search NOT TargetUserName="*$" NOT ServiceName="krbtgt*"

    | bin _time span=15m

    | stats dc(ServiceName) AS spn_count values(ServiceName) AS spns by _time TargetUserName
    IpAddress host

    | where spn_count > 10

    '
