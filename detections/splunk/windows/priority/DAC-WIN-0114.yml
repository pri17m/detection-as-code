id: DAC-WIN-0114
title: Security tooling / Sysmon / audit tamper
description: '1102; 4719; Sysmon 4/16/255 | checklist: macros only; no index=; EventCode
  on allowlisted channel; coalesce classic/XML aliases; fieldsummary required before
  telemetry_validated=true; FP baseline pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
- WinEventLog:System
- XmlWinEventLog:System
required_fields:
- EventCode
- SubjectUserName
- SubjectDomainName
- CategoryId
- SubcategoryGuid
- AuditPolicyChanges
- State
- Version
- SchemaVersion
- Configuration
- ConfigurationFileHash
telemetry_validated: false
false_positives:
- Sysmon upgrades
- authorized audit changes
references:
- https://attack.mitre.org/techniques/T1562/001/
- rules/windows/builtin/security/win_security_audit_log_cleared.yml
tags:
- P0
- category:defense-evasion
- defense-evasion
- hardened-v1
- phase1
- remapped_from:DAC-WIN-0015
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security
    OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational)
    (`windows_security` EventCode IN (1102,4719)) OR (`windows_sysmon` EventCode IN
    (4,16,255)) OR (`windows_system` EventCode IN (7036,7040))

    | eval SubjectUserName=coalesce(SubjectUserName, Account_Name, user)

    | eval Image=coalesce(Image, process)

    | eval State=coalesce(State, ServiceState)

    | table _time host EventCode SubjectUserName Image State Configuration CategoryId
    SubcategoryGuid AuditPolicyChanges

    '
