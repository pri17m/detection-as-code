id: DAC-WIN-0110
title: Scheduled task created with LOLBin/SYSTEM
description: '4698 TaskContent LOLBin/SYSTEM; Sysmon 1 schtasks /create | checklist: macros only; no index=;
  EventCode on allowlisted channel; coalesce classic/XML aliases; fieldsummary required before telemetry_validated=true;
  FP baseline pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - Persistence
  techniques:
  - T1053.005
severity: high
false_positives:
- Updaters
- GPO tasks
references:
- https://attack.mitre.org/techniques/T1053/005/
telemetry_validated: false
required_fields:
- EventCode
- TaskName
- SubjectUserName
- SubjectDomainName
- TaskContent
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
query:
  splunk: '(sourcetype="WinEventLog:Security" OR sourcetype="XmlWinEventLog:Security" OR sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational")

    (`windows_security` EventCode=4698) OR (`windows_sysmon` EventCode=1 Image="*\\schtasks.exe" CommandLine="*/create*")

    | eval TaskName=coalesce(TaskName, Task_Name)

    | eval TaskContent=coalesce(TaskContent, Task_Content, Message)

    | eval SubjectUserName=coalesce(SubjectUserName, Account_Name, user)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, process_command_line, cmdline)

    | search EventCode=4698 (TaskContent="*powershell*" OR TaskContent="*-enc*" OR TaskContent="*cmd.exe*"
    OR TaskContent="*mshta*" OR TaskContent="*http*" OR TaskContent="*SYSTEM*") OR EventCode=1

    | table _time host EventCode TaskName TaskContent Image CommandLine SubjectUserName User'
tags:
- phase1
- windows
- P0
- persistence
- hardened-v1
- remapped_from:DAC-WIN-0011
