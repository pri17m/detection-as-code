id: DAC-WIN-0128
title: NTLM logon after recent LSASS access (correlated)
description: 'Behavior: NTLM logon after recent LSASS access (correlated). Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Sysmon 10 lsass then 4624 Type3 NTLM'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1003.001
  - T1550.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
- SourceImage
- TargetImage
- GrantedAccess
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1003/001/
- https://attack.mitre.org/techniques/T1550/002/
tags:
- P0
- category:logon
- logon
- phase1
- remapped_from:DAC-WIN-0029
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4624 OR EventID=4624) LogonType=3

    | eval Auth=coalesce(AuthenticationPackageName, Authentication_Package)

    | search Auth="NTLM"

    | table _time host Account Ip Auth WorkstationName

    '
