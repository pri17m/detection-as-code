id: DAC-WIN-0193
title: Security 4688 suspicious parent if cmdline audited
description: 'Behavior: Security 4688 suspicious parent if cmdline audited. Anchor is process+flag or
  event id+field after classic/XML coalesce. Not telemetry_validated. 4688 prefer Sysmon 1 if no cmdline'
author: Detection Engineer
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - execution
  techniques:
  - T1059
severity: low
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/
telemetry_validated: false
required_fields:
- EventCode
- NewProcessName
- ParentProcessName
- CreatorProcessName
- SubjectUserName
- CommandLine
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=4688

    | where match(Cmd, "(?i)encodedcommand|downloadstring|invoke-expression|frombase64") OR match(Process,
    "(?i)\\(certutil|mshta|regsvr32|rundll32)\\")

    | table _time host Account Process Cmd ParentProcessName

    '
tags:
- phase1
- windows
- P2
- process
