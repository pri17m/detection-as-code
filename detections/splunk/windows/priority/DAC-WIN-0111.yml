id: DAC-WIN-0111
title: Registry Run key persistence (user-writable path)
description: 'Sysmon 13 Run/RunOnce; Details Temp/Users | checklist: macros only; no index=; EventCode
  on allowlisted channel; coalesce classic/XML aliases; fieldsummary required before telemetry_validated=true;
  FP baseline pending org allowlists'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: medium
mitre:
  tactics:
  - persistence
  techniques:
  - T1547.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- EventCode
- Image
- TargetObject
- Details
telemetry_validated: false
false_positives:
- Installer RunOnce
references:
- https://attack.mitre.org/techniques/T1547/001/
tags:
- P0
- category:persistence
- hardened-v1
- persistence
- phase1
- remapped_from:DAC-WIN-0012
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon` (EventCode=13 OR EventID=13)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, process)

    | eval TargetObject=coalesce(TargetObject, Target_Object)

    | eval Details=coalesce(Details, NewValue, details)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search TargetObject="*\\CurrentVersion\\Run*" OR TargetObject="*\\CurrentVersion\\RunOnce*" OR TargetObject="*\\Winlogon\\Shell*"
    OR TargetObject="*\\Winlogon\\Userinit*"

    | search Details="*\\Temp\\*" OR Details="*\\Users\\*" OR Details="*\\AppData\\*" OR Details="*\\Downloads\\*"
    OR Details="*\\Public\\*"

    | table _time host Image TargetObject Details User

    '
  google_secops: |-
    rule dac_win_0111 {
      meta:
        author = "Detection Engineer"
        description = "Registry Run key persistence (user-writable path) - Sysmon 13 Run/RunOnce; Details Temp/Users"
        severity = "Medium"
        rule_id = "DAC-WIN-0111"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1547.001"

      events:
        ($e.metadata.event_type = "REGISTRY_MODIFICATION" or $e.metadata.event_type = "REGISTRY_CREATION")
        $e.metadata.log_type = "WINDOWS_SYSMON"
        $e.metadata.product_event_type = "13"
        ($e.target.registry.registry_key = /\\CurrentVersion\\Run/ nocase or $e.target.registry.registry_key = /\\CurrentVersion\\RunOnce/ nocase or $e.target.registry.registry_key = /\\Winlogon\\Shell/ nocase or $e.target.registry.registry_key = /\\Winlogon\\Userinit/ nocase)
        ($e.target.registry.registry_value_data = /\\Temp\\/ nocase or $e.target.registry.registry_value_data = /\\Users\\/ nocase or $e.target.registry.registry_value_data = /\\AppData\\/ nocase or $e.target.registry.registry_value_data = /\\Downloads\\/ nocase or $e.target.registry.registry_value_data = /\\Public\\/ nocase)

      condition:
        $e
    }
