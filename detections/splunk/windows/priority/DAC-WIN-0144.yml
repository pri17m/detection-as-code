id: DAC-WIN-0144
title: Sysmon service state change / stop
description: 'Behavior: Sysmon service state change / stop. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. Sysmon 4 or System 7036/7040'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
- WinEventLog:System
- XmlWinEventLog:System
required_fields:
- State
- Version
- SchemaVersion
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1562/001/
- https://attack.mitre.org/resources/updates/updates-april-2026/
tags:
- P1
- category:defense-evasion
- defense-evasion
- phase1
- remapped_from:DAC-WIN-0045
- tier:P1
- windows
- attack-v19-remap
query:
  splunk: '(sourcetype=WinEventLog:System OR sourcetype=XmlWinEventLog:System) `windows_system`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Service=coalesce(ServiceName, param1)

    | search EventCode IN (7036,7040,7045) Service IN ("*sysmon*","*Sysmon*")

    | table _time host EventCode Service Message

    '
