id: DAC-WIN-0117
title: Special privileges assigned to new logon (Tier-0)
description: 'Behavior: Special privileges assigned to new logon (Tier-0). Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Security 4672 with 4624'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1078.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- PrivilegeList
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1078/002/
tags:
- P0
- category:priv-esc
- phase1
- priv-esc
- remapped_from:DAC-WIN-0018
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search EventCode=4672

    | search Account IN ("*admin*","*domain admin*","krbtgt") OR PrivilegeList="*SeDebugPrivilege*"

    | table _time host Account PrivilegeList SubjectUserName

    '
