id: DAC-WIN-0117
title: Special privileges assigned to new logon (Tier-0)
description: 'Behavior: Special privileges assigned to new logon (Tier-0). Anchor is process+flag or event
  id+field after classic/XML coalesce. Not telemetry_validated. Security 4672 with 4624'
author: Detection Engineer
status: experimental
platforms:
- splunk
- google_secops
severity: medium
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1078.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- SubjectUserName
- PrivilegeList
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1078/002/
tags:
- P0
- category:priv-esc
- phase1
- priv-esc
- remapped_from:DAC-WIN-0018
- tier:P0
- windows
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) `windows_security`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Account=coalesce(TargetUserName, Account_Name, SubjectUserName)

    | eval Process=coalesce(NewProcessName, Process_Name)

    | eval Cmd=coalesce(CommandLine, Process_Command_Line)

    | eval Ip=coalesce(IpAddress, Source_Network_Address, WorkstationName)

    | search (EventCode=4672 OR EventID=4672)

    | search Account IN ("*admin*","*domain admin*","krbtgt") OR PrivilegeList="*SeDebugPrivilege*"

    | table _time host Account PrivilegeList SubjectUserName

    '
  google_secops: |-
    rule dac_win_0117 {
      meta:
        author = "Detection Engineer"
        description = "Special privileges assigned to new logon (Tier-0) - Behavior: Special privileges assigned to new logon (Tier-0). Anchor is process+flag or event id+field after classic/XML coalesce. Not telemetry_validated. Security 4672 with 4624"
        severity = "Medium"
        rule_id = "DAC-WIN-0117"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1078.002"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4672"
        ($e.target.user.userid = /admin/ nocase or $e.principal.user.userid = /admin/ nocase or $e.target.user.userid = /domain admin/ nocase or $e.principal.user.userid = /domain admin/ nocase or $e.target.user.userid = "krbtgt" nocase or $e.principal.user.userid = "krbtgt" nocase or $e.target.user.attribute.permissions.name = /SeDebugPrivilege/ nocase)

      condition:
        $e
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
