id: DAC-WIN-0122
title: Office spawning PowerShell
description: 'Behavior: Office spawning PowerShell. Anchor is process+flag or event id+field after classic/XML
  coalesce. Not telemetry_validated. Sysmon 1 Parent WINWORD/EXCEL/OUTLOOK to powershell'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1059/001/
tags:
- P0
- category:process
- phase1
- process
- remapped_from:DAC-WIN-0023
- tier:P0
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search (EventCode=1 OR EventID=1) ParentImage IN ("*\\winword.exe","*\\excel.exe","*\\powerpnt.exe","*\\outlook.exe")
    Image IN ("*\\powershell.exe","*\\cmd.exe","*\\mshta.exe","*\\wscript.exe","*\\cscript.exe")

    | table _time host User ParentImage Image CommandLine

    '
