id: DAC-WIN-0147
title: Regsvr32 unusual parent or path
description: 'Behavior: Regsvr32 unusual parent or path. Anchor is process+flag or event id+field after
  classic/XML coalesce. Not telemetry_validated. Sysmon 1 regsvr32 scrobj/http/temp'
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.010
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Admin tooling and change windows
- EDR or backup agents on the same host
references:
- https://attack.mitre.org/techniques/T1218/010/
tags:
- P1
- category:defense-evasion
- defense-evasion
- phase1
- remapped_from:DAC-WIN-0048
- tier:P1
- windows
query:
  splunk: '(sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
    OR sourcetype=sysmon) `windows_sysmon`

    | eval EventCode=coalesce(EventCode, EventID)

    | eval Image=coalesce(Image, NewProcessName)

    | eval CommandLine=coalesce(CommandLine, Process_Command_Line)

    | eval ParentImage=coalesce(ParentImage, ParentProcessName)

    | eval User=coalesce(User, UserName, SubjectUserName)

    | search EventCode=1 Image="*\\regsvr32.exe"

    | where match(CommandLine, "(?i)http|scrobj|\\users\\|\\temp\\|\\appdata\\") OR match(ParentImage,
    "(?i)\\(winword|excel|powerpnt|outlook|mshta|wscript|cscript)\\")

    | table _time host User Image ParentImage CommandLine

    '
