id: DAC-WIN-0005
title: NTDS/VSS suspicious access on DCs
description: Sysmon 1 ntdsutil/vssadmin/diskshadow; Sysmon 11 *.dit
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - Credential Access
  techniques:
  - T1003.003
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
- TargetFilename
telemetry_validated: false
false_positives:
- Authorized backup/DR on DCs
references:
- https://attack.mitre.org/techniques/T1003/003/
tags:
- phase1
- windows
- P0
- process
query:
  splunk: '`windows_sysmon` (EventCode=1 (Image="*\\ntdsutil.exe" OR Image="*\\vssadmin.exe"
    OR Image="*\\diskshadow.exe" OR CommandLine="*ntds.dit*") OR (EventCode=11 TargetFilename="*.dit"))

    | table _time host EventCode Image CommandLine ParentImage TargetFilename User

    '
