id: DAC-WIN-0026
title: User added to security group (EventCode 4732)
description: Detects group membership additions (EventCode 4732). On this event TargetUserName is the
  GROUP and MemberName/MemberSid identify the member added; SubjectUserName is the actor.
author: DaC
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - privilege-escalation
  - persistence
  techniques:
  - T1098
severity: high
false_positives:
- Legitimate group administration.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4732
- https://attack.mitre.org/techniques/T1098/
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- MemberName
- MemberSid
- SubjectUserName
query:
  splunk: '`windows_security` EventCode=4732

    | eval actor=coalesce(SubjectUserName, Subject_User_Name, src_user)

    | eval group=coalesce(TargetUserName, Target_User_Name, GroupName)

    | eval member=coalesce(MemberName, Member_Name)

    | eval member_sid=coalesce(MemberSid, Member_Sid)

    | where isnotnull(member) OR isnotnull(member_sid)

    | stats count values(member) as members values(member_sid) as member_sids values(group) as groups
    by actor, host

    '
  google_secops: |-
    rule dac_win_0026 {
      meta:
        author = "DaC"
        description = "User added to security group (EventCode 4732) - Detects group membership additions (EventCode 4732). On this event TargetUserName is the GROUP and MemberName/MemberSid identify the member added; SubjectUserName is the actor."
        severity = "High"
        rule_id = "DAC-WIN-0026"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1098"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4732"
        ($e.target.user.user_display_name != "" or $e.target.user.windows_sid != "")
        $user = $e.principal.user.userid
        $name = $e.principal.hostname

      match:
        $user, $name over 1h

      outcome:
        $count = count($e.metadata.id)
        $members = array_distinct($e.target.user.user_display_name)
        $member_sids = array_distinct($e.target.user.windows_sid)
        $groups = array_distinct($e.target.user.userid)

      condition:
        $e
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.9
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: win.security
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - group-by `actor` is a coalesce of ['SubjectUserName', 'Subject_User_Name', 'src_user']; first field used per target.
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
