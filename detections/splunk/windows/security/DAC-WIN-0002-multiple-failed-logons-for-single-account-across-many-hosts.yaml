id: DAC-WIN-0002
title: DCSync replication rights usage (4662) on Domain Controllers
description: Detects Directory Service Access events with replication-related GUIDs consistent with DCSync. Requires Directory Service Access auditing on DCs and GUID mapping quality.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - credential-access
  techniques:
    - T1003.006
severity: critical
false_positives:
  - Legitimate directory replication or identity tooling using replication APIs (should be allowlisted).
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4662
telemetry_validated: false
required_fields:
  - EventCode
  - Properties
  - ObjectName
  - SubjectUserName
  - SubjectDomainName
  - host
query:
  splunk: |
    `windows_security` EventCode=4662
    | eval props=lower(coalesce(Properties, Message))
    | where match(props,"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2|1131f6ad-9c07-11d1-f79f-00c04fc2dcd2|89e95b76-444d-4c62-991a-0facbeda640c")
    | eval user=coalesce(SubjectUserName, Account_Name, user)
    | where isnotnull(user) AND NOT match(user,"\\$$")
    | stats count as events values(ObjectName) as objects values(Properties) as property_guids by host, user, SubjectDomainName
