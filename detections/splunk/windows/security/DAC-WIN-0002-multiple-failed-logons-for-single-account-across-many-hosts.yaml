id: DAC-WIN-0002
title: Multiple failed logons for single account across many hosts
description: Detects a single user failing authentication across many hosts, which
  can indicate credential stuffing or lateral movement attempts.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110
severity: medium
false_positives:
- User password expired or account locked causing repeated failures.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4625
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- host
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4625

    | eval user=coalesce(TargetUserName, Account_Name, user)

    | stats count as failures dc(host) as hosts values(host) as host_list by user

    | where failures >= 20 AND hosts >= 8

    '
