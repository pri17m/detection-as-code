id: DAC-WIN-0008
title: Suspicious PowerShell execution (4104 or encoded PowerShell)
description: Detects PowerShell script block activity consistent with download cradles, encoding, or IEX-style execution, and/or process creation indicative of encoded PowerShell. Requires PowerShell Script Block logging (4104) for best fidelity.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_powershell_operational
  - windows_security
mitre:
  tactics:
    - execution
  techniques:
    - T1059.001
severity: high
false_positives:
  - Legitimate automation and admin scripts; tune by signed script baselines and known management hosts.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
  - https://learn.microsoft.com/powershell/scripting/learn/ps101/02-help-system
telemetry_validated: false
required_fields:
  - EventCode
  - CommandLine
  - ScriptBlockText
  - host
query:
  splunk: |
    (`windows_powershell_operational` EventCode=4104)
    OR (`windows_security` EventCode=4688)
    | eval user=coalesce(User, SubjectUserName, TargetUserName, Account_Name, user)
    | eval msg=lower(coalesce(ScriptBlockText, Message, CommandLine))
    | where match(msg,"frombase64string\\(|-enc(odedcommand)?\\b|\\biex\\b|invoke-webrequest|downloadstring\\(|new-object\\s+net\\.webclient|add-mppreference|set-mppreference")
      OR (EventCode=4688 AND match(lower(coalesce(CommandLine,"")),"powershell(\\.exe)?") AND match(lower(coalesce(CommandLine,"")),"-enc|-encodedcommand|\\biex\\b"))
    | stats count values(coalesce(CommandLine, ScriptBlockText, Message)) as samples by host, user, EventCode
