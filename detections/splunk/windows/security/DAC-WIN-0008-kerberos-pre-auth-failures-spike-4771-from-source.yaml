id: DAC-WIN-0008
title: Suspicious PowerShell (encoded/IEX/download cradle)
description: Detects PowerShell script block activity consistent with download cradles, encoding, or IEX-style execution. Requires PowerShell Script Block logging (4104) for best fidelity.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_powershell_operational
mitre:
  tactics:
    - execution
  techniques:
    - T1059.001
severity: high
false_positives:
  - Legitimate automation and admin scripts; tune by signed script baselines and known management hosts.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4104
telemetry_validated: false
required_fields:
  - ScriptBlockText
  - SubjectUserName
query:
  splunk: |
    `windows_powershell_operational` EventCode=4104
    | eval user=coalesce(User, SubjectUserName, TargetUserName, Account_Name, user)
    | eval msg=lower(coalesce(ScriptBlockText, Message))
    | where match(msg,"frombase64string\\(|-enc(odedcommand)?\\b|\\biex\\b|invoke-webrequest|downloadstring\\(|new-object\\s+net\\.webclient|add-mppreference|set-mppreference")
    | stats count values(msg) as samples by host, user
