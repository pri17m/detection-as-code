id: DAC-WIN-0003
title: Kerberoasting (4769) high-volume TGS requests to many SPNs
description: Detects high-volume Kerberos service ticket requests for many SPNs by a single account, a common Kerberoasting pattern. Tune thresholds and maintain an SPN allowlist.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - credential-access
  techniques:
    - T1558.003
severity: high
false_positives:
  - Legitimate service discovery, monitoring, or vulnerability scanners.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4769
telemetry_validated: false
required_fields:
  - EventCode
  - ServiceName
  - TicketEncryptionType
  - IpAddress
  - TargetUserName
query:
  splunk: |
    `windows_security` EventCode=4769
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | eval spn=coalesce(ServiceName, service)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | stats count as tgs_requests dc(spn) as distinct_spns values(spn) as spns values(TicketEncryptionType) as enc_types by user, src_ip
    | where tgs_requests >= 50 AND distinct_spns >= 20
