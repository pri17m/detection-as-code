id: DAC-WIN-0003
title: Kerberoasting RC4 TGS burst (4769 TicketEncryptionType=0x17)
description: Detects high-volume Kerberos service ticket requests using RC4 (0x17) to many SPNs, a common Kerberoasting pattern. Tune thresholds and maintain an SPN allowlist.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - credential-access
  techniques:
    - T1558.003
severity: high
false_positives:
  - Legacy RC4 environments, monitoring accounts, and legitimate service discovery jobs.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4769
telemetry_validated: false
required_fields:
  - TargetUserName
  - ServiceName
  - IpAddress
  - TicketEncryptionType
query:
  splunk: |
    `windows_security` EventCode=4769
    | where TicketEncryptionType="0x17" OR TicketEncryptionType=0x17 OR TicketEncryptionType=23
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | eval spn=coalesce(ServiceName, service)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | stats count as tgs_requests dc(spn) as distinct_spns values(spn) as spns by user, src_ip
    | where tgs_requests >= 50 AND distinct_spns >= 20
