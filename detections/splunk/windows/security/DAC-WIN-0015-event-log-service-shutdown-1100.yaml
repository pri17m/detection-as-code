id: DAC-WIN-0015
title: Audit/security tampering signals (1102/4719/1100 + Sysmon service events)
description: Detects common audit and telemetry tampering signals including audit log clear (1102), audit policy change (4719), event log service shutdown (1100), and Sysmon service/config events where available. Correlate with other suspicious activity and investigate quickly on DCs and high-value hosts.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
  - windows_sysmon
mitre:
  tactics:
    - defense-evasion
  techniques:
    - T1562.001
    - T1070.001
severity: critical
false_positives:
  - Planned maintenance, authorized policy changes, EDR updates, or system reboots.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-1102
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4719
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-1100
telemetry_validated: false
required_fields:
  - EventCode
  - SubjectUserName
  - host
query:
  splunk: |
    (`windows_security` (EventCode=1102 OR EventCode=4719 OR EventCode=1100))
    OR (`windows_sysmon` (EventCode=4 OR EventCode=16 OR EventCode=255))
    | eval user=coalesce(SubjectUserName, User, Account_Name, user)
    | stats count values(Message) as messages by host, user, EventCode
