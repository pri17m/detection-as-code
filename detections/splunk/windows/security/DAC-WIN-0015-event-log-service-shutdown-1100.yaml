id: DAC-WIN-0015
title: Event log service shutdown (1100)
description: Detects Event ID 1100 indicating the Windows Event Log service was shut
  down, which can be used to impair logging.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.002
severity: high
false_positives:
- Planned maintenance or reboot sequences; investigate unexpected occurrences.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-1100
telemetry_validated: false
required_fields:
- EventCode
- host
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=1100

    | stats count by host

    '
