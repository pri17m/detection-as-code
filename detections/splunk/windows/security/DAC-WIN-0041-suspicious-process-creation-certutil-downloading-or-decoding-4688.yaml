id: DAC-WIN-0041
title: 'Suspicious process creation: Certutil downloading or decoding (4688)'
description: 'Detects Security 4688 where certutil.exe runs with -urlcache, -decode, or
  -encode. The search is the expanded Security sourcetype clause plus
  XmlWinEventLog:Security, which is the lab query that returned the event.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
mitre:
  tactics:
  - execution
  - defense-evasion
  techniques:
  - T1105
severity: medium
false_positives:
- Administrative scripts or software installers may match; tune by allowlisting known
  management hosts/accounts.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
telemetry_validated: false
required_fields:
- EventCode
- NewProcessName
- CommandLine
- ParentProcessName
- SubjectUserName
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security OR (sourcetype=WinEventLog source=WinEventLog:Security) OR (sourcetype=XmlWinEventLog source=XmlWinEventLog:Security)) EventCode=4688

    | eval proc=lower(coalesce(NewProcessName, process_path, Image))

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name))

    | search proc="*certutil.exe" (cmd="*-urlcache*" OR cmd="*-decode*" OR cmd="*-encode*") sourcetype="XmlWinEventLog:Security"

    | stats count values(proc) as processes values(parent) as parents values(cmd)
    as commands by host, SubjectUserName

    '
