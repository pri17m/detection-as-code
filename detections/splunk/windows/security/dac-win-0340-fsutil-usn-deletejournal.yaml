id: DAC-WIN-0340
title: fsutil usn deletejournal
description: >-
  fsutil usn deletejournal removes the NTFS change journal, which wipes a forensic timeline
  (T1070). A hit requires fsutil.exe and the usn deletejournal verb. usn readjournal and other
  fsutil verbs do not match. Telemetry is Windows Security 4688 or Sysmon event 1. Classic and XML
  field names are coalesced (CommandLine, NewProcessName, Image, ParentProcessName). Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1070
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "Disk-maintenance scripts that rebuild the USN journal. Allowlist the maintenance host."
references:
- https://learn.microsoft.com/windows-server/administration/windows-commands/fsutil-usn
- https://attack.mitre.org/techniques/T1070/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- parity:DAC-MDE-0073
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)fsutil\.exe$") AND match(cmd, "usn\s+deletejournal")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
