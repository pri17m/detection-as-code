id: DAC-WIN-0329
title: Zerologon-style DC machine account change followed by DCSync replication
description: "Correlates Security 4742 where a machine account (TargetUserName ending in $) has PasswordLastSet changed (not \"-\" / not %%1794), with a subsequent 4662 Directory Service Access using DS-Replication GUIDs and AccessMask 0x100 performed as that same machine account (SubjectUserName). PrimaryGroupId is not used (it stays \"-\" unless the primary group itself changes). Baseline FP: DC machine passwords rotate about every 30 days — use a dc_accounts lookup when available."
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- "WinEventLog:Security"
- "XmlWinEventLog:Security"
mitre:
  tactics:
  - credential-access
  - lateral-movement
  techniques:
  - T1210
  - T1003.006
severity: critical
false_positives:
- Legitimate DC machine-account password rotation followed by normal replication — maintain dc_accounts allowlist and change windows.
- "Tuning knob: require SubjectUserName of 4742 not ending with $ (external resetter); adjust 30m window."
references:
- "https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4742"
- "https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4662"
- "https://attack.mitre.org/techniques/T1003/006/"
- "https://attack.mitre.org/techniques/T1210/"
- "https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes-all"
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
- SubjectDomainName
- PasswordLastSet
- Properties
- AccessMask
- Computer
tags:
- wave1
- ad
- zerologon
- dcsync
query:
  splunk: |
    `windows_security` (EventCode=4742 OR EventCode=4662)
    ("1131f6aa-9c07-11d1-f79f-00c04fc2dcd2" OR "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR "89e95b76-444d-4c62-991a-0facbeda640c" OR EventCode=4742)
    | eval TargetUserName=coalesce(TargetUserName, Target_User_Name)
    | eval SubjectUserName=coalesce(SubjectUserName, Subject_User_Name)
    | eval PasswordLastSet=coalesce(PasswordLastSet, Password_Last_Set)
    | eval Properties=coalesce(Properties, Property)
    | eval AccessMask=coalesce(AccessMask, Access_Mask)
    | eval Computer=coalesce(Computer, ComputerName, host, dest)
    | eval stage=case(
        EventCode=4742 AND match(TargetUserName,"\\$$") AND isnotnull(PasswordLastSet) AND PasswordLastSet!="-" AND PasswordLastSet!="%%1794", "dc-pwd-reset",
        EventCode=4662 AND match(Properties,"(?i)(1131f6aa-9c07-11d1-f79f-00c04fc2dcd2|1131f6ad-9c07-11d1-f79f-00c04fc2dcd2|89e95b76-444d-4c62-991a-0facbeda640c)") AND (match(AccessMask,"^0x100$") OR AccessMask="256") AND match(SubjectUserName,"\\$$"), "dcsync-4662",
        true(), null())
    | where isnotnull(stage)
    | eval acct=if(stage="dc-pwd-reset", lower(TargetUserName), lower(SubjectUserName))
    | stats min(eval(if(stage="dc-pwd-reset",_time,null()))) as t_reset min(eval(if(stage="dcsync-4662",_time,null()))) as t_sync values(Computer) as computers values(SubjectDomainName) as domains by acct
    | where isnotnull(t_reset) AND isnotnull(t_sync) AND t_sync>t_reset AND (t_sync-t_reset)<=1800
    | table t_reset t_sync acct computers domains
