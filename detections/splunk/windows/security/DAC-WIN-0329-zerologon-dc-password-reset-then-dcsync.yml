id: DAC-WIN-0329
title: Zerologon-style DC machine account change followed by DCSync replication
description: Correlates Security event 4742 where a domain controller machine account (TargetUserName ending in $, PrimaryGroupId 516/521) shows PasswordLastSet changed, with a subsequent 4662 Directory Service Access using DS-Replication-Get-Changes GUID properties — behaviour consistent with Zerologon-style reset then DCSync.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- "WinEventLog:Security"
- "XmlWinEventLog:Security"
mitre:
  tactics:
  - credential-access
  - lateral-movement
  techniques:
  - T1210
  - T1003.006
severity: critical
false_positives:
- Legitimate DC machine-account password rotation followed closely by replication diagnostics — rare; validate SubjectUserName.
- "Tuning knob: adjust transaction maxspan (default 30m); require SubjectUserName NOT ending with $ for higher fidelity."
references:
- "https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4742"
- "https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4662"
- "https://attack.mitre.org/techniques/T1003/006/"
- "https://attack.mitre.org/techniques/T1210/"
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
- SubjectDomainName
- PasswordLastSet
- PrimaryGroupId
- Properties
- AccessMask
- ObjectType
- Computer
tags:
- wave1
- ad
- zerologon
- dcsync
query:
  splunk: |
    (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security)
    (EventCode=4742 OR EventCode=4662)
    | eval TargetUserName=coalesce(TargetUserName, Target_User_Name)
    | eval SubjectUserName=coalesce(SubjectUserName, Subject_User_Name)
    | eval PasswordLastSet=coalesce(PasswordLastSet, Password_Last_Set)
    | eval PrimaryGroupId=coalesce(PrimaryGroupId, Primary_Group_Id)
    | eval Properties=coalesce(Properties, Property)
    | eval AccessMask=coalesce(AccessMask, Access_Mask)
    | eval ObjectType=coalesce(ObjectType, Object_Type)
    | eval stage=case(
        EventCode=4742 AND match(TargetUserName,"\\$$") AND (PrimaryGroupId=516 OR PrimaryGroupId=521 OR match(TargetUserName,"(?i)dc")) AND PasswordLastSet!="-" AND isnotnull(PasswordLastSet), "dc-pwd-reset",
        EventCode=4662 AND match(Properties,"(?i)(1131f6aa-9c07-11d1-f79f-00c04fc2dcd2|1131f6ad-9c07-11d1-f79f-00c04fc2dcd2|89e95b76-444d-4c62-991a-0facbeda640c|DS-Replication-Get-Changes)"), "dcsync-4662",
        true(), null())
    | where isnotnull(stage)
    | transaction Computer maxspan=30m maxevents=50 startswith=(stage="dc-pwd-reset") endswith=(stage="dcsync-4662") keeporphans=false
    | where eventcount>=2
    | table _time Computer SubjectUserName TargetUserName stage AccessMask Properties eventcount
