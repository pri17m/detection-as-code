id: DAC-WIN-0004
title: AS-REP roasting (4768 PreAuthType=0)
description: Detects Kerberos AS-REQ events where pre-authentication is not required (PreAuthType=0), indicating AS-REP roasting opportunities or abuse. Maintain a rare allowlist of legitimate no-preauth accounts.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - credential-access
  techniques:
    - T1558.004
severity: high
false_positives:
  - Accounts intentionally configured without pre-authentication (should be rare).
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4768
telemetry_validated: false
required_fields:
  - TargetUserName
  - IpAddress
  - TicketEncryptionType
  - Status
query:
  splunk: |
    `windows_security` EventCode=4768
    | where PreAuthType=0 OR PreAuthType="0"
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | stats count as as_req values(src_ip) as src_ips values(TicketEncryptionType) as enc_types values(Status) as status_codes by user
