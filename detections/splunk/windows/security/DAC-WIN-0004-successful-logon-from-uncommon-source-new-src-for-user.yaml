id: DAC-WIN-0004
title: AS-REP roasting opportunity or abuse (4768 PreAuthType=0)
description: Detects Kerberos AS-REQ events where pre-authentication is not required (PreAuthType=0), which can indicate AS-REP roasting opportunities or abuse. Maintain a rare allowlist of legitimate no-preauth accounts.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - credential-access
  techniques:
    - T1558.004
severity: high
false_positives:
  - Accounts intentionally configured without pre-authentication (should be rare).
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4768
telemetry_validated: false
required_fields:
  - EventCode
  - TargetUserName
  - PreAuthType
  - IpAddress
query:
  splunk: |
    `windows_security` EventCode=4768
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | where PreAuthType=0 OR PreAuthType="0"
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | stats count as as_req values(src_ip) as src_ips by user
