id: DAC-WIN-0342
title: wsl.exe running curl, wget, or a /dev/tcp redirect
description: >-
  wsl.exe can run a Linux command from a Windows process creation event (T1059.004). A hit is
  wsl.exe whose command line pairs curl or wget with http(s), or contains /dev/tcp/. wsl --status
  and wsl -l do not match. Curl inside an already-running distro is a different event and is not
  this rule. Telemetry is Windows Security 4688 or Sysmon event 1. Classic and XML field names are
  coalesced (CommandLine, NewProcessName, Image, ParentProcessName). Offline command-line samples
  were replayed: the documented malicious lines match and the documented benign lines do not.
  telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: medium
mitre:
  tactics:
  - execution
  techniques:
  - T1059.004
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "Developers who curl a package from inside an explicit wsl.exe command line."
references:
- https://learn.microsoft.com/windows/wsl/basic-commands
- https://attack.mitre.org/techniques/T1059/004/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- parity:DAC-MDE-0075
- parity:DAC-CS-0220
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)wsl\.exe$") AND match(cmd, "(curl|wget).{0,80}https?://|https?://.{0,80}(curl|wget)|/dev/tcp/")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
