id: DAC-WIN-0001
title: LSASS process access by non-EDR (Sysmon 10)
description: Detects Sysmon ProcessAccess events targeting LSASS, a strong signal for credential dumping. Tune with an allowlist of known EDR/AV processes in your environment.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_sysmon
mitre:
  tactics:
    - credential-access
  techniques:
    - T1003.001
severity: critical
false_positives:
  - Legitimate AV/EDR/backup agents and authorized diagnostics.
references:
  - https://learn.microsoft.com/sysinternals/downloads/sysmon
telemetry_validated: false
required_fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
query:
  splunk: |
    `windows_sysmon` EventCode=10
    | eval target=lower(coalesce(TargetImage, TargetProcessName))
    | where like(target, "%\\lsass.exe")
    | eval source=lower(coalesce(SourceImage, Image))
    | where isnotnull(source)
    | stats count as access_events values(GrantedAccess) as granted_access values(CallTrace) as call_traces by host, User, source
