id: DAC-WIN-0001
title: Excessive failed logons from single source
description: Detects bursts of failed logons (4625) from a single source IP which
  can indicate password spraying or brute force.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110
severity: medium
false_positives:
- Misconfigured services or users repeatedly mistyping passwords.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4625
telemetry_validated: false
required_fields:
- EventCode
- IpAddress
- TargetUserName
- host
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4625

    | eval src_ip=coalesce(IpAddress, src, src_ip)

    | eval user=coalesce(TargetUserName, Account_Name, user)

    | stats count as failures dc(user) as users values(user) as user_list by src_ip,
    host

    | where failures >= 25 AND users >= 10

    '
