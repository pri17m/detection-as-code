id: DAC-WIN-0001
title: LSASS process access (Sysmon 10) suspicious source process
description: Detects Sysmon ProcessAccess events targeting LSASS, a strong signal for credential dumping. Tune with an allowlist of known EDR/AV processes in your environment.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_sysmon
mitre:
  tactics:
    - credential-access
  techniques:
    - T1003.001
severity: high
false_positives:
  - Legitimate EDR/AV, backup, or admin tooling that reads LSASS memory.
references:
  - https://learn.microsoft.com/sysinternals/downloads/sysmon
telemetry_validated: false
required_fields:
  - EventCode
  - SourceImage
  - TargetImage
  - GrantedAccess
  - User
  - host
query:
  splunk: |
    `windows_sysmon` EventCode=10
    | eval target=lower(coalesce(TargetImage, TargetProcessName))
    | where like(target, "%\\lsass.exe")
    | eval source=lower(coalesce(SourceImage, Image))
    | where isnotnull(source) AND NOT match(source, "\\\\system32\\\\csrss\\.exe$")
    | stats count as access_events values(GrantedAccess) as granted_access values(CallTrace) as call_traces by host, User, source, target
