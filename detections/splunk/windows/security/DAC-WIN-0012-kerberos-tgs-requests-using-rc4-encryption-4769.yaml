id: DAC-WIN-0012
title: Run key persistence (Sysmon 13) CurrentVersion\\Run / RunOnce value set
description: Detects registry value sets in common Run/RunOnce persistence keys via Sysmon Event ID 13. Tune allowlists for known software updaters and enterprise tooling.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_sysmon
mitre:
  tactics:
    - persistence
  techniques:
    - T1547.001
severity: high
false_positives:
  - Legitimate software auto-start entries and IT management tooling.
references:
  - https://learn.microsoft.com/sysinternals/downloads/sysmon
telemetry_validated: false
required_fields:
  - EventCode
  - TargetObject
  - Details
  - Image
  - User
  - host
query:
  splunk: |
    `windows_sysmon` EventCode=13
    | eval key=lower(TargetObject)
    | where match(key,"\\\\software\\\\microsoft\\\\windows\\\\currentversion\\\\run(once)?\\\\")
      OR match(key,"\\\\software\\\\microsoft\\\\windows\\\\currentversion\\\\policies\\\\explorer\\\\run\\\\")
    | stats count values(Image) as images values(Details) as value_data by host, User, TargetObject
