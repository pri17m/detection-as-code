id: DAC-WIN-0337
title: desktopimgdownldr lockscreen URL outside Microsoft
description: "Detects desktopimgdownldr.exe /lockscreenurl pointed at a host other than Microsoft Spotlight CDNs. Windows Spotlight calls to microsoft.com, msn.com, and azureedge.net are excluded. Security 4688 or Sysmon 1. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - command-and-control
  techniques:
  - T1105
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "A management tool that sets a custom lock-screen URL on a non-Microsoft host."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Desktopimgdownldr/
- https://attack.mitre.org/techniques/T1105/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- lolbas
- parity:DAC-MDE-0070
- parity:DAC-CS-0216
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)desktopimgdownldr\.exe$") AND match(cmd, "lockscreenurl") AND NOT match(cmd, "lockscreenurl:\s*https?://([a-z0-9.-]*\.)?(microsoft\.com|windows\.com|live\.com|bing\.com|msn\.com|azureedge\.net|microsoftonline\.com)([/:?\s]|$)")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
