id: DAC-WIN-0341
title: pcalua proxy execution of a script, DLL, or user-writable file
description: >-
  pcalua.exe is the Program Compatibility Assistant and can be told to launch another file with -a
  (T1202). A hit requires -a and a DLL, CPL, script, URL, UNC path, or a file under Users, Temp,
  Public, AppData, or ProgramData. Launching a binary from Program Files or System32 does not
  match. Telemetry is Windows Security 4688 or Sysmon event 1. Classic and XML field names are
  coalesced (CommandLine, NewProcessName, Image, ParentProcessName). Offline command-line samples
  were replayed: the documented malicious lines match and the documented benign lines do not.
  telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1202
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "Compatibility shims that launch a vendor binary from a user-writable path. Allowlist that path."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Pcalua/
- https://attack.mitre.org/techniques/T1202/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- lolbas
- parity:DAC-MDE-0074
- parity:DAC-CS-0219
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)pcalua\.exe$") AND match(cmd, "(^|\s)-a(\s|$)") AND match(cmd, "(\\\\|\\users\\|\\temp\\|\\public\\|\\appdata\\|\\programdata\\|https?://|\.dll\b|\.cpl\b|\.js\b|\.vbs\b|\.hta\b|\.bat\b|\.cmd\b|\.ps1\b)")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
