query:
  splunk: |
    (`windows_security` EventCode=4688) OR (`windows_sysmon` EventCode=1)
    | eval proc=lower(coalesce(NewProcessName, New_Process_Name, Image))
    | eval ofn=lower(OriginalFileName)
    | eval cmd=coalesce(CommandLine, Process_Command_Line)
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, ParentImage))
    | eval parent_cmd=lower(ParentCommandLine)
    | eval parent_name=replace(parent, "^.*\\\\", "")
    | where (match(proc, "\\\\pythonw?\.exe$") OR ofn="python.exe" OR ofn="pythonw.exe") AND match(proc, "^[a-z]:\\\\(programdata|users\\\\public)\\\\")
    | eval sched=case(parent_name="taskeng.exe", "taskeng",
        parent_name="svchost.exe" AND isnull(parent_cmd), "svchost_unconfirmed",
        parent_name="svchost.exe" AND like(parent_cmd, "%-s schedule%"), "schedule_service",
        parent_name="svchost.exe" AND like(parent_cmd, "%netsvcs%") AND NOT like(parent_cmd, "% -s %"), "netsvcs_shared",
        true(), "none")
    | where sched!="none" AND isnotnull(cmd) AND cmd!=""
    | eval script_args=trim(replace(cmd, "^\s*(\"[^\"]*\"|\S+)", ""))
    | where NOT match(script_args, "(?i)\.(py|pyw|pyc|pyz|zip)\b") AND NOT match(script_args, "(^|\s)-[A-Za-z]*[cm]")
    | eval user=coalesce(User, SubjectUserName, Account_Name)
    | table _time host EventCode sched proc ofn cmd script_args parent parent_cmd user
