id: DAC-WIN-0366
title: "Task Scheduler starts python.exe or pythonw.exe from ProgramData or Users\\Public with no script"
description: >-
  Security 4688 or Sysmon 1 where the new process is python.exe or pythonw.exe under C:\ProgramData\ or
  C:\Users\Public\, the parent is svchost.exe or taskeng.exe, and the command line has no script argument:
  no .py, .pyw, .pyc, .pyz or .zip token and no -c or -m option. Sysmon 1 carries ParentCommandLine, so
  a svchost.exe parent that names a service other than Schedule is dropped there. 4688 only has the parent
  image path, so those events are marked svchost_unconfirmed. 4688 needs "Include command line in process
  creation events"; events with no command line are dropped rather than guessed. A bare interpreter only
  does something if a startup hook (sitecustomize.py, usercustomize.py, a .pth import line) runs code,
  which is how S5PIVOT and VIPERTUNNEL were launched. Companion to DAC-MDE-0107 and DAC-CS-0253.
  telemetry_validated false.
author: DaC
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - persistence
  - execution
  - privilege-escalation
  techniques:
  - T1053.005
  - T1546.018
  - T1059.006
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- NewProcessName
- ParentProcessName
- CommandLine
- Image
- OriginalFileName
- ParentImage
- ParentCommandLine
telemetry_validated: false
false_positives:
- "An admin task that starts a bare interpreter by mistake. It exits straight away; fix the task (not measured)."
- "On 4688, any svchost.exe service (not only Schedule) that starts python.exe or pythonw.exe from these folders with no script, because 4688 has no parent command line. Check the parent PID against the Schedule service (not measured)."
