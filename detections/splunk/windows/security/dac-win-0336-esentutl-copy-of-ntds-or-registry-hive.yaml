id: DAC-WIN-0336
title: esentutl copy of NTDS or registry hive
description: "Detects esentutl.exe /y copy mode aimed at ntds.dit, the NTDS directory, a VSS copy, or the SAM/SYSTEM/SECURITY hives under config\\. Bare system32 paths are not enough. Security 4688 or Sysmon 1. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "Domain-controller backup jobs that copy ntds.dit with esentutl. Allowlist the backup account and host."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
- https://attack.mitre.org/techniques/T1003/003/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- lolbas
- parity:DAC-MDE-0069
- parity:DAC-CS-0215
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)esentutl\.exe$") AND match(cmd, "/y") AND match(cmd, "(/vss|ntds\.dit|\\config\\sam|\\config\\system|\\config\\security|\\ntds\\)")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
