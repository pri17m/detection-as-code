id: DAC-WIN-0007
title: Account lockout spike (4740) by source host
description: Detects spikes in account lockouts, which can indicate password spraying
  against multiple accounts or misconfigured services.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110
severity: medium
false_positives:
- Password policy changes; misconfigured service accounts.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4740
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- CallerComputerName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4740

    | eval user=coalesce(TargetUserName, user)

    | eval caller=coalesce(CallerComputerName, src, host)

    | stats count dc(user) as users values(user) as user_list by caller

    | where count >= 10 AND users >= 8

    '
