id: DAC-WIN-0007
title: Admin share write + new service (PsExec-class correlation)
description: Correlates administrative share access with a subsequent service installation on the same host within a short window, a common PsExec-/SMB-based lateral movement pattern.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
  - windows_system
mitre:
  tactics:
    - lateral-movement
    - persistence
  techniques:
    - T1021.002
    - T1543.003
severity: high
false_positives:
  - SCCM/IT deployment tooling, patching, and legitimate admin activity (allowlist jump hosts).
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-5145
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-7045
telemetry_validated: false
required_fields:
  - SubjectUserName
  - ShareName
  - RelativeTargetName
  - AccessMask
  - IpAddress
  - ServiceName
  - ImagePath
query:
  splunk: |
    (`windows_security` (EventCode=5145 OR EventCode=4697))
    OR (`windows_system` EventCode=7045)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | eval user=coalesce(SubjectUserName, SubjectAccountName, user)
    | eval share=lower(coalesce(ShareName, Share_Name))
    | eval is_admin_share=if(match(share,"\\\\(admin\\$|c\\$|d\\$|ipc\\$)$"),1,0)
    | eval is_share_evt=if(EventCode=5145 AND is_admin_share=1,1,0)
    | eval is_service_evt=if(EventCode=7045 OR EventCode=4697,1,0)
    | bin _time span=30m
    | stats sum(is_share_evt) as admin_share_events sum(is_service_evt) as service_events values(ShareName) as shares values(RelativeTargetName) as relative_targets values(ServiceName) as service_names values(ImagePath) as image_paths by _time, host, user, src_ip
    | where admin_share_events>0 AND service_events>0
