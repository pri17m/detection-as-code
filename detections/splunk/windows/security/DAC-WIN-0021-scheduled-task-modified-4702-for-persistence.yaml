id: DAC-WIN-0021
title: Scheduled task modified (4702) for persistence
description: Detects modifications to scheduled tasks that may indicate persistence
  through task hijacking.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1053.005
severity: medium
false_positives:
- Legitimate task updates by administrators.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4702
telemetry_validated: false
required_fields:
- EventCode
- TaskName
- TaskContent
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4702

    | eval task=coalesce(TaskName, Task_Name)

    | stats count values(task) as tasks by host, SubjectUserName

    | where count >= 3

    '
