id: DAC-WIN-0021
title: Scheduled task modified (4702) for persistence
description: Detects modifications to scheduled tasks that may indicate persistence
  through task hijacking.
author: DaC
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1053.005
severity: medium
false_positives:
- Legitimate task updates by administrators.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4702
telemetry_validated: false
required_fields:
- EventCode
- TaskName
- TaskContent
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4702

    | eval task=coalesce(TaskName, Task_Name)

    | stats count values(task) as tasks by host, SubjectUserName

    | where count >= 3

    '
  google_secops: |-
    rule dac_win_0021 {
      meta:
        author = "DaC"
        description = "Scheduled task modified (4702) for persistence - Detects modifications to scheduled tasks that may indicate persistence through task hijacking."
        severity = "Medium"
        rule_id = "DAC-WIN-0021"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1053.005"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4702"
        $name = $e.principal.hostname
        $user = $e.principal.user.userid

      match:
        $name, $user over 1h

      outcome:
        $count = count($e.metadata.id)
        $tasks = array_distinct($e.target.resource.name)

      condition:
        $e and $count >= 3
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.95
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: win.security
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
