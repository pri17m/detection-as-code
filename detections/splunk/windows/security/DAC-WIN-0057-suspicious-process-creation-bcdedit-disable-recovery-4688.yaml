id: DAC-WIN-0057
title: 'Suspicious process creation: Bcdedit disable recovery (4688)'
description: 'Detects 4688 process creation events matching a known suspicious pattern: Bcdedit disable
  recovery.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - execution
  - defense-impairment
  techniques:
  - T1685
severity: high
false_positives:
- Administrative scripts or software installers may match; tune by allowlisting known management hosts/accounts.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
- https://attack.mitre.org/resources/updates/updates-april-2026/
telemetry_validated: false
required_fields:
- EventCode
- NewProcessName
- CommandLine
- ParentProcessName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4688

    | eval proc=lower(coalesce(NewProcessName, process_path, Image))

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name))

    | where match(cmd, "bcdedit\.exe.*(recoveryenabled\s+no|bootstatuspolicy\s+ignoreallfailures)")

    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host,
    SubjectUserName

    '
tags:
- attack-v19-remap
