id: DAC-WIN-0331
title: Admin or privileged account password reset by non-admin subject
description: "Detects Security event 4724 password resets where the TargetUserName matches built-in Administrator, accounts containing admin, or well-known privileged naming, while SubjectUserName does not match admin/helpdesk allowlist patterns and Subject != Target — privilege abuse / account takeover signal (T1098)."
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- "WinEventLog:Security"
- "XmlWinEventLog:Security"
mitre:
  tactics:
  - persistence
  - credential-access
  techniques:
  - T1098
severity: high
false_positives:
- Helpdesk password-reset operators not covered by the subject allowlist — extend allowlist after baselining.
- "Tuning knob: maintain a lookup of approved resetters; optionally require TargetSid ending in -500."
references:
- "https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4724"
- "https://attack.mitre.org/techniques/T1098/"
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- TargetSid
- SubjectUserName
- SubjectUserSid
- SubjectDomainName
- Computer
tags:
- wave1
- account-manipulation
query:
  splunk: |
    (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4724
    | eval TargetUserName=coalesce(TargetUserName, Target_User_Name)
    | eval SubjectUserName=coalesce(SubjectUserName, Subject_User_Name)
    | eval TargetSid=coalesce(TargetSid, Target_Sid)
    | eval SubjectUserSid=coalesce(SubjectUserSid, Subject_User_Sid)
    | eval Computer=coalesce(Computer, host, dest)
    | where match(TargetUserName, "(?i)^(administrator|admin|.+admin.*|krbtgt)$") OR match(TargetSid, "-500$")
    | where SubjectUserName!=TargetUserName
    | where NOT match(SubjectUserName, "(?i)^(administrator|.*helpdesk.*|.*pam.*|.*breakglass.*|.*svc-?reset.*)$")
    | where NOT match(SubjectUserSid, "-500$")
    | stats count values(TargetUserName) as targets values(SubjectDomainName) as domains by Computer SubjectUserName SubjectUserSid
    | where count>=1
