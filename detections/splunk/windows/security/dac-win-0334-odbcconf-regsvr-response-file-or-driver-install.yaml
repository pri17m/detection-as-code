id: DAC-WIN-0334
title: odbcconf REGSVR, response file, or driver install
description: >-
  odbcconf.exe is a signed Windows binary that can register a DLL (REGSVR), load a response file
  (-f), or install an ODBC driver. Those arguments are the LOLBAS proxy-execution paths for
  T1218.008. A hit means the command line contains REGSVR, INSTALLDRIVER, configsysdsn, or a -f/-F
  response file. Plain odbcconf /S does not match. Telemetry is Windows Security 4688 or Sysmon
  event 1. Classic and XML field names are coalesced (CommandLine, NewProcessName, Image,
  ParentProcessName). Offline command-line samples were replayed: the documented malicious lines
  match and the documented benign lines do not. telemetry_validated stays false until this search
  is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.008
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "ODBC driver installers that call INSTALLDRIVER or configsysdsn. Allowlist the known installer image and parent."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://attack.mitre.org/techniques/T1218/008/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- lolbas
- parity:DAC-MDE-0067
- parity:DAC-CS-0213
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)odbcconf\.exe$") AND match(cmd, "(regsvr|installdriver|configsysdsn|(^|\s)[-/]f(\s|$))")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
