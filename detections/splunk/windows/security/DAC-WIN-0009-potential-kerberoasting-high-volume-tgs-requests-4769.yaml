id: DAC-WIN-0009
title: Potential Kerberoasting (high volume TGS requests) (4769)
description: Detects high volume Kerberos service ticket requests for many SPNs by
  a single account, a common Kerberoasting pattern.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1558.003
severity: high
false_positives:
- Legitimate service discovery or monitoring accounts.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4769
telemetry_validated: false
required_fields:
- EventCode
- Account_Name
- ServiceName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4769

    | eval user=coalesce(Account_Name, TargetUserName, user)

    | stats count as tgs_requests dc(ServiceName) as spn_count values(ServiceName)
    as spns by user

    | where tgs_requests >= 50 AND spn_count >= 20

    '
