id: DAC-WIN-0011
title: Scheduled task created or modified with suspicious command (4698/4702)
description: Detects scheduled task creation or modification where the task content references common LOLBins or suspicious interpreters. Requires Security auditing for task events and TaskContent extraction.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - persistence
    - execution
  techniques:
    - T1053.005
severity: high
false_positives:
  - Legitimate admin automation and enterprise scheduled tasks (allowlist by TaskName/publisher).
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4698
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4702
telemetry_validated: false
required_fields:
  - EventCode
  - TaskName
  - TaskContent
  - SubjectUserName
  - host
query:
  splunk: |
    `windows_security` (EventCode=4698 OR EventCode=4702)
    | eval user=coalesce(SubjectUserName, Account_Name, user)
    | eval task=coalesce(TaskName, Task_Name, ObjectName)
    | eval content=lower(coalesce(TaskContent, Message))
    | where match(content,"powershell(\\.exe)?|cmd(\\.exe)?|rundll32(\\.exe)?|mshta(\\.exe)?|wscript(\\.exe)?|cscript(\\.exe)?|regsvr32(\\.exe)?|bitsadmin(\\.exe)?")
    | stats count values(task) as task_names values(content) as task_content_samples by host, user, EventCode
