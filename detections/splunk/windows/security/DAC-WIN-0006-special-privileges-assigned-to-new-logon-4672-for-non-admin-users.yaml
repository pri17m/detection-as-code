id: DAC-WIN-0006
title: Pass-the-Hash signal (4624 NTLM Type 3 with KeyLength=0)
description: Detects network logons where NTLM is used and the negotiated KeyLength is 0, a common (but imperfect) heuristic for Pass-the-Hash or legacy NTLM patterns. Tune by workstation/jump-host allowlists and service accounts.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - lateral-movement
    - credential-access
  techniques:
    - T1550.002
severity: high
false_positives:
  - Legacy NTLM flows, misconfigured clients, or certain service authentication patterns.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4624
telemetry_validated: false
required_fields:
  - EventCode
  - LogonType
  - AuthenticationPackageName
  - KeyLength
  - TargetUserName
  - IpAddress
  - host
query:
  splunk: |
    `windows_security` EventCode=4624
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | where LogonType=3
    | where AuthenticationPackageName="NTLM" OR lower(AuthenticationPackageName)="ntlm"
    | where KeyLength=0 OR KeyLength="0"
    | where isnotnull(user) AND NOT match(user,"\\$$")
    | stats count values(WorkstationName) as workstations values(LogonProcessName) as logon_processes by host, user, src_ip
