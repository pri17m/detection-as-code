id: DAC-WIN-0006
title: Pass-the-Hash NTLM Type 3 anomalies (4624)
description: Detects network logons where NTLM is used and the negotiated KeyLength is 0, a common (but imperfect) heuristic for Pass-the-Hash or legacy NTLM patterns. Tune by jump-host allowlists and service accounts.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_security
mitre:
  tactics:
    - lateral-movement
    - credential-access
  techniques:
    - T1550.002
severity: high
false_positives:
  - Legacy NTLM service accounts and certain workstation authentication patterns.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4624
telemetry_validated: false
required_fields:
  - LogonType
  - TargetUserName
  - IpAddress
  - WorkstationName
  - AuthenticationPackageName
  - KeyLength
query:
  splunk: |
    `windows_security` EventCode=4624
    | where LogonType=3
    | where AuthenticationPackageName="NTLM" OR lower(AuthenticationPackageName)="ntlm"
    | where KeyLength=0 OR KeyLength="0"
    | eval user=coalesce(TargetUserName, Account_Name, user)
    | eval src_ip=coalesce(IpAddress, Source_Network_Address, src, src_ip)
    | stats count values(WorkstationName) as workstations values(LogonProcessName) as logon_processes by host, user, src_ip
