id: DAC-WIN-0344
title: explorer.exe launched with a search-ms URI
description: "Detects explorer.exe started with a search-ms: URI, which opens a remote search window used in phishing. Normal Explorer path launches do not match. Security 4688 or Sysmon 1. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - initial-access
  techniques:
  - T1204.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- CommandLine
- NewProcessName
- Image
- ParentProcessName
telemetry_validated: false
false_positives:
- "An internal app that deep-links Windows Search with search-ms. Allowlist that parent."
references:
- https://learn.microsoft.com/windows/win32/search/-search-3x-wds-extidx-prot-implementing
- https://attack.mitre.org/techniques/T1204/001/
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
tags:
- quality-wave
- parity:DAC-MDE-0077
- parity:DAC-CS-0222
query:
  splunk: |
    ((sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4688) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1)
    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))
    | eval proc=lower(coalesce(NewProcessName, Image, process_path, process))
    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name, ParentImage))
    | where match(proc, "(^|\\)explorer\.exe$") AND match(cmd, "search-ms:")
    | stats count values(proc) as processes values(parent) as parents values(cmd) as commands by host
