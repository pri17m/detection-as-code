id: DAC-WIN-0014
title: Service installed (4697) via Security audit
description: Detects service installation via Security auditing (4697), which can
  indicate persistence using new or modified services.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - persistence
  techniques:
  - T1543.003
severity: high
false_positives:
- Legitimate software installs.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4697
telemetry_validated: false
required_fields:
- EventCode
- ServiceName
- ServiceFileName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4697

    | eval img=lower(coalesce(ServiceFileName, ImagePath, Message))

    | where match(img, "(\\\\users\\\\|\\\\temp\\\\|\\\\appdata\\\\|cmd\\.exe|powershell\\.exe|wscript\\.exe|cscript\\.exe)")

    | stats count values(ServiceName) as services values(img) as image_paths by host,
    SubjectUserName

    '
