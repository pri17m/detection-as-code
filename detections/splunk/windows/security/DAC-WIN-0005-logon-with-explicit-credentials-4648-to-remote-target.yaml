id: DAC-WIN-0005
title: NTDS/VSS suspicious access on Domain Controllers (Sysmon 1/11)
description: Detects suspicious process creation consistent with offline AD database theft or shadow copy abuse (ntdsutil/diskshadow/wbadmin/vssadmin/esentutl), and/or suspicious file creates for ntds.dit. Run on Domain Controllers and tune allowlists for backup tooling.
author: Threat Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_sysmon
mitre:
  tactics:
    - credential-access
  techniques:
    - T1003.003
severity: critical
false_positives:
  - Authorized backup/DR or domain maintenance tooling on Domain Controllers.
references:
  - https://attack.mitre.org/techniques/T1003/003/
telemetry_validated: false
required_fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - TargetFilename
query:
  splunk: |
    `windows_sysmon` (EventCode=1 OR EventCode=11)
    | eval img=lower(coalesce(Image, SourceImage))
    | eval cmd=lower(coalesce(CommandLine, Message))
    | eval tf=lower(coalesce(TargetFilename, TargetFileName))
    | where (EventCode=1 AND match(img,"\\\\(ntdsutil|diskshadow|wbadmin|vssadmin|esentutl)\\.exe$"))
      OR (EventCode=1 AND match(cmd,"ntds\\.dit|systemstatebackup|ifm|shadowcopy"))
      OR (EventCode=11 AND match(tf,"\\\\ntds\\.dit$|\\\\ntds\\.dit\\.tmp$|\\\\ntds\\.dit\\.bak$"))
    | stats count values(CommandLine) as command_lines values(ParentImage) as parent_images values(TargetFilename) as target_filenames by host, User, Image, EventCode
