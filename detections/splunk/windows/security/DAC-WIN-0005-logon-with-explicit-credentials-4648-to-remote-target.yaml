id: DAC-WIN-0005
title: Logon with explicit credentials (4648) to remote target
description: Detects explicit credential logons (4648) which can indicate lateral
  movement using runas, psexec, or credential material reuse.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.001
severity: medium
false_positives:
- Legitimate admin tooling using alternate credentials.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4648
telemetry_validated: false
required_fields:
- EventCode
- TargetServerName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4648

    | eval user=coalesce(SubjectUserName, Account_Name, user)

    | eval target=coalesce(TargetServerName, dest, ComputerName)

    | stats count values(ProcessName) as processes values(target) as targets by user

    | where count >= 3

    '
