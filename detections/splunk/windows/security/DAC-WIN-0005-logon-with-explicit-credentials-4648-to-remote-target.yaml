id: DAC-WIN-0005
title: NTDS/VSS tooling on Domain Controllers (Sysmon 1) suspicious invocation
description: Detects suspicious process creation consistent with offline AD database theft or shadow copy abuse (ntdsutil/diskshadow/wbadmin/vssadmin/esentutl). Run on Domain Controllers and tune allowlists for backup tooling.
author: Detection Engineering
status: experimental
platforms:
  - splunk
sourcetypes:
  - windows_sysmon
mitre:
  tactics:
    - credential-access
  techniques:
    - T1003.003
severity: high
false_positives:
  - Legitimate backup/restore or domain maintenance tooling (should be allowlisted).
references:
  - https://attack.mitre.org/techniques/T1003/003/
telemetry_validated: false
required_fields:
  - EventCode
  - Image
  - CommandLine
  - ParentImage
  - User
  - host
query:
  splunk: |
    `windows_sysmon` EventCode=1
    | eval img=lower(Image)
    | where match(img,"\\\\(ntdsutil|diskshadow|wbadmin|vssadmin|esentutl)\\.exe$")
      OR (match(img,"\\\\cmd\\.exe$|\\\\powershell\\.exe$") AND match(lower(CommandLine),"ntds\\.dit|systemstatebackup|ifm|create full|shadowcopy"))
    | stats count values(CommandLine) as command_lines values(ParentImage) as parent_images by host, User, Image
