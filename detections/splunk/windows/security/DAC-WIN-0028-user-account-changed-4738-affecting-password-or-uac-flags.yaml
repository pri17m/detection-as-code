id: DAC-WIN-0028
title: User account changed (4738) affecting password or UAC flags
description: Detects account property changes that can be used for persistence or
  privilege manipulation (e.g., enabling delegation or changing UAC-related flags).
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - persistence
  - privilege-escalation
  techniques:
  - T1098
severity: medium
false_positives:
- Normal identity management changes.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4738
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4738

    | eval actor=coalesce(SubjectUserName, src_user)

    | eval target=coalesce(TargetUserName, user)

    | stats count values(ChangedAttributes) as changed_attrs by actor, target, host

    '
