- s5pivot
- vipertunnel
- needs-review
- parity:DAC-MDE-0108
- parity:DAC-CS-0254
query:
  splunk: |
    `windows_security` EventCode=4698
    | eval task_name=coalesce(TaskName, Task_Name)
    | eval task_content=coalesce(TaskContent, Task_Content)
    | where match(task_name, "(^|\\\\)[0-9]+$")
    | where match(task_content, "(?is)(<|&lt;)Command(>|&gt;)\s*[^<&]*pythonw?\.exe\"?\s*(<|&lt;)/Command")
    | where match(task_content, "(?is)(<|&lt;)UserId(>|&gt;)\s*(S-1-5-18|SYSTEM|NT AUTHORITY\\\\SYSTEM)\s*(<|&lt;)/UserId")
    | rex field=task_content "(?is)(<|&lt;)Command(>|&gt;)\s*(?<task_command>[^<&]+?)\s*(<|&lt;)/Command"
    | rex field=task_content "(?is)(<|&lt;)UserId(>|&gt;)\s*(?<task_userid>[^<&]+?)\s*(<|&lt;)/UserId"
    | table _time host task_name task_command task_userid SubjectUserName SubjectDomainName SubjectLogonId ClientProcessId ParentProcessId
