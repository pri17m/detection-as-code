id: DAC-WIN-0338
title: 'Process started from a directory that should not hold executables'
description: 'Detects event 4688 where the image path is a known staging directory and the binary is not a Windows component. Covers PerfLogs, Windows Temp, Windows Tasks, tracing, CRMLog, spool driver color, spool PRINTERS, COM dumps, and Users Public. These directories exist by default and hold data, not programs. ProgramData is excluded because legitimate updaters execute from vendor folders there.'
author: DaC
status: experimental
platforms:
  - splunk
sourcetypes:
  - WinEventLog:Security
mitre:
  tactics:
    - execution
    - defense-evasion
  techniques:
    - T1204.002
    - T1036.005
severity: high
false_positives:
  - 'An installer that briefly runs a helper from Windows Temp. Tune on parent process and signer, not by deleting the path.'
  - 'A management agent that an admin copied into Public. Allowlist that full path.'
references:
  - 'https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688'
  - 'https://attack.mitre.org/techniques/T1074/001/'
  - 'https://research.splunk.com/endpoint/237016fa-d8e6-47b4-80f9-70c4d42c72c0/'
telemetry_validated: false
required_fields:
  - EventCode
  - NewProcessName
query:
  splunk: |
    sourcetype=WinEventLog:Security EventCode=4688
    | eval proc=lower(coalesce(NewProcessName, process_path, Image))
    | where match(proc, "(?i)(\\\\perflogs\\\\|\\\\windows\\\\temp\\\\|\\\\windows\\\\tasks\\\\|\\\\windows\\\\tracing\\\\|\\\\windows\\\\registration\\\\crmlog\\\\|\\\\windows\\\\system32\\\\spool\\\\drivers\\\\color\\\\|\\\\windows\\\\system32\\\\spool\\\\printers\\\\|\\\\windows\\\\system32\\\\com\\\\dmp\\\\|\\\\users\\\\public\\\\)")
    | where NOT match(proc, "(?i)\\\\windows\\\\(system32|syswow64)\\\\")
    | stats count min(_time) as firstTime values(CommandLine) as command values(ParentProcessName) as parent by Computer, SubjectUserName, proc
