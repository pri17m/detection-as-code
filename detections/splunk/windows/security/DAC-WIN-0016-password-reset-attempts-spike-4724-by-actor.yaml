id: DAC-WIN-0016
title: Password reset attempts spike (4724) by actor
description: Detects spikes in password reset attempts which can indicate account
  takeover or helpdesk abuse.
author: DaC
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1098
severity: high
false_positives:
- Helpdesk bulk resets during incidents or onboarding.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4724
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4724

    | eval actor=coalesce(SubjectUserName, src_user)

    | eval target=coalesce(TargetUserName, user)

    | stats count as resets dc(target) as users values(target) as user_list by actor,
    host

    | where resets >= 5 AND users >= 5

    '
  google_secops: |-
    rule dac_win_0016 {
      meta:
        author = "DaC"
        description = "Password reset attempts spike (4724) by actor - Detects spikes in password reset attempts which can indicate account takeover or helpdesk abuse."
        severity = "High"
        rule_id = "DAC-WIN-0016"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1098"

      events:
        $e.metadata.log_type = "WINEVTLOG"
        $e.metadata.product_event_type = "4724"
        $user = $e.principal.user.userid
        $name = $e.principal.hostname

      match:
        $user, $name over 1h

      outcome:
        $resets = count($e.metadata.id)
        $users = count_distinct($e.target.user.userid)
        $user_list = array_distinct($e.target.user.userid)

      condition:
        $e and $resets >= 5 and $users >= 5
    }
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.9
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: win.security
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - group-by `actor` is a coalesce of ['SubjectUserName', 'src_user']; first field used per target.
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
