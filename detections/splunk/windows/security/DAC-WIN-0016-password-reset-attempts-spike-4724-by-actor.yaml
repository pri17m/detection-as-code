id: DAC-WIN-0016
title: Password reset attempts spike (4724) by actor
description: Detects spikes in password reset attempts which can indicate account
  takeover or helpdesk abuse.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - credential-access
  techniques:
  - T1098
severity: high
false_positives:
- Helpdesk bulk resets during incidents or onboarding.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4724
telemetry_validated: false
required_fields:
- EventCode
- TargetUserName
- SubjectUserName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4724

    | eval actor=coalesce(SubjectUserName, src_user)

    | eval target=coalesce(TargetUserName, user)

    | stats count as resets dc(target) as users values(target) as user_list by actor,
    host

    | where resets >= 5 AND users >= 5

    '
