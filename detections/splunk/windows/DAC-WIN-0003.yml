id: DAC-WIN-0003
title: Kerberoasting RC4 TGS burst
description: Security 4769 TicketEncryptionType=0x17; burst distinct ServiceName
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - Credential Access
  techniques:
  - T1558.003
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TargetUserName
- ServiceName
- IpAddress
- TicketEncryptionType
- Status
telemetry_validated: false
false_positives:
- Legacy RC4 apps
- batch SPN jobs
references:
- https://attack.mitre.org/techniques/T1558/003/
- rules/windows/builtin/security/win_security_kerberoasting_activity.yml
tags:
- phase1
- windows
- P0
- ad-auth
query:
  splunk: '`windows_security` EventCode=4769 TicketEncryptionType=0x17

    | search NOT TargetUserName="*$" NOT ServiceName="krbtgt*"

    | bin _time span=15m

    | stats dc(ServiceName) AS spn_count by _time TargetUserName IpAddress

    | where spn_count > 10

    '
