id: DAC-WIN-0074
title: Windows Defender disabled or configuration changed (Defender Operational)
description: Detects Defender operational events associated with disabling or configuration changes that
  may indicate defense evasion.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog
- WinEventLog
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
severity: high
false_positives:
- IT-driven Defender policy changes.
references:
- https://learn.microsoft.com/microsoft-365/security/defender-endpoint/troubleshoot-microsoft-defender-antivirus
- https://attack.mitre.org/resources/updates/updates-april-2026/
telemetry_validated: false
required_fields:
- EventCode
- Message
- host
query:
  splunk: '(sourcetype=XmlWinEventLog OR sourcetype=WinEventLog) source="*Microsoft-Windows-Windows Defender/Operational"
    ((EventCode=5001 OR EventID=5001) OR (EventCode=5007 OR EventID=5007) OR (EventCode=5010 OR EventID=5010)
    OR (EventCode=5012 OR EventID=5012))

    | eval EventCode=coalesce(EventCode, EventID)

    | eval msg=lower(coalesce(Message))

    | stats count values(msg) as messages by host

    '
tags:
- attack-v19-remap
