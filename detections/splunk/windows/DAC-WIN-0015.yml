id: DAC-WIN-0015
title: Security tooling / Sysmon / audit tamper
description: 1102; 4719; Sysmon 4/16/255
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: critical
mitre:
  tactics:
  - Defense Evasion
  techniques:
  - T1562.001
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
- WinEventLog:System
- XmlWinEventLog:System
required_fields:
- SubjectUserName
- SubjectDomainName
- CategoryId
- SubcategoryGuid
- AuditPolicyChanges
- State
- Version
- SchemaVersion
- Configuration
- ConfigurationFileHash
telemetry_validated: false
false_positives:
- Sysmon upgrades
- authorized audit changes
references:
- https://attack.mitre.org/techniques/T1562/001/
- rules/windows/builtin/security/win_security_audit_log_cleared.yml
tags:
- phase1
- windows
- P0
- defense-evasion
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security
    OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational)
    (`windows_security` EventCode IN (1102,4719)) OR (`windows_sysmon` EventCode IN
    (4,16,255)) OR (`windows_system` EventCode IN (7036,7040))

    | table _time host EventCode SubjectUserName Image

    '
