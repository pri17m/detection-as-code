id: DAC-WIN-0086
title: '[Sigma→Splunk] Office spawns command interpreter'
description: 'Sigma-derived detection converted/implemented for Splunk. Source: DAC-SIG-0002.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - execution
  techniques:
  - T1204
severity: medium
false_positives:
- Tune by allowlisting known admin tooling or software installers.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
telemetry_validated: false
required_fields:
- EventCode
- CommandLine
- NewProcessName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4688

    | eval proc=lower(coalesce(NewProcessName, process_path, Image))

    | eval parent=lower(coalesce(ParentProcessName, Creator_Process_Name, parent_process_name))

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | where match(parent,"(winword|excel|powerpnt|outlook)\\.exe") AND match(proc,"(cmd|powershell|pwsh|wscript|cscript)\\.exe")

    | stats count values(cmd) as commands values(parent) as parents by host, SubjectUserName

    '
sigma:
  path: SigmaHQ:windows/process_creation/office_spawns_shell.yml
