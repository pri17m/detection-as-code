id: DAC-WIN-0094
title: '[Sigma→Splunk] Netsh disable firewall'
description: 'Sigma-derived detection converted/implemented for Splunk. Source: DAC-SIG-0010.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - execution
  techniques:
  - T1562.004
severity: medium
false_positives:
- Tune by allowlisting known admin tooling or software installers.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
telemetry_validated: false
required_fields:
- EventCode
- CommandLine
- NewProcessName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4688

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | where match(cmd,"netsh\\.exe.*advfirewall.*state\\s+off")

    | stats count values(cmd) as commands by host, SubjectUserName

    '
sigma:
  path: /workspace/detections/sigma/DAC-SIG-0010-netsh-disable-firewall.yaml
