id: DAC-WIN-0089
title: '[Sigma→Splunk] Rundll32 comsvcs minidump'
description: 'Sigma-derived detection converted/implemented for Splunk. Source: DAC-SIG-0005.'
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Security
mitre:
  tactics:
  - execution
  techniques:
  - T1003
severity: medium
false_positives:
- Tune by allowlisting known admin tooling or software installers.
references:
- https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
telemetry_validated: false
required_fields:
- EventCode
- CommandLine
- NewProcessName
query:
  splunk: 'sourcetype=WinEventLog:Security EventCode=4688

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | where match(cmd,"rundll32\\.exe.*comsvcs\\.dll.*minidump")

    | stats count values(cmd) as commands by host, SubjectUserName

    '
sigma:
  path: SigmaHQ:windows/process_creation/rundll32_comsvcs_minidump.yml
