severity: low
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational")

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/powershell/powershell_classic/posh_pc_download_via_webclient.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_classic/posh_pc_download_via_webclient.yml
- https://attack.mitre.org/techniques/T1059/001/
- https://attack.mitre.org/techniques/T1105/
platforms:
- splunk
tags:
- sigma-wave1
- P0
- windows_powershell_operational
- sigma:rules/windows/powershell/powershell_classic/posh_pc_download_via_webclient.yml
title: PowerShell Download Via Net.WebClient - PowerShell Classic
author: Detection Engineer
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
id: DAC-WIN-0227
description: 'Detects PowerShell download activity, via the .DownloadFile() or .DownloadString() methods
  of the Net.WebClient class.

  This technique is often abused by attackers to download additional payloads.'
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
  - T1105
required_fields:
- EventCode
false_positives:
- This activity may be used by legitimate software, such as patch management tools or software updaters.
  Investigate any such activity and apply the necessary filter.
status: experimental
