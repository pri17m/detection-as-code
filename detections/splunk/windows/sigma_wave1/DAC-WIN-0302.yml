severity: high
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) (EventCode=1 OR EventID=1)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/process_creation/proc_creation_win_bitsadmin_download_file_sharing_domains.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bitsadmin_download_file_sharing_domains.yml
- https://attack.mitre.org/techniques/T1197/
- https://attack.mitre.org/techniques/T1036/003/
- https://attack.mitre.org/techniques/T1105/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_sysmon
- sigma:rules/windows/process_creation/proc_creation_win_bitsadmin_download_file_sharing_domains.yml
title: Suspicious Download From File-Sharing Website Via Bitsadmin
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0302
description: Detects usage of bitsadmin downloading a file from a suspicious domain
mitre:
  tactics:
  - execution
  techniques:
  - T1197
  - T1036.003
  - T1105
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
false_positives:
