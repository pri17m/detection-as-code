severity: medium
query:
  splunk: '(sourcetype=XmlWinEventLog:Security OR sourcetype=WinEventLog:Security) EventCode=4624

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/builtin/security/account_management/win_security_successful_external_remote_rdp_login.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_successful_external_remote_rdp_login.yml
- https://attack.mitre.org/techniques/T1021/001/
- https://attack.mitre.org/techniques/T1133/
- https://attack.mitre.org/techniques/T1078/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_security
- sigma:rules/windows/builtin/security/account_management/win_security_successful_external_remote_rdp_login.yml
title: External Remote RDP Logon from Public IP
author: Detection Engineer
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
id: DAC-WIN-0269
description: Detects successful logon from public IP address via RDP. This can indicate a publicly-exposed
  RDP port.
mitre:
  tactics:
  - lateral-movement
  - credential-access
  techniques:
  - T1021.001
  - T1133
  - T1078
  - T1110
required_fields:
- EventCode
- LogonType
- TargetUserName
false_positives:
- Legitimate or intentional inbound connections from public IP addresses on the RDP port.
status: experimental
