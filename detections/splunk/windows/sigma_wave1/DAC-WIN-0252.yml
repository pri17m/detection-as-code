severity: high
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) EventCode=10

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load.yml
- https://attack.mitre.org/techniques/T1003/001/
- https://attack.mitre.org/techniques/T1685/
platforms:
- splunk
tags:
- sigma-wave1
- P0
- windows_sysmon
- sigma:rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load.yml
title: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0252
description: 'Detects suspicious process access to LSASS.exe from processes located in uncommon locations
  with dbgcore.dll or dbghelp.dll in the call trace.

  These DLLs contain functions like MiniDumpWriteDump that can be abused for credential dumping purposes.
  While modern tools like Mimikatz have moved to using ntdll.dll,

  dbgcore.dll and dbghelp.dll are still used by basic credential dumping utilities and legacy tools for
  LSASS memory access and process suspension techniques.'
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.001
  - T1685
required_fields:
- EventCode
- SourceImage
- TargetImage
- GrantedAccess
false_positives:
- Possibly during software installation or update processes
status: experimental
