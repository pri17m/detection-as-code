- WinEventLog:Security
- XmlWinEventLog:Security
id: DAC-WIN-0276
description: Detect AD credential dumping using impacket secretdump HKTL
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.002
  - T1003.004
  - T1003.003
required_fields:
