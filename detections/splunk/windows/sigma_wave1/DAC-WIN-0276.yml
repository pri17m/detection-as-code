severity: high
query:
  splunk: '(sourcetype=XmlWinEventLog:Security OR sourcetype=WinEventLog:Security) (EventCode=5145 OR
    EventID=5145)

    | search ShareName="\\\\\*\\ADMIN$"

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/builtin/security/win_security_impacket_secretdump.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_impacket_secretdump.yml
- https://attack.mitre.org/techniques/T1003/002/
- https://attack.mitre.org/techniques/T1003/004/
- https://attack.mitre.org/techniques/T1003/003/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_security
- sigma:rules/windows/builtin/security/win_security_impacket_secretdump.yml
title: Possible Impacket SecretDump Remote Activity
author: Detection Engineer
