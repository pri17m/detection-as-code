title: AMSI Disabled via Registry Modification
platforms:
- splunk
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) EventCode=13

    | search Details="DWORD (0x00000000)"

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | table _time host EventCode user process

    | `comment("sigma-wave1b from rules/windows/registry/registry_set/registry_set_amsi_disable.yml")`

    '
tags:
- sigma-wave1b
- P1
- windows_sysmon
- sigma:rules/windows/registry/registry_set/registry_set_amsi_disable.yml
- validation-pending
required_fields:
- EventCode
- Details
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1685
id: DAC-WIN-0324
status: experimental
description: 'Detects attempts to disable AMSI (Anti-Malware Scan Interface) by modifying the AmsiEnable
  registry value.

  Anti-Malware Scan Interface (AMSI) is a security feature in Windows that allows applications and services
  to integrate with anti-malware products for enhanced protection against malicious content.

  Adversaries may attempt to disable AMSI to evade detection by security software, allowing them to execute
  malicious scripts or code without being scanned.'
false_positives:
- Unlikely
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_amsi_disable.yml
- https://attack.mitre.org/techniques/T1685/
author: Detection Engineer
severity: high
telemetry_validated: false
