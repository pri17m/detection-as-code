severity: medium
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) (EventCode=3 OR EventID=3)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/network_connection/net_connection_win_susp_outbound_kerberos_connection.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/network_connection/net_connection_win_susp_outbound_kerberos_connection.yml
- https://attack.mitre.org/techniques/T1558/
- https://attack.mitre.org/techniques/T1550/003/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_sysmon
- sigma:rules/windows/network_connection/net_connection_win_susp_outbound_kerberos_connection.yml
title: Uncommon Outbound Kerberos Connection
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0300
description: Detects uncommon outbound network activity via Kerberos default port indicating possible
  lateral movement or first stage PrivEsc via delegation.
mitre:
  tactics:
  - credential-access
  techniques:
  - T1558
  - T1550.003
required_fields:
- EventCode
- Image
- DestinationIp
false_positives:
- Web Browsers and third party application might generate similar activity. An initial baseline is required.
status: experimental
