- sigma:rules/windows/process_creation/proc_creation_win_conhost_headless_powershell.yml
title: Powershell Executed From Headless ConHost Process
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0254
description: 'Detects the use of powershell commands from headless ConHost window.

  The "--headless" flag hides the windows from the user upon execution.'
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
  - T1059.003
  - T1564.003
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
false_positives:
- Unknown
status: experimental
