severity: medium
query:
  splunk: '(sourcetype=XmlWinEventLog:Security OR sourcetype=WinEventLog:Security) EventCode=4825

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/builtin/security/win_security_not_allowed_rdp_access.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_not_allowed_rdp_access.yml
- https://attack.mitre.org/techniques/T1021/001/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_security
- sigma:rules/windows/builtin/security/win_security_not_allowed_rdp_access.yml
title: Denied Access To Remote Desktop
author: Detection Engineer
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
id: DAC-WIN-0280
description: 'This event is generated when an authenticated user who is not allowed to log on remotely
  attempts to connect to this computer through Remote Desktop.

  Often, this event can be generated by attackers when searching for available windows servers in the
  network.'
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.001
required_fields:
- EventCode
false_positives:
- Valid user was not added to RDP group
status: experimental
