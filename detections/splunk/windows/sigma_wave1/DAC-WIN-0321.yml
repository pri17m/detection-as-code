title: Removal Of AMSI Provider Registry Keys
platforms:
- splunk
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) EventCode=12

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | table _time host EventCode user process

    | `comment("sigma-wave1b from rules/windows/registry/registry_delete/registry_delete_removal_amsi_registry_key.yml")`

    '
tags:
- sigma-wave1b
- P1
- windows_sysmon
- sigma:rules/windows/registry/registry_delete/registry_delete_removal_amsi_registry_key.yml
- validation-pending
required_fields:
- EventCode
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1685
id: DAC-WIN-0321
status: experimental
description: Detects the deletion of AMSI provider registry key entries in HKLM\Software\Microsoft\AMSI.
  This technique could be used by an attacker in order to disable AMSI inspection.
false_positives:
- Unlikely
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_delete/registry_delete_removal_amsi_registry_key.yml
- https://attack.mitre.org/techniques/T1685/
author: Detection Engineer
severity: high
telemetry_validated: false
