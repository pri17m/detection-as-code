severity: medium
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) EventCode=1

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/process_creation/proc_creation_win_certutil_encode.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_encode.yml
- https://attack.mitre.org/techniques/T1027/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_sysmon
- sigma:rules/windows/process_creation/proc_creation_win_certutil_encode.yml
title: File Encoded To Base64 Via Certutil.EXE
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0306
description: Detects the execution of certutil with the "encode" flag to encode a file to base64. This
  can be abused by threat actors and attackers for data exfiltration
mitre:
  tactics:
  - execution
  techniques:
  - T1027
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
false_positives:
- As this is a general purpose rule, legitimate usage of the encode functionality will trigger some false
  positives. Apply additional filters accordingly
status: experimental
