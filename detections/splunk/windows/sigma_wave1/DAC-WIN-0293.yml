severity: medium
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) (EventCode=7 OR EventID=7)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/image_load/image_load_side_load_dbghelp.yml; fieldsummary
    before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_side_load_dbghelp.yml
- https://attack.mitre.org/techniques/T1574/
- https://attack.mitre.org/techniques/T1574/001/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_sysmon
- sigma:rules/windows/image_load/image_load_side_load_dbghelp.yml
title: Potential DLL Sideloading Of DBGHELP.DLL
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0293
description: Detects potential DLL sideloading of "dbghelp.dll"
mitre:
  tactics:
  - persistence
  techniques:
  - T1574
  - T1574.001
required_fields:
- EventCode
- Image
- ImageLoaded
false_positives:
- Legitimate applications loading their own versions of the DLL mentioned in this rule
status: experimental
