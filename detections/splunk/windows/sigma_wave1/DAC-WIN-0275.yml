severity: high
query:
  splunk: '(sourcetype=XmlWinEventLog:Security OR sourcetype=WinEventLog:Security) EventCode=4720

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/builtin/security/win_security_hidden_user_creation.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_hidden_user_creation.yml
- https://attack.mitre.org/techniques/T1136/001/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_security
- sigma:rules/windows/builtin/security/win_security_hidden_user_creation.yml
title: Hidden Local User Creation
author: Detection Engineer
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
id: DAC-WIN-0275
description: Detects the creation of a local hidden user account which should not happen for event ID
  4720.
mitre:
  tactics:
  - execution
  techniques:
  - T1136.001
required_fields:
- EventCode
false_positives:
- Unknown
status: experimental
