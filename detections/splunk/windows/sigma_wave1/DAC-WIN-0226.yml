severity: medium
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational")

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/powershell/powershell_classic/posh_pc_downgrade_attack.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_classic/posh_pc_downgrade_attack.yml
- https://attack.mitre.org/techniques/T1059/001/
platforms:
- splunk
tags:
- sigma-wave1
- P0
- windows_powershell_operational
- sigma:rules/windows/powershell/powershell_classic/posh_pc_downgrade_attack.yml
title: PowerShell Downgrade Attack - PowerShell
author: Detection Engineer
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
id: DAC-WIN-0226
description: Detects PowerShell downgrade attack by comparing the host versions with the actually used
  engine version 2.0
mitre:
  tactics:
  - execution
  techniques:
  - T1059.001
required_fields:
- EventCode
false_positives:
- Unknown
status: experimental
