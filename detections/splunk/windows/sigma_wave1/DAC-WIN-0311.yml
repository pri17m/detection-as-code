severity: high
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) EventCode=1

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/process_creation/proc_creation_win_forfiles_child_process_masquerading.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_forfiles_child_process_masquerading.yml
- https://attack.mitre.org/techniques/T1036/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_sysmon
- sigma:rules/windows/process_creation/proc_creation_win_forfiles_child_process_masquerading.yml
title: Forfiles.EXE Child Process Masquerading
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0311
description: Detects the execution of "forfiles" from a non-default location, in order to potentially
  spawn a custom "cmd.exe" from the current working directory.
mitre:
  tactics:
  - execution
  techniques:
  - T1036
required_fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
false_positives:
- Unknown
status: experimental
