severity: medium
query:
  splunk: '(sourcetype=XmlWinEventLog:Security OR sourcetype=WinEventLog:Security) EventCode=5136

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/builtin/security/win_security_default_domain_gpo_modification.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_default_domain_gpo_modification.yml
- https://attack.mitre.org/techniques/T1484/001/
platforms:
- splunk
tags:
- sigma-wave1
- P1
- windows_security
- sigma:rules/windows/builtin/security/win_security_default_domain_gpo_modification.yml
title: Windows Default Domain GPO Modification
author: Detection Engineer
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
id: DAC-WIN-0272
description: 'Detects modifications to Default Domain or Default Domain Controllers Group Policy Objects
  (GPOs).

  Adversaries may modify these default GPOs to deploy malicious configurations across the domain.'
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1484.001
required_fields:
- EventCode
false_positives:
- Legitimate modifications to Default Domain or Default Domain Controllers GPOs
status: experimental
