severity: medium
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational")

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | eval cmdline=coalesce(CommandLine, process_command_line, cmdline)

    | table _time host EventCode user process cmdline

    | `comment("sigma-wave1 from rules/windows/powershell/powershell_module/posh_pm_alternate_powershell_hosts.yml;
    fieldsummary before telemetry_validated")`

    '
telemetry_validated: false
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_module/posh_pm_alternate_powershell_hosts.yml
- https://attack.mitre.org/techniques/T1059/001/
platforms:
- splunk
tags:
- sigma-wave1
- P0
- windows_powershell_operational
- sigma:rules/windows/powershell/powershell_module/posh_pm_alternate_powershell_hosts.yml
title: Alternate PowerShell Hosts - PowerShell Module
author: Detection Engineer
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
id: DAC-WIN-0238
description: Detects alternate PowerShell hosts potentially bypassing detections looking for powershell.exe
mitre:
