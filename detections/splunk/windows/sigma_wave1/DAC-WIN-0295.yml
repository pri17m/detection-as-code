- sigma:rules/windows/network_connection/net_connection_win_rdp_outbound_over_non_standard_tools.yml
title: Outbound RDP Connections Over Non-Standard Tools
author: Detection Engineer
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
id: DAC-WIN-0295
description: 'Detects Non-Standard tools initiating a connection over port 3389 indicating possible lateral
  movement.

  An initial baseline is required before using this utility to exclude third party RDP tooling that you
  might use.'
mitre:
  tactics:
  - lateral-movement
  techniques:
  - T1021.001
required_fields:
- EventCode
- Image
- DestinationIp
false_positives:
- Third party RDP tools
status: experimental
