title: Allow RDP Remote Assistance Feature
platforms:
- splunk
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) (EventCode=13 OR EventID=13)

    | search Details="DWORD (0x00000001)"

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | table _time host EventCode user process

    | `comment("sigma-wave1b from rules/windows/registry/registry_set/registry_set_allow_rdp_remote_assistance_feature.yml")`

    '
tags:
- sigma-wave1b
- P1
- windows_sysmon
- sigma:rules/windows/registry/registry_set/registry_set_allow_rdp_remote_assistance_feature.yml
- validation-pending
required_fields:
- EventCode
- Details
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - persistence
  techniques:
  - T1112
id: DAC-WIN-0322
status: experimental
description: Detect enable rdp feature to allow specific user to rdp connect on the targeted machine
false_positives:
- Legitimate use of the feature (alerts should be investigated either way)
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_allow_rdp_remote_assistance_feature.yml
- https://attack.mitre.org/techniques/T1112/
author: Detection Engineer
severity: medium
telemetry_validated: false
