title: Classes Autorun Keys Modification
platforms:
- splunk
query:
  splunk: '(sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
    OR sourcetype=sysmon) (EventCode=13 OR EventID=13)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval user=coalesce(TargetUserName, Account_Name, User, SubjectUserName, user)

    | eval process=coalesce(Image, NewProcessName, process)

    | table _time host EventCode user process

    | `comment("sigma-wave1b from rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_classes.yml")`

    '
tags:
- sigma-wave1b
- P1
- windows_sysmon
- sigma:rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_classes.yml
- validation-pending
required_fields:
- EventCode
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - persistence
  techniques:
  - T1547.001
id: DAC-WIN-0325
status: experimental
description: 'Detects modification of Windows Registry Classes keys used for persistence.

  Adversaries modify these autostart extensibility points (ASEP) to execute malicious code when file types
  are opened or actions are performed.

  Various legitimate software also uses these keys. Currently, this rule only filters out known legitimate
  software paths,

  thus it is recommended to review and tune filters for your environment to reduce false positives before
  deploying to production.'
false_positives:
- Legitimate software automatically (mostly, during installation) sets up autorun keys for legitimate
  reason
- Legitimate administrator sets up autorun keys for legitimate reason
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_classes.yml
- https://attack.mitre.org/techniques/T1547/001/
author: Detection Engineer
severity: medium
telemetry_validated: false
