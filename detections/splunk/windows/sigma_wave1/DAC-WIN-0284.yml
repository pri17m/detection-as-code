title: No Suitable Encryption Key Found For Generating Kerberos Ticket
author: Detection Engineer
sourcetypes:
- WinEventLog:System
- XmlWinEventLog:System
id: DAC-WIN-0284
description: 'Detects errors when a target server doesn''t have suitable keys for generating kerberos
  tickets.

  This issue can occur for example when a service uses a user account or a computer account that is configured
  for only DES encryption on a computer that is running Windows 7 which has DES encryption for Kerberos
  authentication disabled.'
mitre:
  tactics:
  - credential-access
  techniques:
  - T1558.003
required_fields:
- EventCode
false_positives:
- Unknown
status: experimental
