id: DAC-WIN-0008
title: Suspicious PowerShell (enc/IEX/remote)
description: PowerShell ScriptBlock (4104) and/or Sysmon ProcessCreate (1) indicators for -enc/IEX/download patterns
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - Execution
  techniques:
  - T1059.001
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- sysmon
- sysmon:*
required_fields:
- ScriptBlockText
- ScriptBlockId
- Path
- MessageNumber
- MessageTotal
- SubjectUserName
- Image
- CommandLine
- ParentImage
- User
- ProcessGuid
- Hashes
telemetry_validated: false
false_positives:
- Legitimate administrative scripts, automation, or software deployment tooling
references:
- https://attack.mitre.org/techniques/T1059/001/
tags:
- phase1
- windows
- P0
- process
query:
  splunk: '(`windows_powershell_operational` EventCode=4104

    | eval script=coalesce(ScriptBlockText,"")
    | search script="*EncodedCommand*" OR script="*FromBase64String*" OR script="*IEX*" OR script="*Invoke-Expression*"
      OR script="*DownloadString*" OR script="*WebClient*" OR script="*Invoke-WebRequest*" OR script="*Start-BitsTransfer*"

    | eval user=coalesce(SubjectUserName, User)
    | table _time host user ScriptBlockId Path MessageNumber MessageTotal ScriptBlockText

    )
    OR
    (`windows_sysmon` EventCode=1 Image="*\\\\powershell.exe"

    | search CommandLine="*-enc*" OR CommandLine="*EncodedCommand*" OR CommandLine="*FromBase64String*"
      OR CommandLine="* IEX *" OR CommandLine="*Invoke-Expression*" OR CommandLine="*DownloadString*"
      OR CommandLine="*WebClient*" OR CommandLine="*Invoke-WebRequest*" OR CommandLine="*Start-BitsTransfer*"

    | eval user=coalesce(User, SubjectUserName)
    | table _time host user Image CommandLine ParentImage ProcessGuid Hashes

    )'

