id: DAC-WIN-0363
title: "Machine Root/AuthRoot certificate registry key written by an unexpected process (Sysmon 12/13)"
description: >-
  Sysmon Event ID 12 (key create) or 13 (Blob value set) under
  HKLM\SOFTWARE\[Policies\]Microsoft\{SystemCertificates|EnterpriseCertificates}\{Root|AuthRoot}\Certificates\<thumbprint>
  by any Image except non-LOLBin binaries in System32/SysWOW64 and Windows\WinSxS|CCM|ccmsetup. Tool-agnostic
  (certutil, certmgr, Import-Certificate, reg import, custom CryptoAPI). Severity high when the writer runs from
  ProgramData, Users, Windows\Temp or PerfLogs, or is a LOLBin. Mirrors the Sigma registry_set and Elastic rules.
  Requires a Sysmon config that logs these keys. telemetry_validated false.
  Hardened: msiexec, mmc and dllhost in System32 are no longer excluded (medium). See REVIEW.md variant matrix.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
- "WinEventLog:Microsoft-Windows-Sysmon/Operational"
- "sysmon"
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1553.004
severity: medium
false_positives:
- "Third-party software in Program Files that installs its own root (TLS-inspection proxies, AV web shields, Fiddler, VPN clients); alerts at medium - allowlist by InitiatingProcessSHA256/Image plus folder after measuring (not measured)."
- "Group Policy and Windows root auto-update write these keys from svchost.exe in System32 and are excluded by the System32 non-LOLBin rule; if your tenant shows other System32 writers, extend the exclusion deliberately."
- "MDM/SCCM agents under Windows\\CCM are excluded; other management agents (Intune IME, Tanium, BigFix) may need allowlisting."
references:
- https://attack.mitre.org/techniques/T1553/004/
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_install_root_or_ca_certificat.yml
- https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_create_mod_root_certificate.toml
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
- https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1553.004/T1553.004.md
telemetry_validated: false
required_fields:
- "_time"
- "host"
- "EventCode"
- "User"
- "Image"
- "TargetObject"
- "ProcessGuid"
tags:
- behavioural
- root-ca
- registry
- windows_sysmon
- needs-review
query:
  splunk: |
    (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype=sysmon) (EventCode=12 OR EventCode=13 OR EventID=12 OR EventID=13)
    | eval EventCode=coalesce(EventCode, EventID)
    | where match(TargetObject, "(?i)^(HKLM|HKEY_LOCAL_MACHINE|\\\\REGISTRY\\\\MACHINE)\\\\SOFTWARE\\\\(Policies\\\\)?Microsoft\\\\(SystemCertificates|EnterpriseCertificates)\\\\(Root|AuthRoot)\\\\Certificates\\\\[0-9A-F]{40}(\\\\Blob)?$")
    | where (EventCode=12 AND NOT match(TargetObject, "(?i)\\\\Blob$")) OR (EventCode=13 AND match(TargetObject, "(?i)\\\\Blob$"))
    | eval proc=lower(replace(Image, "^.*\\\\", ""))
    | eval sys_dir=if(match(Image, "(?i)^[a-z]:\\\\windows\\\\(system32|syswow64)\\\\"), 1, 0)
    | eval lolbin=if(proc IN ("certutil.exe","certmgr.exe","reg.exe","rundll32.exe","regsvr32.exe","mshta.exe","powershell.exe","pwsh.exe","cmd.exe","cscript.exe","wscript.exe","wmiprvse.exe","expand.exe","xcopy.exe","msiexec.exe","mmc.exe","dllhost.exe"), 1, 0)
    | where NOT (sys_dir=1 AND lolbin=0)
    | where NOT match(Image, "(?i)^[a-z]:\\\\windows\\\\(winsxs|ccm|ccmsetup)\\\\")
    | rex field=TargetObject "(?i)\\\\Certificates\\\\(?<thumbprint>[0-9A-F]{40})"
    | eval user_writable=if(match(Image, "(?i)^[a-z]:\\\\(programdata|users|windows\\\\temp|perflogs)\\\\"), 1, 0)
    | eval admin_tool=if(proc IN ("msiexec.exe","mmc.exe","dllhost.exe"), 1, 0)
    | eval severity=if(user_writable=1 OR (lolbin=1 AND admin_tool=0), "high", "medium")
    | table _time host EventCode User Image TargetObject thumbprint severity user_writable lolbin ProcessGuid
