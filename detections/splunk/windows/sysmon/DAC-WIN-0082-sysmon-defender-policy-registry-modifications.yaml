id: DAC-WIN-0082
title: 'Sysmon: Defender policy registry modifications'
description: Detects registry modifications under Windows Defender policy keys that can indicate attempts
  to impair defenses.
author: DaC
status: experimental
platforms:
- splunk
- google_secops
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - defense-impairment
  techniques:
  - T1685
severity: high
false_positives:
- Legitimate policy enforcement (GPO/Intune); tune by management hosts.
references:
- https://learn.microsoft.com/sysinternals/downloads/sysmon
- https://attack.mitre.org/resources/updates/updates-april-2026/
telemetry_validated: false
required_fields:
- EventCode
- TargetObject
- Image
- host
query:
  splunk: 'sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" (EventCode=13 OR EventID=13)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval obj=lower(coalesce(TargetObject))

    | eval img=lower(coalesce(Image))

    | where match(obj,"\\\\software\\\\policies\\\\microsoft\\\\windows defender\\\\") OR match(obj,"\\\\software\\\\microsoft\\\\windows
    defender\\\\")

    | stats count values(obj) as registry_paths values(img) as images by host, User

    '
  google_secops: |-
    rule dac_win_0082 {
      meta:
        author = "DaC"
        description = "Sysmon: Defender policy registry modifications - Detects registry modifications under Windows Defender policy keys that can indicate attempts to impair defenses."
        severity = "High"
        rule_id = "DAC-WIN-0082"
        source_language = "spl"
        converted_by = "rulebridge"
        mitre_attack_technique = "T1685"

      events:
        ($e.metadata.event_type = "REGISTRY_MODIFICATION" or $e.metadata.event_type = "REGISTRY_CREATION")
        $e.metadata.log_type = "WINDOWS_SYSMON"
        $e.metadata.product_event_type = "13"
        ($e.target.registry.registry_key = /\\software\\policies\\microsoft\\windows defender\\/ nocase or $e.target.registry.registry_key = /\\software\\microsoft\\windows defender\\/ nocase)
        $name = $e.principal.hostname
        $name_ = $e.principal.user.userid

      match:
        $name, $name_ over 1h

      outcome:
        $count = count($e.metadata.id)
        $registry_paths = array_distinct($e.target.registry.registry_key)
        $images = array_distinct($e.principal.process.file.full_path)

      condition:
        $e
    }
tags:
- attack-v19-remap
conversions:
  google_secops:
    converter: rulebridge
    converter_version: 0.1.0
    converter_commit: 2ad2aaa
    source_language: spl
    source_query: query.splunk
    target_language: yaral-2.0
    fidelity: approximate
    score: 0.95
    roundtrip: agree
    syntax_check: pass (RuleBridge YARA-L/UDM structural checker, not Google's compiler)
    mapping_pack: win.registry
    review: approved in detection-engineering review 2026-11-17
    caveats:
    - Splunk stats runs over the whole scheduled search range; YARA-L needs a match window, so 1h was used. Set --window to your search schedule.
    converted_on: '2026-11-17'
