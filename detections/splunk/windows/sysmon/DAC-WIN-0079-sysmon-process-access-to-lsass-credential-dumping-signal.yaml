id: DAC-WIN-0079
title: 'Sysmon: Process access to LSASS (credential dumping signal)'
description: Detects Sysmon process access events targeting LSASS, which can indicate credential dumping.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003
severity: critical
false_positives:
- Some EDR/AV solutions access LSASS; tune by signer and process allowlists.
references:
- https://learn.microsoft.com/sysinternals/downloads/sysmon
telemetry_validated: false
required_fields:
- EventCode
- TargetImage
- SourceImage
- GrantedAccess
- host
query:
  splunk: 'sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" (EventCode=10 OR EventID=10)

    | eval EventCode=coalesce(EventCode, EventID)

    | eval tgt=lower(coalesce(TargetImage))

    | eval src=lower(coalesce(SourceImage))

    | where match(tgt,"\\\\lsass\\.exe$")

    | stats count values(src) as sources values(GrantedAccess) as access by host, User

    '
