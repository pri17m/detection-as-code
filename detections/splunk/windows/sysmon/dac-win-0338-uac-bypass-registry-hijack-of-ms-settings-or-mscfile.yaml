id: DAC-WIN-0338
title: UAC bypass registry hijack of ms-settings or mscfile
description: >-
  fodhelper, computerdefaults, and eventvwr auto-elevate and then run the command stored in HKCU
  Software\Classes\ms-settings\shell\open\command. sdclt uses mscfile\shell\open\command
  (T1548.002). A hit is Sysmon seeing a value set on either of those keys. Ordinary Run keys do
  not match. Telemetry is Sysmon event 13, a registry value set. The search keys off TargetObject,
  Details, and Image. Offline command-line samples were replayed: the documented malicious lines
  match and the documented benign lines do not. telemetry_validated stays false until this search
  is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1548.002
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- TargetObject
- Details
- Image
telemetry_validated: false
false_positives:
- "Security test tooling that plants the bypass key in a lab. Not expected on user workstations."
references:
- https://attack.mitre.org/techniques/T1548/002/
- https://learn.microsoft.com/sysinternals/downloads/sysmon
tags:
- quality-wave
- parity:DAC-MDE-0071
query:
  splunk: |
    sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13
    | eval obj=lower(coalesce(TargetObject))
    | eval img=lower(coalesce(Image))
    | eval details=lower(coalesce(Details))
    | where match(obj, "\\software\\classes\\(ms-settings|mscfile)\\shell\\open\\command")
    | stats count values(obj) as registry_paths values(details) as details values(img) as images by host, User
