id: DAC-WIN-0338
title: UAC bypass registry hijack of ms-settings or mscfile
description: >-
  Alerts when a command is written to the ms-settings or mscfile shell-open key in the
  current-user registry. Attackers set that value, then start fodhelper, computerdefaults,
  eventvwr, or sdclt so Windows auto-elevates and runs their command.
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1548.002
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
required_fields:
- EventCode
- TargetObject
- Details
- Image
telemetry_validated: false
false_positives:
- "Security test tooling that plants the bypass key in a lab. Not expected on user workstations."
references:
- https://attack.mitre.org/techniques/T1548/002/
- https://learn.microsoft.com/sysinternals/downloads/sysmon
tags:
- quality-wave
- parity:DAC-MDE-0071
query:
  splunk: |
    sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13
    | eval obj=lower(coalesce(TargetObject))
    | eval img=lower(coalesce(Image))
    | eval details=lower(coalesce(Details))
    | where match(obj, "\\software\\classes\\(ms-settings|mscfile)\\shell\\open\\command")
    | stats count values(obj) as registry_paths values(details) as details values(img) as images by host, User
