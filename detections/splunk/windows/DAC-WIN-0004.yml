id: DAC-WIN-0004
title: AS-REP roasting (PreAuthType 0)
description: Security 4768 PreAuthType=0
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - Credential Access
  techniques:
  - T1558.004
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- TargetUserName
- IpAddress
- TicketEncryptionType
- Status
telemetry_validated: false
false_positives:
- Accounts without Kerberos preauth (allowlist ideally empty)
references:
- https://attack.mitre.org/techniques/T1558/004/
- rules/windows/builtin/security/win_security_kerberos_asrep_roasting.yml
tags:
- phase1
- windows
- P0
- ad-auth
query:
  splunk: '`windows_security` EventCode=4768

    | search PreAuthType=0 OR PreAuthType="0"

    | search NOT TargetUserName="*$"

    | table _time host TargetUserName IpAddress TicketEncryptionType Status PreAuthType

    '
