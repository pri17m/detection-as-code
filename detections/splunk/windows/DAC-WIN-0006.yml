id: DAC-WIN-0006
title: Pass-the-Hash NTLM Type 3 anomalies
description: 4624 LogonType=3 AuthenticationPackage=NTLM
author: Detection Engineer
status: experimental
platforms:
- splunk
severity: high
mitre:
  tactics:
  - Lateral Movement
  techniques:
  - T1550.002
sourcetypes:
- WinEventLog:Security
- XmlWinEventLog:Security
required_fields:
- LogonType
- TargetUserName
- IpAddress
- WorkstationName
telemetry_validated: false
false_positives:
- Legacy NTLM service accounts
references:
- https://attack.mitre.org/techniques/T1550/002/
- rules/windows/builtin/security/account_management/win_security_pass_the_hash_2.yml
tags:
- phase1
- windows
- P0
- logon
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security)
    `windows_security` EventCode=4624 LogonType=3

    | search AuthenticationPackageName="NTLM" OR Authentication_Package="NTLM"

    | search NOT TargetUserName="*$"

    | table _time host TargetUserName IpAddress WorkstationName LogonType

    '
