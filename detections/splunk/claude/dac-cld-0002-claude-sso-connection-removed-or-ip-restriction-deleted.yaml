id: DAC-CLD-0002
title: Claude SSO connection removed or IP restriction deleted
description: >-
  Alerts when an admin deactivates or deletes the Claude SSO connection, or deletes an
  organization IP restriction. Attackers remove those controls so a later sign-in does not have to
  pass the identity provider or come from an approved network.
author: Detection Engineer
status: experimental
platforms:
  - splunk
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
sourcetypes:
  - anthropic:compliance:activity
required_fields:
  - event_type
  - actor_email
  - actor_ip_address
  - organization_id
telemetry_validated: false
false_positives:
  - "A planned identity-provider cutover or a retirement of an old office IP range. org_sso_toggled is not included, because this sourcetype does not keep whether SSO was turned on or off."
references:
  - https://platform.claude.com/docs/en/manage-claude/compliance-activity-feed
  - https://github.com/splunk-platform-apps/anthropic_compliance_app_for_splunk
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - quality-wave
  - claude-compliance
query:
  splunk: |
    sourcetype="anthropic:compliance:activity" event_type IN ("org_sso_connection_deactivated", "org_sso_connection_deleted", "org_ip_restriction_deleted")
    | stats count values(event_type) as events values(actor_ip_address) as source_ips values(actor_user_id) as actor_ids by actor_email organization_id
