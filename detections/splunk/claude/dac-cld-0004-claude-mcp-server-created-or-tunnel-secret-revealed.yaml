id: DAC-CLD-0004
title: Claude MCP server created or tunnel secret revealed
description: >-
  Alerts when an MCP server or MCP tunnel is created, or when the tunnel connector secret or
  management token is revealed or minted. Attackers add that connector, or take the secret, so a
  Claude session sends tool traffic to a server they control.
author: Detection Engineer
status: experimental
platforms:
  - splunk
severity: high
mitre:
  tactics:
  - persistence
  - credential-access
  techniques:
  - T1098
  - T1528
sourcetypes:
  - anthropic:compliance:activity
required_fields:
  - event_type
  - actor_email
  - actor_ip_address
  - organization_id
telemetry_validated: false
false_positives:
  - "A platform team registering an approved MCP server or rotating a tunnel secret. Allowlist that actor_email."
references:
  - https://platform.claude.com/docs/en/manage-claude/compliance-activity-feed
  - https://github.com/splunk-platform-apps/anthropic_compliance_app_for_splunk
  - https://attack.mitre.org/techniques/T1528/
tags:
  - quality-wave
  - claude-compliance
query:
  splunk: |
    sourcetype="anthropic:compliance:activity" event_type IN ("mcp_server_created", "tunnel_created", "tunnel_token_revealed", "tunnel_token_minted")
    | stats count values(event_type) as events values(actor_ip_address) as source_ips values(actor_user_id) as actor_ids by actor_email organization_id
