id: DAC-BT-0002
title: 'BeyondTrust RS/PRA: successful admin-interface login from a first-seen source network for an established user'
description: Detects a successful BeyondTrust /login or /appliance login (event=login status=success, target web/login or web/appliance) where the user/source /24 (IPv4) or exact IPv6 address was never seen in a 30-day lookback and the user has at least 7 days of history. ARMORY CASTLE logged in to the web admin portal with compromised Administrator credentials after exploiting CVE-2026-102764.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- beyondtrust:sra
mitre:
  tactics:
  - initial-access
  - persistence
  techniques:
  - T1078
severity: medium
false_positives:
- Admins travelling, new VPN egress IPs, or DHCP churn on admin workstations. Tune with an allowlist of corporate egress ranges.
- The first login of a user created in the last 7 days is suppressed by design (needs history; new users are DAC-BT-0003 / DAC-BT-0001 territory).
references:
- https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust
- https://nvd.nist.gov/vuln/detail/CVE-2026-102764
- https://docs.beyondtrust.com/rs/docs/events
- https://docs.beyondtrust.com/rs/docs/message-format
- https://docs.beyondtrust.com/pra/docs/events
- https://splunk.github.io/splunk-connect-for-syslog/main/sources/vendor/BeyondTrust/sra/
telemetry_validated: false
required_fields:
- event
- status
- target
- who
- who_ip
- site
tags:
- beyondtrust
- remote-support
- pra
- bomgar
- first-seen
query:
  splunk: 'sourcetype=beyondtrust:sra event=login status=success (target="web/login" OR target="web/appliance") earliest=-30d@d latest=now

    | rex field=who "\\((?<bt_user>[^()]*)\\)(\\s+using\\s+.*)?$"

    | eval actor=lower(trim(bt_user))

    | where isnotnull(actor) AND actor!="" AND actor!="unknown" AND isnotnull(who_ip)

    | eval src_net=if(match(who_ip, "^\\d{1,3}(\\.\\d{1,3}){3}$"), replace(who_ip, "\\.\\d{1,3}$", ".0/24"), who_ip)

    | stats min(_time) as firstTime max(_time) as lastTime count values(who_ip) as who_ip values(target) as target by site, actor, src_net

    | eventstats min(firstTime) as actor_first_seen dc(src_net) as actor_known_nets by site, actor

    | where firstTime >= relative_time(now(), "-24h") AND actor_first_seen < relative_time(now(), "-7d")

    '
