id: DAC-VMW-0026
title: PowerShell creates the ESX Admins group
description: Detects a PowerShell 4104 script block that calls New-ADGroup or New-LocalGroup for a group named ESX Admins. That is the PowerShell form of the CVE-2024-37085 group recreate.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- WinEventLog:Microsoft-Windows-PowerShell/Operational
- XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
mitre:
  tactics:
  - persistence
  - execution
  techniques:
  - T1136.001
  - T1136.002
  - T1059.001
severity: high
false_positives:
- A VMware administrator creating the ESX Admins group on purpose. CVE-2024-37085 is abused by recreating that exact group, so confirm the actor and the domain controller.
references:
- https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_esx_admins_group_creation_via_powershell.yml
- https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/
- https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/24505
telemetry_validated: false
required_fields:
- EventCode
- ScriptBlockText
tags:
- vmware
- esx-admins
- cve-2024-37085
- escu
query:
  splunk: '(sourcetype=WinEventLog:Microsoft-Windows-PowerShell/Operational OR sourcetype=XmlWinEventLog:Microsoft-Windows-PowerShell/Operational) (EventCode=4104 OR EventID=4104)

    | eval script=coalesce(ScriptBlockText, Message)

    | where match(script, "(?i)(New-ADGroup|New-LocalGroup)") AND match(script, "(?i)ESX Admins")

    | stats count min(_time) as firstTime max(_time) as lastTime values(script) as script_blocks by host, User, user_id

    '
