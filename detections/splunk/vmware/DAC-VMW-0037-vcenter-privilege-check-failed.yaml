id: DAC-VMW-0037
title: vCenter privilege check failed
description: Detects vCenter vpxd lines containing Privilege check failed for user (typically on vim.event.EventEx warning events). Spec assigned no ATT&CK technique; T1078 is recorded because this is an authorization failure (valid or invalid account exercising privileges it lacks). Low severity hunt signal, not a page.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- vmware:vclog
- vmware:vclog:*
mitre:
  tactics:
  - discovery
  - privilege-escalation
  techniques:
  - T1078
severity: low
false_positives:
- Missing role privileges during normal operations are very noisy. Use for hunting missing permissions, not paging.
references:
- https://knowledge.broadcom.com/external/article/382378/locate-missing-role-privileges-on-vcente.html
- https://splunkbase.splunk.com/app/5601
- https://splunk.github.io/splunk-connect-for-syslog/3.11.0/sources/vendor/VMWare/vsphere/
telemetry_validated: false
required_fields:
- _raw
tags:
- vmware
- vcenter
- vclog
query:
  splunk: '(sourcetype=vmware:vclog OR sourcetype=vmware:vclog:*) (Message="*Privilege check failed for user*" OR _raw="*Privilege check failed for user*")

    | stats count min(_time) as firstTime max(_time) as lastTime values(_raw) as sample by host

    '
