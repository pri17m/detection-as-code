id: DAC-VMW-0025
title: Windows net.exe creates the ESX Admins group
description: Detects net.exe or net1.exe adding a group whose name is ESX Admins, from Security 4688 or Sysmon process creation. That is the command-line form of the CVE-2024-37085 group recreate.
author: DaC
status: experimental
platforms:
- splunk
sourcetypes:
- XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Microsoft-Windows-Sysmon/Operational
- WinEventLog:Security
- XmlWinEventLog:Security
- sysmon
mitre:
  tactics:
  - persistence
  techniques:
  - T1136.001
  - T1136.002
severity: high
false_positives:
- A VMware administrator creating the ESX Admins group on purpose. CVE-2024-37085 is abused by recreating that exact group, so confirm the actor and the domain controller.
references:
- https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_esx_admins_group_creation_via_net.yml
- https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/
- https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/24505
telemetry_validated: false
required_fields:
- EventCode
- CommandLine
tags:
- vmware
- esx-admins
- cve-2024-37085
- escu
query:
  splunk: '(sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=sysmon) (EventCode=4688 OR EventCode=1)

    | eval proc=lower(coalesce(NewProcessName, Image, process_path))

    | eval cmd=lower(coalesce(CommandLine, Process_Command_Line, cmdline))

    | where match(proc, "(^|\\)net1?\.exe$") AND match(cmd, "group") AND match(cmd, "esx admins") AND match(cmd, "/add")

    | stats count min(_time) as firstTime max(_time) as lastTime values(cmd) as commands values(proc) as processes by host, SubjectUserName, User

    '
