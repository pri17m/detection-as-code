id: DAC-MDE-0117
title: 'MDE: SQL Server (sqlservr.exe) or MySQL / MariaDB (mysqld, mariadbd) starts a command shell'
description: 'Attack phase: execution on a database server, usually right after SQL injection, stolen database credentials
  or a stored-procedure or UDF abuse. DeviceProcessEvents where the parent is sqlservr.exe, mysqld, mysqld.exe, mysqld-nt.exe
  or mariadbd and the child is cmd, powershell, pwsh, sh, bash, dash or zsh, on Windows or Linux. Microsoft documents that
  xp_cmdshell ''spawns a Windows command shell'' running as the SQL Server service account; MySQL has no xp_cmdshell, and
  attackers load malicious UDF libraries to run commands instead (AhnLab ASEC). ThreatDefence Hunt 11 lists sqlservr and mysqld
  among the service processes ARTEX operators drove to start shells; the repo already covers PHP, IIS and Java/Tomcat parents
  (DAC-MDE-0096, DAC-MDE-0106) but not database engines. Microsoft''s 5 Nov 2026 agentic-abuse post is wider ARTEX context.
  A database engine rarely needs a shell, so one event alerts. telemetry_validated false.'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - persistence
  - execution
  - initial-access
  techniques:
  - T1505.001
  - T1059.003
  - T1059.001
  - T1059.004
  - T1190
severity: high
false_positives:
- DBAs or legacy jobs that use xp_cmdshell on purpose (file moves, backups to shares). Microsoft ships it disabled; where
  it is enabled, allowlist the instance and command after review. Volume not measured.
- Vendor database instances that call a shell from the engine as part of the product. SigmaHQ 869b9ca7 lists one optional
  filter for a DATEV SQL Server instance under C:\Program Files\Microsoft SQL Server\...\DATEV_DBENGINE starting cmd.exe;
  add similar exclusions only after review.
- 'Veeam''s bundled SQL instance (VEEAMSQL in the command line) is flagged as a column, not excluded: SigmaHQ d55b793d treats
  Veeam database children as suspicious (FIN7 targeting).'
