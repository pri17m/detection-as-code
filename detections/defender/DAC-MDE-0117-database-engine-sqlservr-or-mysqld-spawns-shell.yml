telemetry_validated: false
required_fields:
- Timestamp
- DeviceId
- DeviceName
- InitiatingProcessFileName
- InitiatingProcessFolderPath
- InitiatingProcessCommandLine
- InitiatingProcessAccountName
- FileName
- FolderPath
- ProcessCommandLine
- AccountName
- AccountDomain
- ReportId
tags:
- behavioural
- clean-room
- artex
- database
- xp_cmdshell
- agentic-attack
query:
  defender: |
    let Lookback = 1d;
    let DbEngines = dynamic(["sqlservr.exe", "mysqld.exe", "mysqld-nt.exe", "mysqld", "mariadbd.exe", "mariadbd"]);
    let Shells = dynamic(["cmd.exe", "powershell.exe", "pwsh.exe", "pwsh", "sh", "bash", "dash", "zsh"]);
    DeviceProcessEvents
    | where Timestamp > ago(Lookback)
    | where InitiatingProcessFileName in~ (DbEngines)
    | where FileName in~ (Shells)
    | extend Engine = case(InitiatingProcessFileName =~ "sqlservr.exe", "mssql", "mysql-family"),
        VeeamInstance = InitiatingProcessCommandLine has "VEEAMSQL"
    | project Timestamp, DeviceId, DeviceName, Engine, VeeamInstance, InitiatingProcessFileName, InitiatingProcessFolderPath,
        InitiatingProcessCommandLine, InitiatingProcessAccountName, FileName, FolderPath, ProcessCommandLine, AccountName,
        AccountDomain, ReportId
    | order by Timestamp asc
