id: DAC-MDE-0068
title: hh.exe opening a remote URL
description: >-
  hh.exe is HTML Help. Opening a local CHM is normal. Opening an http, https, or ftp URL lets it
  fetch a remote CHM or script (T1218.001). A hit requires the image to be hh.exe and the command
  line to contain one of those URL schemes. A path such as C:\Windows\Help\aclui.chm does not
  match. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName, ProcessCommandLine,
  and InitiatingProcessFileName. Offline command-line samples were replayed: the documented
  malicious lines match and the documented benign lines do not. telemetry_validated stays false
  until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.001
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "A help desk that opens a vendor CHM over HTTPS."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Hh/
- https://attack.mitre.org/techniques/T1218/001/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0335
- parity:DAC-CS-0214
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "hh.exe" and (ProcessCommandLine contains "http://" or ProcessCommandLine contains "https://" or ProcessCommandLine contains "ftp://")
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
