id: DAC-MDE-0073
title: fsutil usn deletejournal
description: >-
  fsutil usn deletejournal removes the NTFS change journal, which wipes a forensic timeline
  (T1070). A hit requires fsutil.exe and the usn deletejournal verb. usn readjournal and other
  fsutil verbs do not match. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName,
  ProcessCommandLine, and InitiatingProcessFileName. Offline command-line samples were replayed:
  the documented malicious lines match and the documented benign lines do not. telemetry_validated
  stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: medium
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1070
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Disk-maintenance scripts that rebuild the USN journal."
references:
- https://learn.microsoft.com/windows-server/administration/windows-commands/fsutil-usn
- https://attack.mitre.org/techniques/T1070/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0340
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "fsutil.exe" and ProcessCommandLine contains "usn" and ProcessCommandLine contains "deletejournal"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
