id: DAC-MDE-0077
title: explorer.exe launched with a search-ms URI
description: "DeviceProcessEvents for explorer.exe with a search-ms: URI. Predicate checked against documented malicious and benign command lines. telemetry_validated stays false until an org replays the search on its own telemetry."
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - initial-access
  techniques:
  - T1204.001
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "An internal app that deep-links Windows Search."
references:
- https://learn.microsoft.com/windows/win32/search/-search-3x-wds-extidx-prot-implementing
- https://attack.mitre.org/techniques/T1204/001/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0344
- parity:DAC-CS-0222
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "explorer.exe" and ProcessCommandLine contains "search-ms:"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
