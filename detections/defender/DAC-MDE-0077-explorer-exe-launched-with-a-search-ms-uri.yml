id: DAC-MDE-0077
title: explorer.exe launched with a search-ms URI
description: >-
  explorer.exe started with a search-ms: URI opens a Windows Search window, often pointed at a
  remote share, which phishing has used as the lure (T1204.001). A hit is explorer.exe plus that
  URI. Opening a folder path does not match. Telemetry is Defender Advanced Hunting
  DeviceProcessEvents: FileName, ProcessCommandLine, and InitiatingProcessFileName. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - initial-access
  techniques:
  - T1204.001
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "An internal app that deep-links Windows Search."
references:
- https://learn.microsoft.com/windows/win32/search/-search-3x-wds-extidx-prot-implementing
- https://attack.mitre.org/techniques/T1204/001/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0344
- parity:DAC-CS-0222
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "explorer.exe" and ProcessCommandLine contains "search-ms:"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
