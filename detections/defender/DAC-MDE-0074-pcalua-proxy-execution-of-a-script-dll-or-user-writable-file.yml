id: DAC-MDE-0074
title: pcalua proxy execution of a script, DLL, or user-writable file
description: >-
  pcalua.exe is the Program Compatibility Assistant and can be told to launch another file with -a
  (T1202). A hit requires -a and a DLL, CPL, script, URL, UNC path, or a file under Users, Temp,
  Public, AppData, or ProgramData. Launching a binary from Program Files or System32 does not
  match. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName, ProcessCommandLine,
  and InitiatingProcessFileName. Offline command-line samples were replayed: the documented
  malicious lines match and the documented benign lines do not. telemetry_validated stays false
  until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1202
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "A compatibility shim that launches a vendor binary stored under a user profile."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Pcalua/
- https://attack.mitre.org/techniques/T1202/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0341
- parity:DAC-CS-0219
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "pcalua.exe"
    | where ProcessCommandLine matches regex @"(\s|^)-a(\s|$)"
    | where ProcessCommandLine contains @"\\"
        or ProcessCommandLine has_any (@"\Users\", @"\Temp\", @"\Public\", @"\AppData\", @"\ProgramData\", ".dll", ".cpl", ".js", ".vbs", ".hta", ".bat", ".ps1", "http://", "https://")
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
