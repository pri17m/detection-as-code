author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1003/003/
title: 'MDE: ntdsutil or vssadmin ntds/IFM'
description: DeviceProcessEvents on servers
severity: high
telemetry_validated: false
platforms:
- defender
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-MDE-0016
status: experimental
tags:
- wave-a
- P0
- parity:DAC-WIN-0104
query:
  defender: "DeviceProcessEvents\n| where FileName in~ (\"ntdsutil.exe\",\"vssadmin.exe\",\"diskshadow.exe\"\
    )\n   or ProcessCommandLine has_any (\"ntds.dit\",\"IFM\")\n| project Timestamp, DeviceName, AccountName,\
    \ FileName, ProcessCommandLine\n"
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.003
