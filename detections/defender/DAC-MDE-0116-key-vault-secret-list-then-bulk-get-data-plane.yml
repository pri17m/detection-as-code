id: DAC-MDE-0116
title: 'Azure Key Vault (data plane): a caller lists secrets and then reads 5 or more of them, or lists 3 or more vaults,
  in 10 minutes, first time in 14 days'
description: 'Attack phase: credential access from a cloud secret store after an application credential is stolen. AZKVAuditLogs
  (Key Vault resource-specific diagnostic table) SecretList, SecretListVersions and SecretGet, grouped by caller (token appid,
  else object ID, else UPN) in 10-minute bins. Alerts when a caller lists secrets and then reads 5 or more distinct secrets
  with HTTP 200, or lists secrets in 3 or more vaults, and that caller never listed secrets in the previous 14 days. Apps
  that read their own secrets by name do not list them, so the list step is the tell. The Microsoft 5 Nov 2026 post describes
  agents exfiltrating secrets from Key Vault, in one case five minutes after finding the client secret on GitHub, and enumerating
  secret metadata across multiple vaults; ThreatDefence Hunt 7 covers bulk Key Vault reads. This uses the data-plane table
  that DAC-AZ-0014 should have used (AZ-0014 searches the Activity log). telemetry_validated false.'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- sentinel:AZKVAuditLogs
mitre:
  tactics:
  - credential-access
  techniques:
  - T1555.006
severity: high
false_positives:
- Secret-sync and inventory tools (for example a secrets-scanning or backup job, or Kubernetes secret-store drivers configured
  to sync everything) that list and read many secrets. They usually do it daily, so the 14-day baseline drops them; a new
  tool fires once.
- Administrators browsing a vault in the portal for the first time in two weeks and opening several secrets. Check the caller.
- Thresholds (5 secrets, 3 vaults, 10 minutes, 14 days) are unmeasured starting points.
references:
- https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
- https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azkvauditlogs
- https://learn.microsoft.com/en-us/azure/key-vault/general/logging
- https://attack.mitre.org/techniques/T1555/006/
telemetry_validated: false
required_fields:
- TimeGenerated
- OperationName
- Identity
- _ResourceId
- HttpStatusCode
- Id
- CallerIpAddress
- ClientInfo
tags:
- behavioural
- clean-room
- artex
- azure
- key-vault
- agentic-attack
query:
  defender: |
    let Lookback = 1d;
    let Window = 10m;
    let BaselineDays = 14d;
    let MinSecretsRead = 5;
    let MinVaultsListed = 3;
    let KvSecretOps = (StartTime:datetime, EndTime:datetime) {
        AZKVAuditLogs
        | where TimeGenerated between (StartTime .. EndTime)
        | where OperationName in ("SecretList", "SecretListVersions", "SecretGet")
        | extend Caller = coalesce(tostring(Identity.claim.appid),
            tostring(Identity.claim["http://schemas.microsoft.com/identity/claims/objectidentifier"]),
            tostring(Identity.claim["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"]),
            tostring(Identity))
        | extend Vault = tolower(_ResourceId), Status = toint(HttpStatusCode),
            SecretName = tolower(extract(@"/secrets/([^/?]+)", 1, tostring(Id)))
    };
    // callers that already listed secrets in the baseline period
    let KnownListers = KvSecretOps(ago(Lookback + BaselineDays), ago(Lookback))
    | where OperationName startswith "SecretList" and Status == 200
    | distinct Caller;
    KvSecretOps(ago(Lookback), now())
    | summarize Lists = countif(OperationName startswith "SecretList"),
        VaultsListed = dcountif(Vault, OperationName startswith "SecretList"),
        SecretsRead = dcountif(strcat(Vault, "/", SecretName), OperationName == "SecretGet" and Status == 200 and isnotempty(SecretName)),
        Denied = countif(Status in (401, 403)), Vaults = make_set(Vault, 10),
        SampleSecrets = make_set_if(SecretName, OperationName == "SecretGet", 20),
        SourceIPs = make_set(CallerIpAddress, 10), Clients = make_set(ClientInfo, 5),
        FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
        by Caller, bin(TimeGenerated, Window)
    | where Lists >= 1 and (SecretsRead >= MinSecretsRead or VaultsListed >= MinVaultsListed)
    | join kind=leftanti KnownListers on Caller
    | order by SecretsRead desc
