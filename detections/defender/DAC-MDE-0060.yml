author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1036/005/
title: 'MDE: critical binary path masquerading'
description: DeviceProcessEvents FolderPath
severity: high
telemetry_validated: false
platforms:
- defender
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-MDE-0060
status: experimental
tags:
- wave-a
- P0
- parity:DAC-CS-0061
query:
  defender: 'DeviceProcessEvents

    | where FileName =~ "svchost.exe" and FolderPath !has @"Windows\System32"

    | project Timestamp, DeviceName, FolderPath, ProcessCommandLine

    '
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1036.005
