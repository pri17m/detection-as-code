id: DAC-MDE-0085
title: Non-browser process from a user-writable path touching multiple browser credential stores
description: 'Combines DeviceProcessEvents command lines that reference browser credential stores (Chromium Login Data, Local State, Cookies; Firefox key4.db, logins.json) under browser profile paths, and DeviceFileEvents FileCreated copies of those file names outside the profile folders. The actor must be a non-browser process running from Temp, Downloads, Public, ProgramData or AppData\Roaming. Alerts when one actor (SHA1) touches 2 or more stores or shows both command-line and copy evidence. DeviceFileEvents has no read events, so direct API reads are a blind spot. Unconfirmed: the Chromium file names Login Data, Local State and Cookies (not in Chromium''s public docs) and the FileCreated ActionType value (listed only in the in-portal schema).'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - credential-access
  techniques:
  - T1555.003
  - T1539
severity: high
false_positives:
- Backup or browser-migration tools run from user folders; allowlist by SHA1 after review.
references:
- https://attack.mitre.org/techniques/T1555/003/
- https://attack.mitre.org/techniques/T1539/
- https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
- https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicefileevents-table
- https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md
- https://support.mozilla.org/en-US/kb/recovering-important-data-from-an-old-profile
telemetry_validated: false
required_fields:
- Timestamp
- DeviceId
- DeviceName
- ActionType
- FileName
- FolderPath
- SHA1
- ProcessCommandLine
- AccountName
- InitiatingProcessFileName
- InitiatingProcessFolderPath
- InitiatingProcessSHA1
- InitiatingProcessAccountName
tags:
- behavioural
- clean-room
- wave2
- needs-review
query:
  defender: |
    let Lookback = 1d;
    let StoreNames = dynamic(["Login Data", "Local State", "Cookies", "key4.db", "logins.json"]);
    let ProfileMarkers = dynamic([@"\Google\Chrome\User Data\", @"\Microsoft\Edge\User Data\", @"\BraveSoftware\Brave-Browser\User Data\", @"\Mozilla\Firefox\Profiles\"]);
    let Browsers = dynamic(["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe"]);
    let UserWritable = dynamic([@"\AppData\Local\Temp\", @"\Downloads\", @"\Users\Public\", @"\ProgramData\", @"\AppData\Roaming\"]);
    let CmdEvidence = DeviceProcessEvents
    | where Timestamp > ago(Lookback)
    | where ProcessCommandLine has_any (StoreNames) and ProcessCommandLine has_any (ProfileMarkers)
    | where FileName !in~ (Browsers)
    | where FolderPath has_any (UserWritable) or InitiatingProcessFolderPath has_any (UserWritable)
    | project Timestamp, DeviceId, DeviceName, Account = AccountName, Actor = FileName, ActorPath = FolderPath, ActorSHA1 = SHA1, Evidence = ProcessCommandLine, Source = "cmdline";
    let CopyEvidence = DeviceFileEvents
    | where Timestamp > ago(Lookback)
    | where ActionType == "FileCreated"
    | where FileName in~ (StoreNames)
    | where not(FolderPath has_any (ProfileMarkers))
    | where InitiatingProcessFileName !in~ (Browsers)
    | where InitiatingProcessFolderPath has_any (UserWritable)
    | project Timestamp, DeviceId, DeviceName, Account = InitiatingProcessAccountName, Actor = InitiatingProcessFileName, ActorPath = InitiatingProcessFolderPath, ActorSHA1 = InitiatingProcessSHA1, Evidence = FolderPath, Source = "copy";
    union CmdEvidence, CopyEvidence
    | summarize Sources = make_set(Source), Evidence = make_set(Evidence, 20), Stores = dcount(Evidence), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceId, DeviceName, Account, Actor, ActorPath, ActorSHA1
    | where Stores >= 2 or array_length(Sources) == 2
