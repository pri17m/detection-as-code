id: DAC-MDE-0064
title: Citrix NetScaler/ADC process spawning shell or writing web shell
description: "Behavioural detection for Citrix NetScaler/ADC/Gateway post-exploitation: parent processes whose names match NSPPE/nsconfig/netscaler/citrix gateway binaries spawning shells/interpreters, or file creates of script web shells under web-accessible paths. Collapses vulnerability-check hunts into one behaviour rule."
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- "mde:advanced_hunting"
mitre:
  tactics:
  - initial-access
  - persistence
  - execution
  techniques:
  - T1190
  - T1505.003
  - T1059
severity: critical
false_positives:
- Vendor support sessions and appliance upgrades that invoke shells — allowlist change windows and management jump hosts.
- "Tuning knob: require FolderPath under /netscaler/ /var/netscaler/ or inetpub for file branch."
references:
- "https://learn.microsoft.com/microsoft-365/security/defender/advanced-hunting-deviceprocessevents-table"
- "https://learn.microsoft.com/microsoft-365/security/defender/advanced-hunting-devicefileevents-table"
- "https://attack.mitre.org/techniques/T1190/"
- "https://attack.mitre.org/techniques/T1505/003/"
telemetry_validated: false
required_fields:
- Timestamp
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
- FolderPath
- ActionType
tags:
- wave1
- netscaler
- webshell
query:
  defender: |
    let shells = dynamic(["cmd.exe","powershell.exe","pwsh.exe","bash","sh","python","python3","perl","php","nc.exe","ncat.exe","curl.exe","wget.exe"]);
    let parents = DeviceProcessEvents
    | where InitiatingProcessFileName has_any ("nsppe","nsconfig","netscaler","nscli","citrix","adc")
    | where FileName in~ (shells) or ProcessCommandLine has_any ("/bin/sh","/bin/bash","-c ","Invoke-","wget ","curl ")
    | project Timestamp, DeviceName, Branch="proc-spawn", FileName, ProcessCommandLine, InitiatingProcessFileName, FolderPath=InitiatingProcessFolderPath, ActionType="ProcessCreated";
    let webshells = DeviceFileEvents
    | where ActionType in ("FileCreated","FileModified")
    | where FolderPath has_any ("netscaler","vpn/www","httpaccess","inetpub","htdocs","nsconfig")
    | where FileName endswith ".php" or FileName endswith ".jsp" or FileName endswith ".aspx" or FileName endswith ".pl" or FileName =~ "shell.cgi"
    | where InitiatingProcessFileName has_any ("nsppe","nsconfig","netscaler","python","perl","php","bash","sh","cmd.exe")
    | project Timestamp, DeviceName, Branch="webshell-write", FileName, ProcessCommandLine=InitiatingProcessCommandLine, InitiatingProcessFileName, FolderPath, ActionType;
    union parents, webshells
    | project Timestamp, DeviceName, Branch, FileName, ProcessCommandLine, InitiatingProcessFileName, FolderPath, ActionType
