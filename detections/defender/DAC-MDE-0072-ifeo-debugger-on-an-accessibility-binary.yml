id: DAC-MDE-0072
title: IFEO debugger on an accessibility binary
description: >-
  Setting the Debugger value under Image File Execution Options makes Windows launch that debugger
  instead of sethc, utilman, osk, magnify, narrator, displayswitch, or atbroker. At the logon
  screen that yields a SYSTEM shell (T1546.008). A hit is that Debugger value on one of those
  binaries. An IFEO key for notepad, or GlobalFlag on sethc, does not match. Telemetry is Defender
  Advanced Hunting DeviceRegistryEvents: RegistryKey, RegistryValueName, and RegistryValueData.
  ActionType is not filtered, because that enum is tenant-specific. Offline command-line samples
  were replayed: the documented malicious lines match and the documented benign lines do not.
  telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - persistence
  - privilege-escalation
  techniques:
  - T1546.008
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- RegistryKey
- RegistryValueName
- RegistryValueData
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "An assistive-technology vendor that installs a debugger on Narrator or Magnifier."
references:
- https://attack.mitre.org/techniques/T1546/008/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceregistryevents-table
tags:
- quality-wave
- parity:DAC-WIN-0339
query:
  defender: |
    DeviceRegistryEvents
    | where RegistryKey contains @"\Image File Execution Options\"
    | where RegistryValueName =~ "Debugger"
    | where RegistryKey has_any ("sethc.exe", "utilman.exe", "osk.exe", "magnify.exe", "narrator.exe", "displayswitch.exe", "atbroker.exe")
    | project Timestamp, DeviceName, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName
