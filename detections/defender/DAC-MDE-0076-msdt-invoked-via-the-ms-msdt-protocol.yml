id: DAC-MDE-0076
title: msdt invoked via the ms-msdt protocol
description: >-
  CVE-2022-30190 (Follina) launches msdt.exe through the ms-msdt: protocol (T1203). A hit requires
  that protocol string. The normal troubleshooter command msdt.exe /id PCWDiagnostic does not
  match. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName, ProcessCommandLine,
  and InitiatingProcessFileName. Offline command-line samples were replayed: the documented
  malicious lines match and the documented benign lines do not. telemetry_validated stays false
  until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - execution
  techniques:
  - T1203
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "A custom protocol handler that still calls ms-msdt after the 2022 hardening."
references:
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-30190
- https://attack.mitre.org/techniques/T1203/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0343
- parity:DAC-CS-0221
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "msdt.exe" and ProcessCommandLine contains "ms-msdt:"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
