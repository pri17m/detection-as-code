id: DAC-MDE-0006
title: Scheduled task creation via schtasks
description: Detects schtasks creating or modifying scheduled tasks, commonly used
  for persistence.
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - persistence
  techniques:
  - T1053.005
severity: medium
false_positives:
- Legitimate admin automation and software updaters.
references:
- https://learn.microsoft.com/microsoft-365/security/defender/advanced-hunting-deviceprocessevents-table
telemetry_validated: false
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
query:
  defender: 'DeviceProcessEvents

    | where FileName =~ "schtasks.exe"

    | where ProcessCommandLine has_any ("/create","/change","/run")

    | project Timestamp, DeviceName, AccountName, ProcessCommandLine, InitiatingProcessFileName

    '
