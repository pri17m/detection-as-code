author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1105/
title: 'MDE: certutil download or decode'
description: extend starter
severity: high
telemetry_validated: false
platforms:
- defender
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-MDE-0057
status: experimental
tags:
- wave-a
- P0
- parity:DAC-MDE-0009
query:
  defender: 'DeviceProcessEvents

    | where FileName =~ "certutil.exe" and ProcessCommandLine has_any ("urlcache","-decode","http")

    | project Timestamp, DeviceName, ProcessCommandLine

    '
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - command-and-control
  techniques:
  - T1105
