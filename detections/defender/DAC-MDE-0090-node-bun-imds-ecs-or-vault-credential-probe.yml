id: DAC-MDE-0090
title: Node or Bun process contacting two or more of IMDS, ECS credentials, and local Vault
description: >-
  Alerts when one Node or Bun process (DeviceId + process id + creation time)
  reaches at least two of: 169.254.169.254 (cloud instance metadata),
  169.254.170.2 (ECS task credentials), and 127.0.0.1:8200 (local HashiCorp Vault)
  within 10 minutes. Matches Shai-Hulud credential probing described by Endor Labs
  and StepSecurity. Based on detections.ai rule
  https://detections.ai/rules/01a130ac-767f-7552-9156-c9c685959b90 by Unknown.
  telemetry_validated false; not run in a tenant.
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - credential-access
  techniques:
  - T1552.005
severity: high
false_positives:
- Node services on EC2/ECS that also talk to a local Vault agent; allowlist those service accounts or command lines after measuring noise (not measured).
references:
- https://detections.ai/rules/01a130ac-767f-7552-9156-c9c685959b90
- https://attack.mitre.org/techniques/T1552/005/
- https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html
- https://developer.hashicorp.com/vault/docs/agent-and-proxy/agent
- https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicenetworkevents-table
telemetry_validated: false
required_fields:
- Timestamp
- DeviceId
- DeviceName
- InitiatingProcessId
- InitiatingProcessCreationTime
- InitiatingProcessFileName
- InitiatingProcessCommandLine
- InitiatingProcessParentFileName
- RemoteIP
- RemotePort
tags:
- behavioural
- credential-access
- shai-hulud
- needs-review
- detections-ai
query:
  defender: |
    let Lookback = 1d;
    DeviceNetworkEvents
    | where Timestamp > ago(Lookback)
    | where InitiatingProcessFileName in~ ("node", "node.exe", "bun", "bun.exe")
    | where RemoteIP in ("169.254.169.254", "169.254.170.2")
        or (RemoteIP == "127.0.0.1" and RemotePort == 8200)
    | extend Endpoint = case(
        RemoteIP == "169.254.169.254", "IMDS",
        RemoteIP == "169.254.170.2", "ECS_creds",
        "Vault_local")
    | summarize
        Endpoints = make_set(Endpoint, 5),
        EndpointCount = dcount(Endpoint),
        FirstSeen = min(Timestamp),
        LastSeen = max(Timestamp),
        CommandLine = take_any(InitiatingProcessCommandLine),
        ParentProcess = take_any(InitiatingProcessParentFileName)
      by DeviceId, DeviceName, InitiatingProcessId, InitiatingProcessCreationTime, InitiatingProcessFileName
    | where EndpointCount >= 2
    | where datetime_diff("minute", LastSeen, FirstSeen) <= 10
