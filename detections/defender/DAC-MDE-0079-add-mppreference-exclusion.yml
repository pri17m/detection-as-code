id: DAC-MDE-0079
title: Add-MpPreference exclusion
description: >-
  Add-MpPreference can add a path, process, extension, or IP exclusion so Defender stops scanning
  it (T1562.001). A hit is powershell.exe or pwsh.exe with Add-MpPreference and one of those
  exclusion parameters. Set-MpPreference -DisableRealtimeMonitoring is a different rule and does
  not match here. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName,
  ProcessCommandLine, and InitiatingProcessFileName. Offline command-line samples were replayed:
  the documented malicious lines match and the documented benign lines do not. telemetry_validated
  stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1562.001
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Security administrators who add Defender exclusions from PowerShell. Allowlist the management host."
references:
- https://learn.microsoft.com/defender-endpoint/configure-process-opened-file-exclusions-microsoft-defender-antivirus
- https://attack.mitre.org/techniques/T1562/001/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-CS-0224
query:
  defender: |
    DeviceProcessEvents
    | where FileName in~ ("powershell.exe", "pwsh.exe")
    | where ProcessCommandLine contains "Add-MpPreference"
    | where ProcessCommandLine contains "-ExclusionPath"
        or ProcessCommandLine contains "-ExclusionProcess"
        or ProcessCommandLine contains "-ExclusionExtension"
        or ProcessCommandLine contains "-ExclusionIpAddress"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
