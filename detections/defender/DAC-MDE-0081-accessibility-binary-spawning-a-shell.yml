id: DAC-MDE-0081
title: accessibility binary spawning a shell
description: >-
  If an accessibility binary such as sethc or utilman starts cmd or PowerShell, the sticky-keys
  backdoor is in use (T1546.008). A hit is that parent-child pair. Explorer starting cmd does not
  match. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName, ProcessCommandLine,
  and InitiatingProcessFileName. Offline command-line samples were replayed: the documented
  malicious lines match and the documented benign lines do not. telemetry_validated stays false
  until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - persistence
  - privilege-escalation
  techniques:
  - T1546.008
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Assistive technology that launches PowerShell by design."
references:
- https://attack.mitre.org/techniques/T1546/008/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0347
- parity:DAC-CS-0218
query:
  defender: |
    DeviceProcessEvents
    | where InitiatingProcessFileName in~ ("sethc.exe", "utilman.exe", "osk.exe", "magnify.exe", "narrator.exe")
    | where FileName in~ ("cmd.exe", "powershell.exe", "pwsh.exe")
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
