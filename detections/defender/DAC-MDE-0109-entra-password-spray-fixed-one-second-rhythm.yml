id: DAC-MDE-0109
title: 'Entra: password spray with a fixed machine rhythm (median gap 2 seconds or less) from one source and user agent'
description: 'Attack phase: credential access (password spray) before the first foothold. Unions SigninLogs and AADNonInteractiveUserSignInLogs,
  keeps password failures (ResultType 50126 invalid username or password, 50053 locked or blocked), and for each IPAddress
  plus UserAgent pair in a one-hour bin works out the gap between consecutive attempts. Alerts when one pair hits 20 or more
  users with 120 or more attempts and the median gap is 2 seconds or less with the 75th percentile at 3 seconds or less. Wiz
  saw ARTEX-driven sprays against Entra and Okta run in 20 to 60 minute bursts with a strict one-second median gap and a new
  user agent per burst; ThreatDefence Hunt 2 and the Microsoft 5 Nov 2026 post on agentic secret abuse give the wider ARTEX
  context. Any later success from the same pair is added as context and does not change whether the rule fires. The source
  IP is a grouping key only, never a matched indicator. Thresholds are unmeasured starting points. telemetry_validated false.'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- sentinel:SigninLogs
- sentinel:AADNonInteractiveUserSignInLogs
mitre:
  tactics:
  - credential-access
  techniques:
  - T1110.003
severity: high
false_positives:
- A shared egress (proxy, VPN concentrator, VDI pool) where many users fail at once with the same client user agent, for example
  after a forced password reset. The rhythm test (median gap 2 s or less and P75 3 s or less over 120+ attempts) is meant
  to cut this; volume not measured.
- Authorised penetration tests or red-team spray exercises. Suppress the tester's source and user agent for the test window.
- A misconfigured service or sync tool replaying a stale password for many accounts on a timer. Fix the tool; volume not measured.
- Thresholds (20 users, 120 attempts, 2 s median, 3 s P75) are unmeasured starting points taken from one public description,
  not from tenant data.
references:
- https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors
- https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
- https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aadnoninteractiveusersigninlogs
- https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
- https://attack.mitre.org/techniques/T1110/003/
- https://learn.microsoft.com/en-us/kusto/query/prev-function
- https://learn.microsoft.com/en-us/kusto/query/percentiles-aggregation-function
telemetry_validated: false
required_fields:
- TimeGenerated
- ResultType
- UserPrincipalName
- IPAddress
- UserAgent
- AppDisplayName
tags:
- behavioural
- clean-room
- artex
- entra
- password-spray
- agentic-attack
query:
  defender: |
    let Lookback = 1d;
    let MinUsers = 20;
    let MinAttempts = 120;
    let MaxMedianGapSec = 2.0;
    let MaxP75GapSec = 3.0;
    // 50126 = invalid username or password, 50053 = account locked (smart lockout) or blocked source
    let PasswordFailureCodes = dynamic(["50126", "50053"]);
    let SignIns = union isfuzzy=true
        (SigninLogs | where TimeGenerated > ago(Lookback)),
        (AADNonInteractiveUserSignInLogs | where TimeGenerated > ago(Lookback))
    | extend ResultCode = tostring(ResultType), Agent = iff(isempty(UserAgent), "(empty)", UserAgent)
    | where isnotempty(IPAddress);
    let Scored = SignIns
    | where ResultCode in (PasswordFailureCodes)
    | project TimeGenerated, IPAddress, Agent, UserPrincipalName, ResultCode, AppDisplayName
    | sort by IPAddress asc, Agent asc, TimeGenerated asc
    | extend GapSec = iff(IPAddress == prev(IPAddress) and Agent == prev(Agent), (TimeGenerated - prev(TimeGenerated)) / 1s, real(null))
    | extend Hour = bin(TimeGenerated, 1h);
    let Volume = Scored
    | summarize Attempts = count(), Users = dcount(UserPrincipalName), Lockouts = countif(ResultCode == "50053"),
        Apps = make_set(AppDisplayName, 10), SampleUsers = make_set(UserPrincipalName, 25),
        FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by IPAddress, Agent, Hour
    | where Attempts >= MinAttempts and Users >= MinUsers;
    let Rhythm = Scored
    | where isnotnull(GapSec)
    | summarize MedianGapSec = percentile(GapSec, 50), P75GapSec = percentile(GapSec, 75) by IPAddress, Agent, Hour;
    let Successes = SignIns
    | where ResultCode == "0"
    | summarize SuccessCount = count(), SuccessUsers = make_set(UserPrincipalName, 25) by IPAddress, Agent;
    Volume
    | join kind=inner Rhythm on IPAddress, Agent, Hour
    | where MedianGapSec <= MaxMedianGapSec and P75GapSec <= MaxP75GapSec
    | join kind=leftouter Successes on IPAddress, Agent
    | extend SuccessCount = coalesce(SuccessCount, 0)
    | project Hour, IPAddress, Agent, Attempts, Users, MedianGapSec, P75GapSec, Lockouts, SuccessCount, SuccessUsers,
        Apps, SampleUsers, FirstSeen, LastSeen
    | order by Attempts desc
