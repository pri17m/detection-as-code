id: DAC-MDE-0070
title: desktopimgdownldr lockscreen URL outside Microsoft
description: >-
  desktopimgdownldr.exe downloads a lock-screen image. Windows Spotlight calls Microsoft hosts.
  The LOLBAS abuse points /lockscreenurl at an attacker host (T1105). A hit is this image plus
  lockscreenurl, unless the host is microsoft.com, windows.com, live.com, bing.com, msn.com,
  azureedge.net, or microsoftonline.com, including subdomains. A lookalike such as
  microsoft.com.evil.test still matches. Telemetry is Defender Advanced Hunting
  DeviceProcessEvents: FileName, ProcessCommandLine, and InitiatingProcessFileName. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - command-and-control
  techniques:
  - T1105
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "A management tool that sets a custom lock-screen image host."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Desktopimgdownldr/
- https://attack.mitre.org/techniques/T1105/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0337
- parity:DAC-CS-0216
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "desktopimgdownldr.exe"
    | where ProcessCommandLine contains "lockscreenurl"
    | where not(ProcessCommandLine matches regex @"(?i)lockscreenurl:\s*https?://([a-z0-9.-]*\.)?(microsoft\.com|windows\.com|live\.com|bing\.com|msn\.com|azureedge\.net|microsoftonline\.com)([/:?\s]|$)")
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
