id: DAC-MDE-0067
title: odbcconf REGSVR, response file, or driver install
description: >-
  odbcconf.exe is a signed Windows binary that can register a DLL (REGSVR), load a response file
  (-f), or install an ODBC driver. Those arguments are the LOLBAS proxy-execution paths for
  T1218.008. A hit means the command line contains REGSVR, INSTALLDRIVER, configsysdsn, or a -f/-F
  response file. Plain odbcconf /S does not match. Telemetry is Defender Advanced Hunting
  DeviceProcessEvents: FileName, ProcessCommandLine, and InitiatingProcessFileName. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.008
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "ODBC driver installers. Allowlist the installer SHA256."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://attack.mitre.org/techniques/T1218/008/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0334
- parity:DAC-CS-0213
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "odbcconf.exe"
    | where ProcessCommandLine contains "REGSVR"
        or ProcessCommandLine contains "INSTALLDRIVER"
        or ProcessCommandLine contains "configsysdsn"
        or ProcessCommandLine matches regex @"(\s|^)[-/]f(\s|$)"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
