id: DAC-MDE-0113
title: 'Entra: service principal fails with invalid or expired secret (AADSTS7000215 / 7000222), then signs in within an hour'
description: 'Attack phase: initial access with a leaked application credential (credential testing, then a working secret).
  AADServicePrincipalSignInLogs for one AppId: ResultType 7000215 (invalid client secret) or 7000222 (expired client secret),
  then a ResultType 0 success within 60 minutes of the first failure. Fires when that success comes from a source (AppId plus
  IPAddress pair) with no successful sign-in for that app in the previous 14 days, or when there were 3 or more secret failures.
  Microsoft''s 5 Nov 2026 post on agentic abuse of exposed secrets says these two errors ''indicate someone holds a credential
  for your app; a failure followed by a success is urgent''. ThreatDefence Hunt 18 covers the same idea. IP is used only to
  group and to test novelty, never matched against a list. telemetry_validated false.'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- sentinel:AADServicePrincipalSignInLogs
mitre:
  tactics:
  - initial-access
  - credential-access
  techniques:
  - T1078.004
  - T1552.001
severity: high
false_positives:
- 'Planned secret rotation: the app keeps using the old (now expired or removed) secret for a while, then picks up the new
  one. If it runs from a known source and has fewer than 3 failures, it does not fire; otherwise check the change record.'
- Apps on dynamic cloud egress (serverless, autoscaled pools) look like a new source after every scale event. Baseline the
  app or widen the novelty test to a range; volume not measured.
- Window (60 minutes), baseline (14 days) and failure floor (3) are unmeasured starting points.
references:
- https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
- https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aadserviceprincipalsigninlogs
- https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
- https://attack.mitre.org/techniques/T1078/004/
- https://attack.mitre.org/techniques/T1552/001/
telemetry_validated: false
required_fields:
- TimeGenerated
- AppId
- ServicePrincipalId
- ServicePrincipalName
- ResultType
- IPAddress
- UserAgent
- ResourceDisplayName
tags:
- behavioural
- clean-room
- artex
- entra
- workload-identity
- agentic-attack
query:
  defender: |
    let Lookback = 1d;
    let Window = 1h;
    let BaselineDays = 14d;
    let MinFailuresWithoutNewSource = 3;
    // AADSTS7000215 invalid client secret, AADSTS7000222 expired client secret
    let SecretErrors = dynamic(["7000215", "7000222"]);
    let Recent = AADServicePrincipalSignInLogs
    | where TimeGenerated > ago(Lookback)
    | extend ResultCode = tostring(ResultType);
    let Failures = Recent
    | where ResultCode in (SecretErrors)
    | summarize FailCount = count(), FirstFail = min(TimeGenerated), LastFail = max(TimeGenerated), FailCodes = make_set(ResultCode),
        FailIPs = make_set(IPAddress, 10), FailAgents = make_set(UserAgent, 5) by AppId, ServicePrincipalId, ServicePrincipalName;
    let Successes = Recent
    | where ResultCode == "0"
    | project OkTime = TimeGenerated, AppId, OkIP = IPAddress, OkAgent = UserAgent, ResourceDisplayName,
        SourceKey = strcat(AppId, "|", IPAddress);
    // sources (AppId + IP pair) that already signed in successfully for this app in the baseline period; IP is a grouping key only
    let KnownSources = AADServicePrincipalSignInLogs
    | where TimeGenerated between (ago(Lookback + BaselineDays) .. ago(Lookback))
    | where tostring(ResultType) == "0"
    | extend SourceKey = strcat(AppId, "|", IPAddress)
    | distinct SourceKey
    | extend KnownSource = true;
    Failures
    | join kind=inner Successes on AppId
    | where OkTime between (FirstFail .. (FirstFail + Window))
    | join kind=leftouter KnownSources on SourceKey
    | extend NewSource = isnull(KnownSource)
    | summarize FirstSuccess = min(OkTime), Successes = count(), NewSourceSuccesses = countif(NewSource),
        SuccessIPs = make_set(OkIP, 10), SuccessAgents = make_set(OkAgent, 5), Resources = make_set(ResourceDisplayName, 10),
        FailCodes = take_any(FailCodes), FailIPs = take_any(FailIPs), FailAgents = take_any(FailAgents)
        by AppId, ServicePrincipalId, ServicePrincipalName, FailCount, FirstFail, LastFail
    | where NewSourceSuccesses > 0 or FailCount >= MinFailuresWithoutNewSource
    | order by FirstFail asc
