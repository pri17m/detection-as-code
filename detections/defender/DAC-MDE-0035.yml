author: Detection Engineer
references:
- https://attack.mitre.org/techniques/T1218/005/
title: 'MDE: mshta http or javascript URL'
description: DeviceProcessEvents
severity: high
telemetry_validated: false
platforms:
- defender
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
false_positives:
- Tune after baselining; experimental sketch may be noisy.
id: DAC-MDE-0035
status: experimental
tags:
- wave-a
- P0
- parity:DAC-CS-0035
query:
  defender: 'DeviceProcessEvents

    | where FileName =~ "mshta.exe" and ProcessCommandLine has_any ("http","javascript:","vbscript:")

    | project Timestamp, DeviceName, ProcessCommandLine

    '
sourcetypes:
- mde:advanced_hunting
mitre:
  tactics:
  - defense-evasion
  techniques:
  - T1218.005
