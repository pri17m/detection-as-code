id: DAC-MDE-0083
title: Service principal credential added, then the same app reads mailboxes within 24 hours
description: 'Chains three sources: AuditLogs credential additions (Add service principal credentials, or Update application with Certificates and secrets management), AADServicePrincipalSignInLogs to bridge the service principal object ID (ServicePrincipalId) to its AppId and confirm an app-only sign-in after the change, and CloudAppEvents MailItemsAccessed where RawEventData.ClientAppId equals that AppId within 24 hours. A new secret followed by app-only mail reads is the illicit-consent/backdoored-app collection pattern. The Application-object case (TargetResources id is an application object, not a service principal) needs an objectId-to-appId inventory and is not covered.'
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- sentinel:AuditLogs
mitre:
  tactics:
  - persistence
  - collection
  techniques:
  - T1098.001
  - T1114.002
severity: high
false_positives:
- Planned secret rotation for mail-processing apps (archiving, journaling, DLP); allowlist their AppIds.
references:
- https://attack.mitre.org/techniques/T1098/001/
- https://attack.mitre.org/techniques/T1114/002/
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
- https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aadserviceprincipalsigninlogs
- https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-cloudappevents-table
- https://learn.microsoft.com/en-us/purview/audit-log-exchange-properties
telemetry_validated: false
required_fields:
- TimeGenerated
- OperationName
- Result
- TargetResources
- InitiatedBy
- ServicePrincipalId
- AppId
- IPAddress
- ResultType
- ActionType
- RawEventData
- Timestamp
tags:
- behavioural
- clean-room
- wave2
query:
  defender: |
    let Lookback = 2d;
    let Window = 24h;
    let CredAdds = AuditLogs
    | where TimeGenerated > ago(Lookback)
    | where OperationName == "Add service principal credentials" or OperationName has "Certificates and secrets management"
    | where Result =~ "success"
    | extend TargetObjectId = tostring(TargetResources[0].id), TargetName = tostring(TargetResources[0].displayName)
    | extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))
    | project CredTime = TimeGenerated, TargetObjectId, TargetName, Actor, OperationName;
    let SpSignIns = AADServicePrincipalSignInLogs
    | where TimeGenerated > ago(Lookback)
    | where ResultType == "0"
    | project SpTime = TimeGenerated, ServicePrincipalId, AppId, SpIP = IPAddress;
    let MailReads = CloudAppEvents
    | where Timestamp > ago(Lookback)
    | where ActionType == "MailItemsAccessed"
    | extend ClientAppId = tostring(RawEventData.ClientAppId)
    | where isnotempty(ClientAppId)
    | summarize FirstMailRead = min(Timestamp), MailEvents = count(), Mailboxes = dcount(AccountObjectId), MailIPs = make_set(IPAddress, 10) by ClientAppId;
    CredAdds
    | join kind=inner SpSignIns on $left.TargetObjectId == $right.ServicePrincipalId
    | where SpTime between (CredTime .. CredTime + Window)
    | summarize FirstSpSignIn = min(SpTime), SpIPs = make_set(SpIP, 10) by CredTime, TargetObjectId, TargetName, Actor, OperationName, AppId
    | join kind=inner MailReads on $left.AppId == $right.ClientAppId
    | where FirstMailRead between (CredTime .. CredTime + Window)
    | project CredTime, Actor, OperationName, TargetName, TargetObjectId, AppId, FirstSpSignIn, SpIPs, FirstMailRead, MailEvents, Mailboxes, MailIPs
