id: DAC-MDE-0106
title: "Java4Shell: Java or Tomcat service-account process starts cmd or PowerShell"
description: >-
  DeviceProcessEvents where cmd.exe, powershell.exe or pwsh.exe is started by java.exe, javaw.exe, a Commons
  Daemon Tomcat service image (tomcat.exe, tomcat9.exe, tomcat10.exe and the same pattern), or prunsrv.exe, or
  by a parent whose command line contains the procrun //RS// run-service switch, and that parent is running as
  NT AUTHORITY\NETWORK SERVICE or LOCAL SERVICE (SID S-1-5-20 or S-1-5-19). On Windows, Tomcat and many
  Atlassian installers start the JVM inside the procrun service process (StartMode=jvm), so a parent list that
  only has java.exe misses the service binary. A Java or Tomcat process running as a built-in service account
  rarely starts a shell; when it does, it is a common next step after a web-app or Java-runtime RCE. The rule
  does not try to detect the request or memory corruption that led there, and it is not tied to one CVE.
  Install paths that contain \Jenkins\ are excluded because CI agents start shells often. telemetry_validated
  false.
author: DaC
status: experimental
platforms:
- defender
sourcetypes:
- "mde:advanced_hunting"
mitre:
  tactics:
  - initial-access
  - execution
  techniques:
  - T1190
  - T1059.003
  - T1059.001
severity: high
false_positives:
- "Java CI or build agents that run as NETWORK SERVICE or LOCAL SERVICE and whose install path does not contain \\Jenkins\\. Allowlist by InitiatingProcessFolderPath after a baseline (not measured)."
- "Java or Tomcat services that shell out for backups, image conversion, mail or install/upgrade scripts. Allowlist the specific parent path and command line after a baseline (not measured)."
- "service.bat, catalina.bat or similar Tomcat helper scripts. Those are normally started by an administrator, not by the running service process."
references:
- "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table"
- "https://tomcat.apache.org/tomcat-9.0-doc/windows-service-howto.html"
- "https://attack.mitre.org/techniques/T1190/"
- "https://attack.mitre.org/techniques/T1059/003/"
- "https://attack.mitre.org/techniques/T1059/001/"
- "https://community.fortinet.com/fortiedr-20/threat-coverage-how-fortiedr-protects-against-confluence-cve-2022-26134-post-exploitation-activity-109660"
- "https://www.vulncheck.com/blog/confluence-dreams-of-shells"
- "https://www.volexity.com/blog/2022/06/02/zero-day-exploitation-of-atlassian-confluence/"
- "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_java_susp_child_process_2.yml"
- "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml"
- "https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2023/Exploits/CVE-2023-22518/proc_creation_win_exploit_cve_2023_22518_confluence_tomcat_child_proc.yml"
telemetry_validated: false
required_fields:
- "Timestamp"
- "DeviceId"
- "DeviceName"
- "FileName"
- "ProcessCommandLine"
- "AccountName"
- "AccountSid"
- "InitiatingProcessFileName"
- "InitiatingProcessFolderPath"
- "InitiatingProcessCommandLine"
- "InitiatingProcessAccountName"
- "InitiatingProcessAccountSid"
- "InitiatingProcessParentFileName"
tags:
- behavioural
- java
- tomcat
- webshell
- needs-review
query:
  defender: |
    let Lookback = 1d;
    DeviceProcessEvents
    | where Timestamp > ago(Lookback)
    | where FileName in~ ("cmd.exe", "powershell.exe", "pwsh.exe")
    | extend parent = tolower(InitiatingProcessFileName)
    | extend isJavaOrTomcat = parent in ("java.exe", "javaw.exe", "prunsrv.exe")
        or parent matches regex @"^tomcat[0-9]*\.exe$"
    | extend isProcrunService = InitiatingProcessCommandLine has "//RS//"
    | where isJavaOrTomcat or isProcrunService
    | where InitiatingProcessAccountSid in ("S-1-5-19", "S-1-5-20")
        or InitiatingProcessAccountName in~ ("NETWORK SERVICE", "LOCAL SERVICE", "NETWORKSERVICE", "LOCALSERVICE")
    | where not(tolower(InitiatingProcessFolderPath) has @"\jenkins\")
    | project Timestamp, DeviceId, DeviceName, FileName, ProcessCommandLine, AccountName, AccountSid,
        InitiatingProcessFileName, InitiatingProcessFolderPath, InitiatingProcessCommandLine,
        InitiatingProcessAccountName, InitiatingProcessAccountSid, InitiatingProcessParentFileName
