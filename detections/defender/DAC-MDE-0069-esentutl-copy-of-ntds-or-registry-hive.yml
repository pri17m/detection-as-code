id: DAC-MDE-0069
title: esentutl copy of NTDS or registry hive
description: >-
  esentutl.exe /y copies a database, including a locked file when /vss is set. Attackers use it to
  copy ntds.dit or the SAM, SYSTEM, and SECURITY hives (T1003.003). A hit requires /y and one of
  those targets. Repair mode (/r) and copies of an ordinary mailbox .edb do not match, and a bare
  System32 path is not treated as the SYSTEM hive. Telemetry is Defender Advanced Hunting
  DeviceProcessEvents: FileName, ProcessCommandLine, and InitiatingProcessFileName. Offline
  command-line samples were replayed: the documented malicious lines match and the documented
  benign lines do not. telemetry_validated stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: critical
mitre:
  tactics:
  - credential-access
  techniques:
  - T1003.003
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Domain-controller backup jobs that copy ntds.dit with esentutl."
references:
- https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
- https://attack.mitre.org/techniques/T1003/003/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- lolbas
- parity:DAC-WIN-0336
- parity:DAC-CS-0215
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "esentutl.exe"
    | where ProcessCommandLine contains "/y"
    | where ProcessCommandLine contains "/vss"
        or ProcessCommandLine contains "ntds.dit"
        or ProcessCommandLine contains @"\ntds\"
        or ProcessCommandLine contains @"\config\SAM"
        or ProcessCommandLine contains @"\config\SYSTEM"
        or ProcessCommandLine contains @"\config\SECURITY"
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
