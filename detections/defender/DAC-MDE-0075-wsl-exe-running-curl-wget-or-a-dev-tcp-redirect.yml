id: DAC-MDE-0075
title: wsl.exe running curl, wget, or a /dev/tcp redirect
description: >-
  wsl.exe can run a Linux command from a Windows process creation event (T1059.004). A hit is
  wsl.exe whose command line pairs curl or wget with http(s), or contains /dev/tcp/. wsl --status
  and wsl -l do not match. Curl inside an already-running distro is a different event and is not
  this rule. Telemetry is Defender Advanced Hunting DeviceProcessEvents: FileName,
  ProcessCommandLine, and InitiatingProcessFileName. Offline command-line samples were replayed:
  the documented malicious lines match and the documented benign lines do not. telemetry_validated
  stays false until this search is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: medium
mitre:
  tactics:
  - execution
  techniques:
  - T1059.004
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- FileName
- ProcessCommandLine
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Developers who pass curl to wsl.exe on the Windows command line."
references:
- https://learn.microsoft.com/windows/wsl/basic-commands
- https://attack.mitre.org/techniques/T1059/004/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceprocessevents-table
tags:
- quality-wave
- parity:DAC-WIN-0342
- parity:DAC-CS-0220
query:
  defender: |
    DeviceProcessEvents
    | where FileName =~ "wsl.exe"
    | where ProcessCommandLine contains "/dev/tcp/"
        or ((ProcessCommandLine contains "curl" or ProcessCommandLine contains "wget")
            and (ProcessCommandLine contains "http://" or ProcessCommandLine contains "https://"))
    | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
