id: DAC-MDE-0071
title: UAC bypass registry hijack of ms-settings or mscfile
description: >-
  fodhelper, computerdefaults, and eventvwr auto-elevate and then run the command stored in HKCU
  Software\Classes\ms-settings\shell\open\command. sdclt uses mscfile\shell\open\command
  (T1548.002). A hit is Sysmon seeing a value set on either of those keys. Ordinary Run keys do
  not match. Telemetry is Defender Advanced Hunting DeviceRegistryEvents: RegistryKey,
  RegistryValueName, and RegistryValueData. ActionType is not filtered, because that enum is
  tenant-specific. Offline command-line samples were replayed: the documented malicious lines
  match and the documented benign lines do not. telemetry_validated stays false until this search
  is replayed on a tenant.
author: Detection Engineer
status: experimental
platforms:
- defender
severity: high
mitre:
  tactics:
  - privilege-escalation
  techniques:
  - T1548.002
sourcetypes:
- mde:advanced_hunting
required_fields:
- DeviceName
- RegistryKey
- RegistryValueName
- RegistryValueData
- InitiatingProcessFileName
telemetry_validated: false
false_positives:
- "Lab machines where a detection engineer planted the bypass key."
references:
- https://attack.mitre.org/techniques/T1548/002/
- https://learn.microsoft.com/defender-xdr/advanced-hunting-deviceregistryevents-table
tags:
- quality-wave
- parity:DAC-WIN-0338
query:
  defender: |
    DeviceRegistryEvents
    | where RegistryKey contains @"\Software\Classes\ms-settings\shell\open\command"
        or RegistryKey contains @"\Software\Classes\mscfile\shell\open\command"
    | project Timestamp, DeviceName, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName
