# Field extraction for the lab indexer when the Splunk Add-on for Windows
# is not installed. The WinEventLog modular input already breaks events and
# sets _time. Do not add a LINE_BREAKER here.

[XmlWinEventLog:Security]
KV_MODE = none
REPORT-winevent-data = winevent_xml_data
REPORT-winevent-id = winevent_eventid
EVAL-EventCode = coalesce(EventCode, EventID)

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
KV_MODE = none
REPORT-winevent-data = winevent_xml_data
REPORT-winevent-id = winevent_eventid
EVAL-EventCode = coalesce(EventCode, EventID)

[dac:review]
KV_MODE = json
SHOULD_LINEMERGE = false
