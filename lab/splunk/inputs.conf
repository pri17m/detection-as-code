# Local Windows lab only. Do not copy these index settings into a detection.
# renderXml makes _raw the event XML so props.conf can lift Data Name= fields.

[WinEventLog://Security]
disabled = 0
renderXml = 1
sourcetype = XmlWinEventLog:Security
index = main

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = 1
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
index = main

[monitor://C:\lab\reviews]
disabled = 0
whitelist = review-\d+\.json$
sourcetype = dac:review
index = main
crcSalt = <SOURCE>
